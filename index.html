  /* ---------- 星图：可平移、缩放的世界坐标视图 ---------- */
  const cv = $('#map'), ctx = cv.getContext('2d');
  let view = { k: 1, cx: 0, cy: 0, w: 0, h: 0 }, cam = null;
  const KDEF = () => Math.max(0.45, Math.min(1.3, Math.min(view.w / 1000, (view.h - 90) / 640)));
  const KMIN = () => Math.min(view.w, view.h - 60) / (W.galaxy.GR * 2.2);
  const KMAX = () => KDEF() * 3;
  const clampK = (k) => Math.max(KMIN(), Math.min(KMAX(), k));
  const P = (x, y) => [view.w / 2 + (x - view.cx) * view.k, view.h / 2 + (y - view.cy) * view.k];
  const toWorld = (px, py) => [view.cx + (px - view.w / 2) / view.k, view.cy + (py - view.h / 2) / view.k];
  const SEC = () => W.W / 6;
  const secName = (s) => 'ABCDEF'[Math.max(0, Math.min(5, Math.floor(s.x / SEC())))] + (Math.max(0, Math.min(5, Math.floor(s.y / SEC()))) + 1);
  function fit(recenter) {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.w = r.width; view.h = r.height;
    if (!W) return;
    if (recenter) { const s = W.systems[st.cur]; view.k = KDEF(); view.cx = s.x; view.cy = s.y; cam = null; }
    view.k = clampK(view.k);
    draw();
  }
  function camTo(cx, cy, k, dur = 600) {
    k = clampK(k ?? view.k);
    if (reduce || !dur) { view.cx = cx; view.cy = cy; view.k = k; cam = null; return; }
    cam = { a: { cx: view.cx, cy: view.cy, k: view.k }, b: { cx, cy, k }, t0: performance.now(), dur };
  }
  // 航行时，目标离开视野中心区域就让镜头跟过去
  function follow(sid, dur) {
    const s = W.systems[sid], [x, y] = P(s.x, s.y);
    if (x < view.w * 0.2 || x > view.w * 0.8 || y < view.h * 0.2 || y > view.h * 0.75) camTo(s.x, s.y, view.k, dur || 600);
  }

  // 背景三层：屏幕空间的深蓝底色、随视角缓慢移动的远景星场、世界空间的星系光晕
  let bgCv = null, bgKey = '', starTile = null, glowCv = null;
  function buildBg() {
    const key = view.w + 'x' + view.h;
    if (key !== bgKey || !bgCv) {
      bgKey = key;
      const dpr = window.devicePixelRatio || 1, w = view.w, h = view.h;
      bgCv = document.createElement('canvas'); bgCv.width = Math.round(w * dpr); bgCv.height = Math.round(h * dpr);
      const b = bgCv.getContext('2d'); b.scale(dpr, dpr);
      const g = b.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, Math.max(w, h) * 0.85);
      g.addColorStop(0, '#16336c'); g.addColorStop(0.55, '#0e2452'); g.addColorStop(1, '#060f28');
      b.fillStyle = g; b.fillRect(0, 0, w, h);
    }
    if (!starTile) {
      starTile = document.createElement('canvas'); starTile.width = starTile.height = 512;
      const b = starTile.getContext('2d'), sr = Gen.R('遗星', 'starfield');
      for (let i = 0; i < 260; i++) {
        const x = sr.f() * 512, y = sr.f() * 512, m = Math.pow(sr.f(), 3);
        b.fillStyle = `rgba(${sr.chance(0.2) ? '255,236,210' : '214,228,255'},${0.1 + m * 0.42})`;
        b.beginPath(); b.arc(x, y, 0.4 + m * 0.8, 0, 7); b.fill();
      }
    }
    if (!glowCv) {
      const G = 220, gal = W.galaxy;
      glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = G;
      const b = glowCv.getContext('2d'), img = b.createImageData(G, G);
      for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
        const x = ((i + 0.5) / G) * W.W, y = ((j + 0.5) / G) * W.H, dd = gal.density(x, y);
        const rr = Math.hypot(x - gal.CX, y - gal.CY) / gal.GR, warm = Math.exp(-rr * 6);
        const o = (j * G + i) * 4;
        img.data[o] = 70 + warm * 185; img.data[o + 1] = 105 + warm * 95; img.data[o + 2] = 225 - warm * 80;
        img.data[o + 3] = Math.min(255, Math.pow(dd, 1.3) * 120 + warm * 90);
      }
      b.putImageData(img, 0, 0);
    }
  }

  function draw(now = performance.now()) {
    if (!W || !view.w) return;
    if (cam) {
      const t = Math.min(1, (now - cam.t0) / cam.dur), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      view.cx = cam.a.cx + (cam.b.cx - cam.a.cx) * e; view.cy = cam.a.cy + (cam.b.cy - cam.a.cy) * e;
      view.k = cam.a.k * Math.pow(cam.b.k / cam.a.k, e);
      if (t >= 1) cam = null;
    }
    const k = view.k, w = view.w, h = view.h;
    buildBg();
    ctx.drawImage(bgCv, 0, 0, w, h);
    // 远景星场：视差系数 0.12
    const ox = (((-view.cx * k * 0.12) % 512) + 512) % 512, oy = (((-view.cy * k * 0.12) % 512) + 512) % 512;
    for (let x = ox - 512; x < w; x += 512) for (let y = oy - 512; y < h; y += 512) ctx.drawImage(starTile, x, y);
    // 星系光晕
    const [gx, gy] = P(0, 0);
    ctx.save(); ctx.imageSmoothingEnabled = true; ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glowCv, gx, gy, W.W * k, W.H * k); ctx.restore();
    // 星区网格
    const sec = SEC();
    ctx.strokeStyle = 'rgba(160,190,240,0.07)'; ctx.lineWidth = 1;
    ctx.font = '10.5px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(170,196,240,0.4)';
    for (let i = 0; i <= 6; i++) {
      const [x1, y1] = P(i * sec, 0), [x2, y2] = P(i * sec, W.H); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const [x3, y3] = P(0, i * sec), [x4, y4] = P(W.W, i * sec); ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    }
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { const [x, y] = P(i * sec, j * sec); if (x > -40 && x < w && y > -20 && y < h) ctx.fillText('ABCDEF'[i] + (j + 1), x + 6, y + 14); }
    const vis = (x, y, m = 40) => x > -m && x < w + m && y > -m && y < h + m;
    // 古航道
    if (k > 0.22) {
      ctx.strokeStyle = `rgba(160,190,240,${k > 0.5 ? 0.08 : 0.05})`; ctx.lineWidth = 1; ctx.beginPath();
      for (const [a, b] of W.lanes) {
        const A = W.systems[a], B = W.systems[b], [x1, y1] = P(A.x, A.y), [x2, y2] = P(B.x, B.y);
        if (!vis(x1, y1, 200) && !vis(x2, y2, 200)) continue;
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }
    // 扫描范围
    ctx.fillStyle = 'rgba(143,211,255,0.035)';
    ctx.beginPath(); for (const v of st.visited) { const [x, y] = P(W.systems[v].x, W.systems[v].y); if (!vis(x, y, SCAN * k)) continue; ctx.moveTo(x + SCAN * k, y); ctx.arc(x, y, SCAN * k, 0, Math.PI * 2); } ctx.fill();
    // 你的航迹
    if (st.path.length > 1) {
      ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(143,211,255,0.7)'; ctx.lineWidth = 1.3; ctx.beginPath();
      st.path.forEach((id, i) => { const [x, y] = P(W.systems[id].x, W.systems[id].y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    // 存续文明的当前疆域（只显示扫描范围内的星系）
    for (const s of W.systems) {
      const o = ownerNow[s.id];
      if (o == null || !knownArr[s.id] || !aliveNow(W.civs[o])) continue;
      const [x, y] = P(s.x, s.y); if (!vis(x, y, 60)) continue;
      const R = 30 * k + 8, g = ctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, W.civs[o].color + '38'); g.addColorStop(1, W.civs[o].color + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
    }
    // 恒星。缩得很小时只画光点，名字只标去过的星系
    const lod = k < 0.32;
    const labelAll = k >= 0.55;
    for (const s of W.systems) {
      const [x, y] = P(s.x, s.y); if (!vis(x, y)) continue;
      const star = W.STARS[s.type], v = visArr[s.id] === 1, kn = knownArr[s.id] === 1;
      const sc = Math.max(0.45, 0.7 + k * 0.5) * (v ? 1 : 0.9);
      ctx.globalAlpha = v ? 1 : kn ? 0.85 : 0.45;
      if (lod && s.type !== 'S') { ctx.fillStyle = star.color; ctx.beginPath(); ctx.arc(x, y, v ? 1.9 : 1.2, 0, 7); ctx.fill(); }
      else drawStar(star, x, y, s.type === 'S' ? Math.max(0.8, k * 1.4) : sc, now);
      ctx.globalAlpha = 1;
      const rad = lod ? 3 : 7 * sc;
      const civs = civAtArr[s.id];
      if (civs.length && !lod) {
        const gap = civs.length > 1 ? 0.35 : 0, seg = (Math.PI * 2) / civs.length;
        ctx.lineWidth = 1.6;
        civs.forEach((cid, i) => { ctx.strokeStyle = W.civs[cid].color; ctx.beginPath(); ctx.arc(x, y, rad + 3, -Math.PI / 2 + i * seg + gap / 2, -Math.PI / 2 + (i + 1) * seg - gap / 2); ctx.stroke(); });
      }
      if (kn && unsArr[s.id]) {
        ctx.fillStyle = '#ffd27a'; const dx = x + rad + (lod ? 2 : 4), dy = y + rad + 1, q = lod ? 2.6 : 3.5;
        ctx.beginPath(); ctx.moveTo(dx, dy - q); ctx.lineTo(dx + q, dy); ctx.lineTo(dx, dy + q); ctx.lineTo(dx - q, dy); ctx.closePath(); ctx.fill();
      }
      const isCur = s.id === st.cur || s.id === st.sel;
      if (s.type === 'S' || isCur || (kn && labelAll) || (v && k >= 0.3)) {
        ctx.font = isCatalog(s.id) ? '10.5px "IBM Plex Mono", monospace' : (s.id === st.cur ? '600 ' : '') + '12.5px "Noto Serif SC", serif';
        ctx.fillStyle = s.id === st.cur ? '#ffffff' : v ? 'rgba(234,242,255,0.88)' : 'rgba(152,174,212,0.8)';
        ctx.fillText(nameOf(s.id), x + rad + 5, y - rad + 1);
      }
    }
    // 选中框
    if (st.sel !== st.cur) {
      const s = W.systems[st.sel], [x, y] = P(s.x, s.y), r = 11, l = 4;
      ctx.strokeStyle = '#eaf2ff'; ctx.lineWidth = 1.2; ctx.beginPath();
      for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        ctx.moveTo(x + dx * r, y + dy * (r - l)); ctx.lineTo(x + dx * r, y + dy * r); ctx.lineTo(x + dx * (r - l), y + dy * r);
      }
      ctx.stroke();
    }
    // 当前位置（含航行动画）
    let [cx, cy] = P(W.systems[st.cur].x, W.systems[st.cur].y);
    if (anim) {
      const t = Math.min(1, (now - anim.t0) / anim.dur), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const a = W.systems[anim.from], b = W.systems[anim.to];
      [cx, cy] = P(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
      if (t >= 1) anim = null;
    }
    const pulse = reduce ? 0 : (Math.sin(now / 520) + 1) / 2;
    ctx.strokeStyle = `rgba(143,211,255,${0.95 - pulse * 0.45})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 12 + pulse * 3, 0, 7); ctx.stroke();
    // 当前位置在视野外时，在边缘画一个指向它的箭头
    if (!vis(cx, cy, -10)) {
      const ang = Math.atan2(cy - h / 2, cx - w / 2), ex = Math.max(18, Math.min(w - 18, w / 2 + Math.cos(ang) * w)), ey = Math.max(18, Math.min(h - 18, h / 2 + Math.sin(ang) * h));
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang); ctx.fillStyle = '#8fd3ff';
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-3, 0); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    drawMini();
  }
  function drawStar(star, x, y, sc, now) {
    const c = star.color, g = star.glyph;
    const glow = (r, a) => { const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c + a); gr.addColorStop(1, c + '00'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
    const disc = (r, col) => { ctx.fillStyle = col || c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
    const rays = (n, L, w, off = 0) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); for (let i = 0; i < n; i++) { const a = off + (i * Math.PI * 2) / n; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); } ctx.stroke(); };
    if (g === 'dwarf') { glow(6 * sc, '40'); disc(2.6 * sc); }
    else if (g === 'sun') { glow(10 * sc, '50'); disc(3.4 * sc); }
    else if (g === 'bright') { glow(10 * sc, '45'); rays(4, 9 * sc, 0.8); disc(3.4 * sc); }
    else if (g === 'giant') { glow(15 * sc, '55'); rays(4, 12 * sc, 1); rays(4, 7 * sc, 0.8, Math.PI / 4); disc(4.4 * sc); }
    else if (g === 'white') { ctx.strokeStyle = c; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(x, y, 5 * sc, 0, 7); ctx.stroke(); disc(1.8 * sc); }
    else if (g === 'pulsar') {
      const a = reduce ? 0.4 : now / 900;
      ctx.fillStyle = c + 'bb';
      for (const s of [1, -1]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a + s * 0.12 + (s < 0 ? Math.PI : 0)) * 11 * sc, y + Math.sin(a + s * 0.12 + (s < 0 ? Math.PI : 0)) * 11 * sc); ctx.lineTo(x + Math.cos(a - s * 0.12 + (s < 0 ? Math.PI : 0)) * 11 * sc, y + Math.sin(a - s * 0.12 + (s < 0 ? Math.PI : 0)) * 11 * sc); ctx.closePath(); ctx.fill(); }
      disc(1.8 * sc, '#ffffff');
    }
    else if (g === 'hole') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.3);
      ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 0, 9 * sc, 3.2 * sc, 0, 0, 7); ctx.stroke(); ctx.restore();
      disc(3.8 * sc, '#050a18'); ctx.strokeStyle = c + '99'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x, y, 3.8 * sc, 0, 7); ctx.stroke();
    }
    else if (g === 'core') {
      glow(46 * sc, '70'); glow(18 * sc, 'aa');
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35);
      const rot = reduce ? 0 : now / 4000;
      for (let i = 0; i < 3; i++) { ctx.strokeStyle = c + ['dd', '88', '44'][i]; ctx.lineWidth = 2.2 - i * 0.6; ctx.beginPath(); ctx.ellipse(0, 0, (16 + i * 7) * sc, (5 + i * 2.2) * sc, rot * (i % 2 ? -1 : 1) * 0.05, 0, 7); ctx.stroke(); }
      ctx.restore();
      disc(7 * sc, '#030712'); ctx.strokeStyle = c; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, 7 * sc, 0, 7); ctx.stroke();
    }
  }
  // 全星系小地图
  const mm = $('#mm'), mctx = mm.getContext('2d');
  function drawMini() {
    const r = mm.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1, S = r.width;
    if (mm.width !== Math.round(S * dpr)) { mm.width = mm.height = Math.round(S * dpr); }
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mctx.fillStyle = '#071230'; mctx.fillRect(0, 0, S, S);
    mctx.globalCompositeOperation = 'lighter'; mctx.drawImage(glowCv, 0, 0, S, S); mctx.drawImage(glowCv, 0, 0, S, S); mctx.globalCompositeOperation = 'source-over';
    const f = S / W.W;
    mctx.fillStyle = 'rgba(255,210,122,0.9)';
    for (const x of W.systems) if (knownArr[x.id] && unsArr[x.id]) mctx.fillRect(x.x * f - 1, x.y * f - 1, 2, 2);
    mctx.fillStyle = '#8fd3ff';
    for (const v of st.visited) { const x = W.systems[v]; mctx.fillRect(x.x * f - 1, x.y * f - 1, 2.2, 2.2); }
    const c = W.systems[st.cur]; mctx.fillStyle = '#ffffff'; mctx.beginPath(); mctx.arc(c.x * f, c.y * f, 2.6, 0, 7); mctx.fill();
    const [x0, y0] = toWorld(0, 0), [x1, y1] = toWorld(view.w, view.h);
    mctx.strokeStyle = 'rgba(234,242,255,0.85)'; mctx.lineWidth = 1; mctx.strokeRect(x0 * f, y0 * f, (x1 - x0) * f, (y1 - y0) * f);
  }
  function loop(t) { draw(t); requestAnimationFrame(loop); }

  // ---- 交互：拖动平移、滚轮与双指缩放、点击选择 ----
  const ptrs = new Map();
  let drag = null, pinch = null;
  const local = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function zoomAt(px, py, k2) {
    k2 = clampK(k2);
    const [wx, wy] = toWorld(px, py);
    view.k = k2; view.cx = wx - (px - view.w / 2) / k2; view.cy = wy - (py - view.h / 2) / k2;
    cam = null; draw();
  }
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size === 1) { const [x, y] = local(e); drag = { x, y, cx: view.cx, cy: view.cy, moved: false }; cam = null; }
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k }; if (drag) drag.moved = true;
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, local(e));
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch.k * (d / pinch.d));
    } else if (drag) {
      const [x, y] = local(e), dx = x - drag.x, dy = y - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
      if (drag.moved) { view.cx = drag.cx - dx / view.k; view.cy = drag.cy - dy / view.k; cv.classList.add('dragging'); draw(); }
    }
  });
  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const single = ptrs.size === 1;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (single && drag && !drag.moved && e.type === 'pointerup') clickAt(...local(e));
    if (!ptrs.size) { drag = null; cv.classList.remove('dragging'); }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, view.k * Math.exp(-e.deltaY * 0.0016)); }, { passive: false });
  function clickAt(mx, my) {
    let best = null, bd = 22;
    for (const s of W.systems) { const [px, py] = P(s.x, s.y); const d = Math.hypot(px - mx, py - my); if (d < bd) { bd = d; best = s.id; } }
    if (best == null) return;
    if (best === st.sel && best !== st.cur) travel(best);
    else select(best, 'sys');
  }
  mm.addEventListener('click', (e) => {
    const r = mm.getBoundingClientRect(), f = W.W / r.width;
    camTo((e.clientX - r.left) * f, (e.clientY - r.top) * f, view.k, 500);
  });
  $('#z-in').onclick = () => camTo(view.cx, view.cy, view.k * 1.6, 300);
  $('#z-out').onclick = () => camTo(view.cx, view.cy, view.k / 1.6, 300);
  $('#z-me').onclick = () => { const s = W.systems[st.cur]; camTo(s.x, s.y, KDEF(), 600); };
  $('#z-all').onclick = () => camTo(W.galaxy.CX, W.galaxy.CY, KMIN(), 700);

  /* ---------- 启动 ---------- */
  document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; freshIds = new Set(); renderPane(); }));
  $('#seedform').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#seed').value.trim() || '001'; tab = 'sys'; load(v); });
  $('#rand').onclick = () => { const v = Math.random().toString(36).slice(2, 7); tab = 'sys'; load(v, true); };
  new ResizeObserver(() => fit()).observe($('#mapwrap'));
  load(store.get(LAST) || '遗星-001');
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
