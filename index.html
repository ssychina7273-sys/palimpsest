<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="遗星志：一个由种子生成的螺旋星系。航行、勘测遗迹，拼回数十个文明三千年的因果历史。">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>遗星志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 布局：左侧星图（主角），右侧档案面板；窄屏上下堆叠。单一深色主题：夜间星图室 */
:root {
  /* 深空蓝：星图是最深的一层，面板浅一档，强调色取星光的冷青 */
  --ink: #0f2148;
  --ink-2: #16305e;
  --ink-3: #1f3d73;
  --line: #2d4d86;
  --fg: #eaf2ff;
  --fg-2: #c6d6f0;
  --muted: #98aed4;
  --faint: #6a84b2;
  --brass: #8fd3ff;
  --brass-dim: #4677b4;
  --signal: #ffd27a;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- 顶栏 ---------- */
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0b1838, var(--ink));
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 24px; letter-spacing: 0.18em; }
.brand span { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.seedbox { display: flex; align-items: center; gap: 6px; }
.seedbox label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.seedbox input {
  width: 9em; background: var(--ink-2); border: 1px solid var(--line); color: var(--fg); border-radius: 4px;
  padding: 5px 8px; font-family: var(--mono); font-size: 13px;
}
.btn {
  background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 11px; cursor: pointer; font-size: 13px;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--brass-dim); background: var(--ink-3); }
.btn.primary { border-color: var(--brass); color: #0b1a3a; background: var(--brass); font-weight: 600; }
.btn.primary:hover { background: #b4e3ff; }
.btn[disabled] { opacity: .45; cursor: default; }
.status { margin-left: auto; display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { color: var(--fg); font-weight: 500; }
.status { flex-wrap: wrap; row-gap: 6px; align-items: center; }
.status > span { white-space: nowrap; }
.status .now { color: var(--brass); padding: 2px 10px; border: 1px solid var(--brass-dim); border-radius: 12px; }
.status .now b { color: var(--brass); }

/* ---------- 主体 ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 410px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; display: block; }
.mapbar {
  position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: rgba(15, 33, 72, .82); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; backdrop-filter: blur(6px);
}
.mapbar .where { font-family: var(--serif); font-weight: 600; font-size: 15px; }
.mapbar .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mapbar .act { margin-left: auto; }
.legend { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); z-index: 2; }
.legend summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(15,33,72,.82); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::before { content: "+"; color: var(--brass); }
.legend[open] summary::before { content: "−"; }
.lg { margin-top: 6px; display: grid; grid-template-columns: repeat(2, max-content); gap: 6px 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: rgba(15,33,72,.94); box-shadow: 0 8px 24px rgba(3,10,30,.35); }
.lg span { display: inline-flex; align-items: center; gap: 7px; }
.lg .mono { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--fg); width: 18px; text-align: center; }
.ico { flex: none; display: block; }
.sicon { display: inline-flex; vertical-align: -4px; margin-right: 8px; }
.mapbar .ico { margin-right: -4px; }
.civ h3 .sp { font-family: var(--sans); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; }
.civ dd .sub { display: block; color: var(--muted); font-size: 12px; }
.toast {
  position: absolute; top: 12px; right: 14px; max-width: min(320px, calc(100% - 28px));
  background: var(--ink-3); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 8px 12px; font-size: 13px;
  transition: opacity .3s, transform .3s; opacity: 0; transform: translateY(-6px); pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* ---------- 面板 ---------- */
aside.panel { border-left: 1px solid var(--line); background: var(--ink-2); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button {
  flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 4px 9px; cursor: pointer; color: var(--muted);
  font-size: 13px; letter-spacing: .06em;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tabs button .n { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 3px; }
.pane { overflow-y: auto; padding: 18px; padding-bottom: 32px; flex: 1; min-height: 0; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sysname { font-family: var(--serif); font-weight: 900; font-size: 28px; letter-spacing: .08em; margin: 4px 0 2px; text-wrap: balance; }
.starline { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 2px; margin-left: 6px; font-family: var(--sans); }
.chip.here { border-color: var(--brass-dim); color: var(--brass); }
.note { color: var(--muted); font-size: 13px; margin: 14px 0; }
.guide { margin: 16px 0 4px; padding: 12px 14px; border: 1px solid var(--brass-dim); border-radius: 6px; background: rgba(143,211,255,.07); font-size: 13px; }
.guide b { color: var(--brass); font-weight: 600; }
.guide ol { margin: 6px 0 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--fg-2); }
.mm { position: absolute; top: 46px; left: 14px; z-index: 1; width: 150px; height: 150px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #071230; }
.zoomctl { position: absolute; right: 14px; bottom: 78px; z-index: 1; display: grid; gap: 4px; }
.zoomctl button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: rgba(15,33,72,.82); color: var(--fg); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
.zoomctl button:hover { border-color: var(--brass); color: var(--brass); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,15,40,.75); color: var(--fg-2); font-family: var(--serif); font-size: 15px; letter-spacing: .1em; z-index: 3; }
.loading[hidden] { display: none; }
canvas#map { touch-action: none; cursor: grab; }
canvas#map.dragging { cursor: grabbing; }
@media (max-width: 860px) { .mm { width: 104px; height: 104px; } .zoomctl { bottom: 100px; } .toast { top: 46px; left: 130px; right: 14px; max-width: none; } }
.codex { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.centry { padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: rgba(143,211,255,.04); min-width: 0; }
.centry b { font-family: var(--serif); font-size: 14px; }
.centry .cwho { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.centry p { margin: 5px 0 6px; font-size: 12px; color: var(--fg-2); line-height: 1.55; }
.centry .cciv { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.centry.dim { opacity: .5; border-style: dashed; }
.centry.dim p { color: var(--muted); }
.goline { margin: 14px 0 4px; display: flex; align-items: center; gap: 12px; }
.goline .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.owned { margin: 16px 0 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owned p { margin: 0; flex: 1 1 180px; font-size: 13px; }

.planets { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); }
.planet { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.planet .num { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--serif); font-size: 12px; color: var(--muted); }
.planet .ttl { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.planet .ttl .kind { font-weight: 400; color: var(--muted); font-size: 12px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid; }
.tag.hab { color: #92e3ad; border-color: #2f6b5a; }
.tag.sig { color: var(--signal); border-color: #8a7444; }
.planet .data { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.planet .do { margin-top: 8px; }

.frag { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--c, var(--brass)); }
.frag .find { font-family: var(--serif); font-size: 13.5px; line-height: 1.75; }
.frag .infer { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.frag .infer b { color: var(--fg); font-weight: 600; }
.frag.new { animation: glow 2.2s ease-out; }
@keyframes glow { from { background: rgba(143, 211, 255, .14); } to { background: transparent; } }

.civtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.civtag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

/* 编年史 */
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
.progress div { height: 100%; background: var(--brass); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.filters button { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.filters button[aria-pressed="true"] { border-color: var(--brass-dim); color: var(--fg); background: var(--ink-3); }
.chron { list-style: none; margin: 10px 0 0; padding: 0; }
.entry { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.entry .yr { font-family: var(--mono); font-size: 12px; color: var(--brass); font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right; }
.entry .yr small { display: block; color: var(--faint); font-size: 10px; }
.entry .sum { font-family: var(--serif); font-size: 14px; line-height: 1.7; }
.entry .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.entry .meta button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; font-size: 12px; }
.entry .meta button:hover { color: var(--fg); }
.cause { margin-top: 6px; font-size: 12px; color: var(--muted); }
.cause.open { color: var(--faint); font-style: italic; }
.cause span.k { font-family: var(--mono); color: var(--brass-dim); margin-right: 4px; }
.toast .tnews { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); }
.toast .tnews b { display: block; color: var(--brass); font-weight: 600; font-size: 12px; }
.recent { margin: 14px 0 4px; padding: 10px 12px; border: 1px solid var(--brass-dim); border-radius: 6px; background: rgba(143,211,255,.05); display: grid; gap: 6px; }
.recent .ritem { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; font-size: 13px; }
.recent .rd { font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--brass); padding-top: 2px; }
.entry.live .yr { color: var(--brass); }
.entry.live .sum::before { content: "●"; color: var(--brass); font-size: 9px; vertical-align: 3px; margin-right: 6px; }
.civ dd.alive { color: #92e3ad; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; line-height: 1.8; }

/* 文明 */
.civ { padding: 16px 0; border-bottom: 1px solid var(--line); }
.civ h3 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 19px; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; }
.civ h3::before { content: ""; width: 12px; height: 12px; border-radius: 2px; background: var(--c); }
.civ dl { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 3px 10px; margin: 10px 0; font-size: 13px; }
.civ dt { color: var(--muted); }
.civ dd { margin: 0; }
.civ dd.unk { color: var(--faint); }
.track { position: relative; height: 18px; margin-top: 8px; }
.track .axis { position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: var(--line); }
.track .span { position: absolute; top: 7px; height: 3px; background: var(--c); opacity: .45; border-radius: 2px; }
.track .dot { position: absolute; top: 5px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--c); }
.ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.civ .cnt { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }

/* 原理 */
.about h2 { font-family: var(--serif); font-weight: 900; font-size: 18px; margin: 22px 0 6px; letter-spacing: .05em; }
.about h2:first-child { margin-top: 0; }
.about p { margin: 6px 0; color: var(--fg-2); max-width: 65ch; font-size: 13.5px; }
.about code { font-family: var(--mono); font-size: 12px; background: var(--ink-3); padding: 1px 5px; border-radius: 3px; color: var(--fg); }
.about pre { font-family: var(--mono); font-size: 11.5px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; color: var(--muted); line-height: 1.7; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-top: 10px; }
.stats div { background: var(--ink-2); padding: 9px 12px; }
.stats b { display: block; font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  html, body { height: auto; }
  body { overflow: auto; display: block; }
  .status { margin-left: 0; width: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 68vh; min-height: 420px; max-height: 720px; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .frag.new { animation: none; } .toast { transition: none; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand"><h1>遗星志</h1><span>星域考古模拟</span></div>
  <form class="seedbox" id="seedform">
    <label for="seed">种子</label>
    <input id="seed" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">生成</button>
    <button class="btn" type="button" id="rand">随机</button>
  </form>
  <div class="status" id="status"></div>
</header>
<main>
  <section class="mapwrap" id="mapwrap" aria-label="星图">
    <canvas id="map"></canvas>
    <details class="legend" id="legend"><summary>图例</summary><div class="lg" id="lg"></div></details>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas class="mm" id="mm" aria-label="全星系小地图，点击移动视野"></canvas>
    <div class="zoomctl" role="group" aria-label="星图视角">
      <button type="button" id="z-in" title="放大">+</button>
      <button type="button" id="z-out" title="缩小">−</button>
      <button type="button" id="z-me" title="回到当前位置">◎</button>
      <button type="button" id="z-all" title="纵览全星系">⤢</button>
    </div>
    <div class="loading" id="loading">正在生成星系并推演三千年历史…</div>
    <div class="mapbar" id="mapbar"></div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-sys" data-tab="sys" aria-selected="true">星系</button>
      <button role="tab" id="t-chron" data-tab="chron" aria-selected="false">编年史</button>
      <button role="tab" id="t-civ" data-tab="civ" aria-selected="false">文明</button>
      <button role="tab" id="t-about" data-tab="about" aria-selected="false">原理</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<script>
/* ===== 遗星志 · 生成器 =====
   同一个种子 → 同一片星域、同一段历史。
   1) 布局：恒星位置与航道
   2) 恒星系：恒星类型 → 行星轨道 → 温度 → 大气 → 气候
   3) 文明：从宜居行星中选出母星，物种形态由母星气候决定
   4) 历史：按 50 年一步推演，事件由条件触发，并记录"起因"
*/
const Gen = (() => {
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return () => {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function R(...parts) {
    const f = mulberry32(xmur3(parts.join('|'))());
    const r = {
      f,
      int: (a, b) => a + Math.floor(f() * (b - a + 1)),
      range: (a, b) => a + f() * (b - a),
      pick: (arr) => arr[Math.floor(f() * arr.length)],
      chance: (p) => f() < p,
      weighted: (pairs) => {
        let t = 0; for (const [, w] of pairs) t += w;
        let x = f() * t;
        for (const [v, w] of pairs) { if ((x -= w) < 0) return v; }
        return pairs[pairs.length - 1][0];
      },
      shuffle: (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;

      const type = sr.weighted(Object.entries(STARS).filter(([, v]) => v.w > 0).map(([k, v]) => [k, v.w]));
      const st = STARS[type];
      const lum = sr.range(st.lum[0], st.lum[1]);
      const sys = { id, x, y, name, catalog: true, namedBy: null, type, lum, planets: genPlanets(sr, st, lum) };
      systems.push(sys); put(sys);
    }
    const n = systems.length;

    // 航道：最小生成树保证全图连通，再连上每个星系最近的两个邻居
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const edges = new Set();
    const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
    {
      const inT = new Uint8Array(n), bestD = new Float64Array(n).fill(Infinity), bestF = new Int32Array(n).fill(-1);
      bestD[0] = 0;
      for (let it = 0; it < n; it++) {
        let u = -1, ud = Infinity;
        for (let i = 0; i < n; i++) if (!inT[i] && bestD[i] < ud) { ud = bestD[i]; u = i; }
        inT[u] = 1;
        if (bestF[u] >= 0) edges.add(key(u, bestF[u]));
        const su = systems[u];
        for (let v = 0; v < n; v++) if (!inT[v]) { const dd = d(su, systems[v]); if (dd < bestD[v]) { bestD[v] = dd; bestF[v] = u; } }
      }
    }
    for (const s of systems) {
      const gx = Math.floor(s.x / CELL), gy = Math.floor(s.y / CELL), near = [];
      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) { const L = grid.get(gk(gx + i, gy + j)); if (L) for (const o of L) if (o !== s) near.push(o); }
      near.sort((a, b) => d(s, a) - d(s, b));
      for (let k = 0; k < 2 && k < near.length; k++) if (d(s, near[k]) < 150) edges.add(key(s.id, near[k].id));
    }
    const lanes = [...edges].map((e) => e.split('-').map(Number));
    const adj = systems.map(() => []);
    for (const [a, b] of lanes) { adj[a].push(b); adj[b].push(a); }
    const hops = (from) => {
      const dist = new Array(n).fill(Infinity); dist[from] = 0; const q = [from];
      for (let qi = 0; qi < q.length; qi++) { const c = q[qi]; for (const m of adj[c]) if (dist[m] === Infinity) { dist[m] = dist[c] + 1; q.push(m); } }
      return dist;
    };

    // ===== 文明 =====
    const cr = R(seed, 'civs');
    const civCount = Math.round(n / 40) + cr.int(-2, 2);
    const spPool = cr.shuffle(SPECIES);
    const allPl = [];
    for (const x of systems) if (x.type !== 'S') x.planets.forEach((p) => allPl.push([x.id, p.i]));
    const homes = [], homeSp = [], homeHops = [];
    for (let i = 0; i < civCount; i++) {
      const spc = spPool[i % spPool.length];
      const free = (c) => !homes.some((h) => h[0] === c[0]);
      const starOk = (c) => (spc.stars ? spc.stars.includes(systems[c[0]].type) : !'BNH'.includes(systems[c[0]].type));
      const cand = cr.shuffle(allPl.filter((c) => free(c) && starOk(c) && spc.homes.includes(systems[c[0]].planets[c[1]].climate)));
      let pick = null;
      for (const need of [6, 5, 4, 3, 2, 1]) { pick = cand.find((c) => homeHops.every((h) => h[c[0]] >= need)); if (pick) break; }
      if (!pick) {
        // 找不到合适的母星时，改造一颗行星的环境
        let opts = cr.shuffle(allPl.filter((c) => free(c) && starOk(c)));
        if (!opts.length) opts = cr.shuffle(allPl.filter(free));
        pick = opts.find((c) => homeHops.every((h) => h[c[0]] >= 4)) || opts[0];
        const p = systems[pick[0]].planets[pick[1]], cl = spc.homes[0];
        p.climate = cl;
        if (cl.includes('气态') || cl === '冰巨星') { p.kind = cl === '冰巨星' ? 'ice' : 'gas'; p.atmo = '—'; }
        else { if (p.kind === 'gas' || p.kind === 'ice') p.kind = 'rock'; p.atmo = CLIMATE_ATMO[cl] || '适中'; p.T = CLIMATE_T[cl] || p.T; p.hab = !CLIMATE_ATMO[cl] && cl in CLIMATE_T; }
      }
      homes.push(pick); homeSp.push(spc); homeHops.push(hops(pick[0]));
    }

    const civs = [];
    const langPool = cr.shuffle(LANGS);
    // 星系在第一次被某个文明占据时，以该文明的语言命名
    const claim = (sid, c) => {
      const s = systems[sid];
      if (!s.catalog) return;
      const nr = R(seed, 'sysname', sid);
      let nm, g = 0;
      do { const n = nr.int(2, 3); nm = langWord(nr, c.lang, n, n === 2 ? 0.55 : 0.1); } while ((!speakable(nm, 4, 10) || used.has(nm)) && g++ < 200);
      used.add(nm); s.name = nm; s.catalog = false; s.namedBy = c.id;
    };
    const makeCiv = (home, origin, parent, spc) => {
      const id = civs.length;
      const rr = R(seed, 'civ', id);
      const lang = parent ? parent.lang : langPool[id % langPool.length];
      const syl = null, end = null;
      let name;
      do { name = langWord(rr, lang, rr.int(1, 2), parent ? 0.9 : 0.55); } while ((!speakable(name, 4, 8) || used.has(name)) && rr.f() < 0.999);
      used.add(name);
      const S = parent ? parent.sp : spc;
      const civ = {
        id, name, lang, langLabel: lang.label, color: civColor(id),
        sp: S, species: S.label, who: name + S.who,
        culture: parent ? [parent.culture[0], rr.pick(S.cult.filter((x) => x !== parent.culture[0]))] : rr.shuffle(S.cult).slice(0, 2),
        society: rr.pick(S.pol),
        ethos: rr.pick(S.ethos || ETHOS),
        home, origin, parent: parent ? parent.id : null, alive: true, endYear: null, fate: null,
        tech: parent ? parent.tech : S.tech0, stab: 0.65, territory: new Set([home[0]]),
        space: !!parent, lastNeg: null, lastColony: null, events: [], contacted: new Set(),
        trade: new Set(), rel: {}, unrestAt: -9999, dug: new Set(), founded: !!parent,
      };
      civ.polity = () => civ.name + civ.society;
      civs.push(civ);
      return civ;
    };
    homes.forEach((h, i) => makeCiv(h, i === 0 || homeSp[i].early ? cr.int(0, 3) * 50 : cr.int(0, 20) * 50, null, homeSp[i]));

    // ===== 历史推演 =====
    const PRESENT = 3000, STEP = 50;
    const owner = systems.map(() => null);
    const ruins = systems.map(() => new Set());
    const events = [];
    const contactEv = {};
    const wars = [];
    const pk = (a, b) => (a < b ? a + ':' + b : b + ':' + a);
    const er = R(seed, 'history');

    const plName = (sid, pl) => (pl < 0 ? systems[sid].name + '星系深空' : systems[sid].name + ' ' + ROMAN[pl]);
    const pickPlanet = (sid, prefer) => {
      const ps = systems[sid].planets;
      if (!ps.length) return -1;
      const solid = ps.filter((p) => p.kind !== 'gas' && p.kind !== 'ice');
      if (prefer === 'gas') { const g = ps.filter((p) => p.kind === 'gas' || p.kind === 'ice'); if (g.length) return er.pick(g).i; }
      if (prefer === 'hab') { const h = ps.filter((p) => p.hab); if (h.length) return er.pick(h).i; }
      if (solid.length && (prefer === 'solid' || er.chance(0.8))) return er.pick(solid).i;
      return er.pick(ps).i;
    };
    const ev = (o) => {
      o.id = events.length;
      if (!o.live) o.y = Math.min(o.y, PRESENT);
      o.sum = sp(o.sum); o.trace = sp(o.trace);
      events.push(o);
      civs[o.civ].events.push(o.id);
      if (o.other != null) civs[o.other].events.push(o.id);
      return o.id;
    };
    const border = (a, b) => {
      const out = [];
      for (const s of a.territory) for (const n of adj[s]) if (b.territory.has(n)) out.push([s, n]);
      return out;
    };
    const relInit = (a, b) => {
      let v = er.range(-0.3, 0.3) + a.sp.amity + b.sp.amity;
      if (a.ethos === b.ethos) v += 0.2;
      if (a.ethos === '扩张' || b.ethos === '扩张') v -= 0.2;
      if (a.ethos === '贸易' || b.ethos === '贸易') v += 0.2;
      if ((a.ethos === '信仰' && b.ethos === '求知') || (b.ethos === '信仰' && a.ethos === '求知')) v -= 0.2;
      return v;
    };
    const getRel = (a, b) => a.rel[b.id] ?? 0;
    const setRel = (a, b, v) => { v = Math.max(-1, Math.min(1, v)); a.rel[b.id] = v; b.rel[a.id] = v; };
    const collapse = (c, y, cause, conquered) => {
      if (!c.alive) return;
      if (!conquered && c.tech >= 5 && er.chance(0.5)) {
        const sid = c.home[0];
        cause = ev({ y, type: 'exodus', civ: c.id, sys: sid, pl: c.home[1], cause,
          sum: `${c.polity()}在衰落中建造方舟舰队，驶离了本星域。`,
          trace: `${plName(sid, c.home[1])}轨道上的巨型船坞已经空置。最后一次发射的航向记录指向星域之外，此后没有回传信号。` });
      }
      const sid = conquered ? c.home[0] : c.home[0];
      ev({ y, type: 'collapse', civ: c.id, sys: sid, pl: c.home[1], cause,
        sum: conquered ? `${c.polity()}失去最后的领土，作为独立文明不复存在。` : `${c.polity()}瓦解，此后不再留下任何记录。`,
        trace: conquered
          ? `母星的城市在同一时期遭到摧毁，焦土层厚达数米。此后的地层中只有征服者的建筑。`
          : `所有官方记录在同一年中断。城市没有遭受破坏的迹象，只是被逐渐遗弃，风沙填满了街道。` });
      c.alive = false; c.endYear = y; c.fate = conquered ? '被征服' : '瓦解';
      for (const s of c.territory) { owner[s] = null; ruins[s].add(c.id); }
      c.territory.clear();
      for (const w of wars) if (!w.over && (w.a === c.id || w.b === c.id)) w.over = true;
    };

    for (let y = 0; y <= PRESENT; y += STEP) {
      const alive = civs.filter((c) => c.alive && c.origin <= y);
      for (const c of er.shuffle(alive)) {
        if (!c.alive) continue;
        if (!c.founded) {
          c.founded = true; owner[c.home[0]] = c.id; claim(c.home[0], c);
          const p = systems[c.home[0]].planets[c.home[1]];
          c.lastNeg = null;
          c.foundEv = ev({ y, type: 'found', civ: c.id, sys: c.home[0], pl: c.home[1], cause: null,
            sum: c.sp.foundAt === 'star' ? `${c.species}${c.who}在 ${systems[c.home[0]].name} 的恒星日冕中觉醒，建立了${c.polity()}。` : `${c.species}${c.who}在${/[星体界]$/.test(p.climate) ? p.climate : p.climate + '行星'}${plName(c.home[0], c.home[1])}上${c.sp.foundVerb || '崛起'}，建立了${c.polity()}。`,
            trace: `这里发现${c.sp.city}。最古老的部分使用一种早期的${c.sp.script}，其中反复出现「${c.name}」这个名字，旁边是母星的星图。` });
          continue;
        }
        // 基础演化
        const atWar = wars.filter((w) => !w.over && (w.a === c.id || w.b === c.id)).length;
        c.tech = Math.min(10, c.tech + er.range(0.05, 0.19) + c.sp.tech + (c.ethos === '求知' ? 0.06 : 0) + c.trade.size * 0.03);
        c.stab += (c.sp.stab - c.stab) * 0.12 + er.range(-0.06, 0.06) - atWar * 0.06 - Math.max(0, c.territory.size - 6) * 0.012 + c.trade.size * 0.01;
        c.stab = Math.max(0, Math.min(1, c.stab));

        if (!c.space && c.tech >= 3) {
          c.space = true;
          c.lastColony = ev({ y, type: 'space', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.foundEv,
            sum: `${c.polity()}首次进入太空。`,
            trace: `${plName(c.home[0], c.home[1])}的高轨道上发现${c.sp.ship}。内部保留着航行记录，用的是${c.name}${c.sp.script}。` });
          continue;
        }
        // 殖民
        const pCol = { 扩张: 0.4, 贸易: 0.22, 求知: 0.2, 信仰: 0.18, 隐修: 0.07 }[c.ethos] * c.sp.col;
        if (c.space && er.chance(pCol)) {
          const opts = [];
          for (const s of c.territory) for (const n of adj[s]) if (owner[n] == null && systems[n].planets.length && !opts.includes(n)) opts.push(n);
          if (opts.length) {
            const sid = er.pick(opts); const pl = pickPlanet(sid, c.sp.prefer || 'solid');
            owner[sid] = c.id; c.territory.add(sid); claim(sid, c);
            const hadRuin = [...ruins[sid]].filter((x) => x !== c.id);
            c.lastColony = ev({ y, type: 'colony', civ: c.id, sys: sid, pl, cause: c.lastColony,
              sum: `${c.polity()}在${systems[sid].name}星系建立殖民地。`,
              trace: c.sp.settle ? `${plName(sid, pl)}${c.sp.settle.startsWith('的') ? '' : '上'}${c.sp.settle}` : er.pick([
                `${plName(sid, pl)}上有一处规划整齐的定居点，建筑使用统一规格的预制模块。奠基碑上用${c.sp.script}刻着首批移民的名单，共 ${er.int(40, 900)} 个名字。`,
                `${plName(sid, pl)}上发现一座穹顶聚落，气闸门上印着${c.who}的徽记。仓库里还留有几批没有开封的补给。`,
                `一条从${plName(sid, pl)}延伸到轨道的货运缆索，底座的铭牌用${c.sp.script}记录了殖民地的建立年份。`,
              ]) });
            if (hadRuin.length && !c.dug.has(hadRuin[0]) && er.chance(0.7)) {
              const old = civs[hadRuin[0]]; c.dug.add(old.id);
              const ce = events.find((e) => e.civ === old.id && (e.type === 'collapse' || e.type === 'vanish'));
              ev({ y: y + 25, type: 'dig', civ: c.id, other: old.id, sys: sid, pl, cause: ce ? ce.id : null,
                sum: `${c.who}在${systems[sid].name}发掘出更早的${old.who}遗迹。`,
                trace: `一处考古营地，工具上印着${c.who}的标记。他们挖掘的对象比营地本身古老得多，探方里露出的是${old.name}${old.sp.script}。` });
            }
            continue;
          }
        }
        // 接触
        const meet = new Map();
        for (const x of c.territory) for (const m of adj[x]) { const oid = owner[m]; if (oid != null && oid !== c.id && !c.contacted.has(oid) && civs[oid].alive && !meet.has(oid)) meet.set(oid, x); }
        for (const [oid, s] of meet) {
          const o = civs[oid];
          c.contacted.add(o.id); o.contacted.add(c.id);
          setRel(c, o, relInit(c, o));
          contactEv[pk(c.id, o.id)] = ev({ y, type: 'contact', civ: c.id, other: o.id, sys: s, pl: pickPlanet(s), cause: c.lastColony,
            sum: `${c.polity()}与${o.polity()}在${systems[s].name}星系首次接触。`,
            trace: `一座信标仍在低功率广播，里面并存着两种记录：${c.name}${c.sp.script}和${o.name}${o.sp.script}。两段内容是相同的问候。` });
        }
        // 关系、贸易、战争
        for (const oid of c.contacted) {
          const o = civs[oid];
          if (!o.alive) continue;
          let v = getRel(c, o) * 0.97 + er.range(-0.09, 0.09) + (c.trade.has(oid) ? 0.03 : 0);
          setRel(c, o, v);
          const fighting = wars.some((w) => !w.over && pk(w.a, w.b) === pk(c.id, oid));
          if (!fighting && !c.trade.has(oid) && v > 0.3 && er.chance(0.35)) {
            c.trade.add(oid); o.trade.add(c.id);
            const b = border(c, o); const s = b.length ? b[0][0] : c.home[0];
            const te = ev({ y, type: 'trade', civ: c.id, other: oid, sys: s, pl: pickPlanet(s), cause: contactEv[pk(c.id, oid)],
              sum: `${c.polity()}与${o.polity()}开通贸易航线。`,
              trace: `轨道上有一座废弃的中转站，货舱里堆放着两种规格的集装箱。账簿用两种记录方式对照书写。` });
            c.tradeEv = te; o.tradeEv = te;
          }
          const hawk = (c.ethos === '扩张' ? 0.15 : 0.04) * c.sp.hawk;
          if (!fighting && (v < -0.15 || er.chance(hawk)) && er.chance(0.3)) {
            const b = border(c, o);
            if (!b.length) continue;
            if (c.trade.has(oid)) { c.trade.delete(oid); o.trade.delete(c.id); }
            const grievance = c.lastNeg && y - events[c.lastNeg]?.y <= 300 ? c.lastNeg : contactEv[pk(c.id, oid)];
            const s = b[0][0];
            const we = ev({ y, type: 'war', civ: c.id, other: oid, sys: s, pl: pickPlanet(s), cause: grievance,
              sum: `${c.polity()}向${o.polity()}宣战。`,
              trace: `一份宣战文书被铸在金属板上，立在${systems[s].name}的边境哨站。落款是${c.polity()}的最高议事机构，列举了 ${er.int(3, 9)} 条理由。` });
            wars.push({ a: c.id, b: oid, ev: we, start: y, len: er.int(2, 6), over: false });
            setRel(c, o, -0.6);
          }
        }
        // 内部事件
        const negs = [];
        if (er.chance((0.02 + (c.trade.size ? 0.03 : 0)) * c.sp.plague)) {
          const fromTrade = c.trade.size && er.chance(0.6);
          c.stab -= 0.25;
          const s = er.pick([...c.territory]);
          c.lastNeg = ev({ y, type: 'plague', civ: c.id, sys: s, pl: pickPlanet(s, 'hab'), cause: fromTrade ? c.tradeEv : null,
            sum: c.sp.plagueSum.replace('{P}', c.polity()) + (fromTrade ? '，最早出现在贸易港。' : '。'),
            trace: c.sp.plagueTrace + (fromTrade ? `残存的记录显示，它最早随一艘外国货船抵达。` : `残存的记录没有说明它从何而来。`) });
          continue;
        }
        if (c.territory.size <= 3 && c.tech > 4 && er.chance(0.06 * c.sp.deplete)) {
          c.stab -= 0.18;
          c.lastNeg = ev({ y, type: 'deplete', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.lastColony,
            sum: `${c.polity()}的核心矿藏与水源接近枯竭。`,
            trace: `${plName(c.home[0], c.home[1])}地表遍布采掘坑，最深处已经接近地幔。工程档案的最后几页写满了配给数字。` });
          continue;
        }
        if (c.stab > 0.68 && c.tech > 5 && er.chance(0.07 * c.sp.golden)) {
          const s = er.pick([...c.territory]); const pl = pickPlanet(s, 'solid');
          ev({ y, type: 'golden', civ: c.id, sys: s, pl, cause: c.tradeEv ?? c.lastColony,
            sum: `${c.polity()}进入繁荣时期，在${systems[s].name}建造了大型纪念建筑。`,
            trace: `${plName(s, pl)}上矗立着一座巨型建筑，结构复杂到需要数月才能完成测绘。表面刻满${c.name}${c.sp.script}和星图，主题是「${c.culture[0]}」。` });
          c.stab += 0.05;
          continue;
        }
        if (c.ethos === '信仰' && er.chance(0.05)) {
          const s = er.pick([...c.territory]); const pl = pickPlanet(s, 'solid');
          ev({ y, type: 'faith', civ: c.id, sys: s, pl, cause: c.lastNeg,
            sum: `${c.polity()}兴起新的宗教运动，在${systems[s].name}建立圣所。`,
            trace: `一座朝向${c.name}母星方向的圣所。石阶被朝圣者的足迹磨出了凹痕。` });
          c.stab += 0.1;
          continue;
        }
        if (c.stab < 0.3 && y - c.unrestAt > 150 && er.chance(0.5)) {
          c.unrestAt = y;
          const s = c.home[0];
          const ue = ev({ y, type: 'unrest', civ: c.id, sys: s, pl: c.home[1], cause: c.lastNeg,
            sum: `${c.polity()}爆发大规模内乱。`,
            trace: c.sp.unrest });
          c.lastNeg = ue;
          if (c.territory.size >= 4 && er.chance(0.35)) {
            const hd = hops(c.home[0]);
            const far = [...c.territory].filter((s) => s !== c.home[0]).sort((a, b) => hd[b] - hd[a]);
            const take = far.slice(0, Math.max(1, Math.floor(far.length / 2)));
            const nhSys = take[0];
            let nhPl = systems[nhSys].planets.findIndex((p) => p.kind === 'rock' || p.kind === 'super');
            if (nhPl < 0) nhPl = 0;
            const oldName = c.polity();
            const nc = makeCiv([nhSys, nhPl], y, c, c.sp);
            nc.founded = true; nc.space = true; nc.stab = 0.6;
            for (const s of take) { c.territory.delete(s); nc.territory.add(s); owner[s] = nc.id; }
            nc.contacted.add(c.id); c.contacted.add(nc.id); setRel(c, nc, -0.4);
            nc.foundEv = ev({ y: y + 10, type: 'schism', civ: nc.id, other: c.id, sys: nhSys, pl: nhPl, cause: ue,
              sum: `${oldName}的边远殖民地宣布独立，成立${nc.polity()}。`,
              trace: `一份独立宣言的原件保存在真空柜中。签名者全部来自边缘星系，使用的是${c.name}${c.sp.script}的一种变体。` });
            nc.lastColony = nc.foundEv;
            contactEv[pk(c.id, nc.id)] = nc.foundEv;
            c.stab += 0.18;
          } else if (er.chance(0.35)) {
            const old = c.polity();
            const opts = c.sp.pol.filter((k) => k !== c.society);
            c.society = er.pick(opts);
            ev({ y: y + 10, type: 'coup', civ: c.id, sys: s, pl: c.home[1], cause: ue,
              sum: `${old}被推翻，${c.polity()}取而代之。`,
              trace: `前任统治者的雕像被推倒，基座被重新刻上了「${c.polity()}」的名字。` });
            c.stab += 0.25;
          }
          continue;
        }
        if (c.tech >= c.sp.vanish && er.chance(0.06)) {
          ev({ y, type: 'vanish', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.lastColony,
            sum: `${c.polity()}在数年之内停止了一切通讯，原因不明。`,
            trace: `所有设施完好无损，能源系统仍在运转，但没有任何居民。最后一条公开广播只有一行数学公式。` });
          c.alive = false; c.endYear = y; c.fate = '消失';
          for (const s of c.territory) { owner[s] = null; ruins[s].add(c.id); }
          c.territory.clear();
          for (const w of wars) if (!w.over && (w.a === c.id || w.b === c.id)) w.over = true;
          continue;
        }
        if (c.stab < 0.1) collapse(c, y, c.lastNeg, false);
      }
      // 战争推进
      for (const w of wars) {
        if (w.over) continue;
        const A = civs[w.a], B = civs[w.b];
        if (!A.alive || !B.alive) { w.over = true; continue; }
        const b = border(A, B);
        if (b.length && er.chance(0.45)) {
          const [s] = er.pick(b);
          const pl = pickPlanet(s);
          const be = ev({ y, type: 'battle', civ: w.a, other: w.b, sys: s, pl, cause: w.ev,
            sum: `${A.who}与${B.who}的舰队在${systems[s].name}星系交战。`,
            trace: `${plName(s, pl)}附近散布着大量舰船残骸，分属两种不同的工艺体系。部分残骸仍在缓慢旋转。` });
          A.lastNeg = be; B.lastNeg = be;
        }
        if ((y - w.start) / STEP >= w.len) {
          w.over = true;
          const str = (c) => c.tech * (1 + c.territory.size * 0.3) * (0.5 + c.stab) * er.range(0.7, 1.3);
          const sa = str(A), sb = str(B);
          const [win, lose] = sa > sb ? [A, B] : [B, A];
          const fr = border(win, lose).map((x) => x[1]);
          const take = [...new Set(fr)].slice(0, er.int(1, 3));
          if (take.length && Math.max(sa, sb) / Math.min(sa, sb) > 1.2) {
            for (const s of take) { lose.territory.delete(s); win.territory.add(s); owner[s] = win.id; ruins[s].add(lose.id); }
            const s = take[0];
            const ce = ev({ y, type: 'conquest', civ: win.id, other: lose.id, sys: s, pl: pickPlanet(s, 'solid'), cause: w.ev,
              sum: `${win.polity()}击败${lose.polity()}，夺取了${take.map((t) => systems[t].name).join('、')}。`,
              trace: `这里有两层截然不同的遗迹：底层属于${lose.who}，上层由${win.who}改建。许多${lose.name}${lose.sp.script}被刻意抹去。` });
            lose.stab -= take.includes(lose.home[0]) ? 0.35 : 0.15; lose.lastNeg = ce;
            if (lose.territory.size === 0 || take.includes(lose.home[0]) && lose.territory.size <= 1) {
              for (const s2 of lose.territory) { owner[s2] = win.id; win.territory.add(s2); }
              lose.territory.clear();
              collapse(lose, y + 10, ce, true);
            }
          } else {
            const s = border(A, B)[0]?.[0] ?? A.home[0];
            const pe = ev({ y, type: 'peace', civ: w.a, other: w.b, sys: s, pl: pickPlanet(s, 'solid'), cause: w.ev,
              sum: `${A.polity()}与${B.polity()}签订停战协定，边界维持原状。`,
              trace: `一块界碑立在${systems[s].name}，两侧分别用${A.name}${A.sp.script}和${B.name}${B.sp.script}标出各自的疆域。` });
            setRel(A, B, -0.2);
            A.lastNeg = pe; B.lastNeg = pe;
          }
        }
      }
    }

    // 起点：离所有母星都远、且邻近有遗迹的星系
    const traceSys = new Set(events.map((e) => e.sys));
    const hd = civs.map((c) => hops(c.home[0]));
    let start = 0, best = -1;
    for (const s of systems) {
      if (s.type === 'S') continue;
      const m = Math.min(...hd.map((h) => h[s.id]));
      const near = adj[s.id].some((n) => traceSys.has(n)) ? 2 : 0;
      const sc = Math.min(m, 4) + near / 2 + (traceSys.has(s.id) ? 3 : 0);
      if (sc > best) { best = sc; start = s.id; }
    }

    // ===== 探索期：存续的文明继续演化，以 10 天为一步，预先推演 10 年 =====
    const histCount = events.length;
    const LIVE_DAYS = 3650, DSTEP = 10;
    const baseOwner = owner.slice();
    for (const s of systems) { s.name0 = s.name; s.catalog0 = s.catalog; s.renames = []; }
    for (const c of civs) { c.alive0 = c.alive; c.society0 = c.society; }
    const lr = R(seed, 'live');
    let LD = 0;
    const lname = (sid) => systems[sid].name;
    const lev = (o) => { o.live = true; o.day = LD; o.y = PRESENT + Math.floor(LD / 365); return ev(o); };
    const liveClaim = (sid, c) => {
      const s = systems[sid];
      if (!s.catalog) return null;
      const old = s.name; claim(sid, c); s.renames.push({ day: LD, name: s.name, by: c.id });
      return old;
    };
    const lwars = [];
    const fighting = (a, b) => lwars.some((w) => !w.over && pk(w.a, w.b) === pk(a.id, b.id));
    const endCiv = (c, fate, own) => {
      c.alive = false; c.endDay = LD; c.endYear = PRESENT + Math.floor(LD / 365); c.fate = fate;
      for (const s of c.territory) { owner[s] = null; ruins[s].add(c.id); own.push([s, null]); }
      c.territory.clear();
      for (const w of lwars) if (!w.over && (w.a === c.id || w.b === c.id)) w.over = true;
    };
    const PROJECTS = ['第一座跃迁信标', '环绕母星的轨道环', '一座深空观测阵列', '一张恒星能量收集网', '一座行星级档案库'];
    for (const c of civs) c.nextDay = lr.int(10, 70);
    for (LD = DSTEP; LD <= LIVE_DAYS; LD += DSTEP) {
      const alive = civs.filter((c) => c.alive);
      for (const c of lr.shuffle(alive)) {
        if (!c.alive) continue;
        const atWar = lwars.filter((w) => !w.over && (w.a === c.id || w.b === c.id)).length;
        c.tech = Math.min(10, c.tech + 0.003 + c.sp.tech * 0.02);
        c.stab = Math.max(0, Math.min(1, c.stab + (c.sp.stab - c.stab) * 0.015 + lr.range(-0.022, 0.022) - atWar * 0.01));
        for (const oid of c.contacted) { const o = civs[oid]; if (o.alive) setRel(c, o, getRel(c, o) * 0.996 + lr.range(-0.025, 0.025)); }
        // 新的接触
        const meet = new Map();
        for (const x of c.territory) for (const m of adj[x]) { const oid = owner[m]; if (oid != null && oid !== c.id && !c.contacted.has(oid) && civs[oid].alive && !meet.has(oid)) meet.set(oid, x); }
        for (const [oid, s] of meet) {
          const o = civs[oid];
          c.contacted.add(o.id); o.contacted.add(c.id); setRel(c, o, relInit(c, o));
          contactEv[pk(c.id, o.id)] = lev({ type: 'contact', civ: c.id, other: o.id, sys: s, pl: pickPlanet(s), cause: c.lastColony,
            sum: `${c.polity()}与${o.polity()}在${lname(s)}星系首次接触。`,
            trace: `两支舰队在${lname(s)}附近对峙后各自退开，留下一座新架设的联络信标，正交替播放${c.name}${c.sp.script}和${o.name}${o.sp.script}。` });
        }
        if (c.stab < 0.08) {
          const own = [];
          const ce = lev({ type: 'collapse', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.lastNeg, own,
            sum: `${c.polity()}崩溃了，各地殖民地相继失去联系。`,
            trace: `${plName(c.home[0], c.home[1])}的通讯塔已经沉默，城市里只剩零星的灯光。最后几条广播是各地发出的求援信号。` });
          endCiv(c, '瓦解', own);
          continue;
        }
        if (LD < c.nextDay || !lr.chance(0.45)) continue;
        // 可选的行动及其权重
        const opts = [];
        const free = [];
        for (const s of c.territory) for (const n of adj[s]) if (owner[n] == null && systems[n].planets.length && !free.includes(n)) free.push(n);
        const ethCol = { 扩张: 1.8, 贸易: 1, 求知: 1, 信仰: 0.9, 隐修: 0.35 }[c.ethos];
        if (c.space && free.length) opts.push(['colony', 3 * c.sp.col * ethCol]);
        const foes = [...c.contacted].map((i) => civs[i]).filter((o) => o.alive && !fighting(c, o) && border(c, o).length && (getRel(c, o) < -0.1 || c.ethos === '扩张' || c.sp.hawk > 1.5));
        if (foes.length) opts.push(['war', (c.ethos === '扩张' ? 2.2 : 1.2) * Math.sqrt(c.sp.hawk)]);
        const friends = [...c.contacted].map((i) => civs[i]).filter((o) => o.alive && !c.trade.has(o.id) && !fighting(c, o) && getRel(c, o) > 0.2);
        if (friends.length) opts.push(['trade', 1.6]);
        if (c.sp.plague > 0) opts.push(['plague', 0.7 * c.sp.plague * (c.trade.size ? 1.6 : 1)]);
        if (c.stab > 0.55) opts.push(['golden', 0.9 * c.sp.golden]);
        if (c.ethos === '信仰') opts.push(['faith', 0.9]);
        const ruinSys = [...c.territory].filter((s) => [...ruins[s]].some((x) => x !== c.id && !c.dug.has(x)));
        if (ruinSys.length) opts.push(['dig', 1.4]);
        opts.push(['tech', 0.8 + (c.ethos === '求知' ? 0.8 : 0)]);
        if (c.stab < 0.35) opts.push(['unrest', 3.5]);
        if (c.tech >= c.sp.vanish) opts.push(['vanish', 0.25]);
        const act = lr.weighted(opts);
        c.nextDay = LD + lr.int(25, 85);
        if (act === 'colony') {
          const sid = lr.pick(free), pl = pickPlanet(sid, c.sp.prefer || 'solid');
          owner[sid] = c.id; c.territory.add(sid);
          const old = liveClaim(sid, c);
          c.lastColony = lev({ type: 'colony', civ: c.id, sys: sid, pl, cause: c.lastColony, own: [[sid, c.id]],
            sum: old ? `${c.polity()}在 ${old} 星系建立了新的殖民地，并将它命名为 ${lname(sid)}。` : `${c.polity()}在${lname(sid)}星系建立了新的殖民地。`,
            trace: `${plName(sid, pl)}上的定居点刚刚落成，${c.who}的运输船还停在着陆场上，部分建筑的外壳尚未封闭。` });
        } else if (act === 'war') {
          const o = lr.pick(foes), b = border(c, o), s = b[0][0];
          if (c.trade.has(o.id)) { c.trade.delete(o.id); o.trade.delete(c.id); }
          const grievance = c.lastNeg != null && events[c.lastNeg].live ? c.lastNeg : contactEv[pk(c.id, o.id)];
          const we = lev({ type: 'war', civ: c.id, other: o.id, sys: s, pl: pickPlanet(s), cause: grievance,
            sum: `${c.polity()}向${o.polity()}宣战。`,
            trace: `${lname(s)}的边境哨站已经进入战备状态，通讯频道里反复播放着${c.name}${c.sp.script}写成的动员令。` });
          lwars.push({ a: c.id, b: o.id, ev: we, end: LD + lr.int(60, 240), over: false });
          setRel(c, o, -0.6);
        } else if (act === 'trade') {
          const o = lr.pick(friends);
          c.trade.add(o.id); o.trade.add(c.id);
          const b = border(c, o), s = b.length ? b[0][0] : c.home[0];
          const te = lev({ type: 'trade', civ: c.id, other: o.id, sys: s, pl: pickPlanet(s), cause: contactEv[pk(c.id, o.id)],
            sum: `${c.polity()}与${o.polity()}签订了贸易协定。`,
            trace: `${lname(s)}的轨道上新开了一座中转站，泊位上停着两种制式的货船，装卸作业日夜不停。` });
          c.tradeEv = te; o.tradeEv = te;
        } else if (act === 'plague') {
          const s = lr.pick([...c.territory]), fromTrade = c.trade.size && lr.chance(0.6);
          c.stab -= 0.18;
          c.lastNeg = lev({ type: 'plague', civ: c.id, sys: s, pl: pickPlanet(s, 'hab'), cause: fromTrade ? c.tradeEv : null,
            sum: c.sp.plagueSum.replace('{P}', c.polity()) + (fromTrade ? '，最早出现在贸易港。' : '。'),
            trace: `${lname(s)}正在实行隔离，所有船只都被要求停靠检疫站。` + (fromTrade ? '检疫官怀疑源头是一艘外国货船。' : '') });
        } else if (act === 'golden') {
          const s = lr.pick([...c.territory]), pl = pickPlanet(s, c.sp.prefer || 'solid');
          c.stab += 0.06;
          lev({ type: 'golden', civ: c.id, sys: s, pl, cause: c.tradeEv ?? c.lastColony,
            sum: `${c.polity()}在${lname(s)}落成了一座宏伟的纪念建筑。`,
            trace: `${plName(s, pl)}上的新建筑刚刚揭幕，表面的${c.name}${c.sp.script}还很清晰，主题是「${c.culture[0]}」。` });
        } else if (act === 'faith') {
          const s = lr.pick([...c.territory]), pl = pickPlanet(s, c.sp.prefer || 'solid');
          c.stab += 0.08;
          lev({ type: 'faith', civ: c.id, sys: s, pl, cause: c.lastNeg,
            sum: `${c.polity()}兴起新的信仰运动，信众在${lname(s)}聚集。`,
            trace: `大批朝圣者正涌向${plName(s, pl)}，临时营地沿着道路延伸了数公里。` });
        } else if (act === 'dig') {
          const s = lr.pick(ruinSys), old = civs[[...ruins[s]].find((x) => x !== c.id && !c.dug.has(x))];
          c.dug.add(old.id);
          const ce = events.find((e) => e.civ === old.id && (e.type === 'collapse' || e.type === 'vanish'));
          lev({ type: 'dig', civ: c.id, other: old.id, sys: s, pl: pickPlanet(s, 'solid'), cause: ce ? ce.id : null,
            sum: `${c.who}在${lname(s)}开始发掘${old.who}的遗迹。`,
            trace: `${lname(s)}上新开了一处考古工地，${c.who}的学者正在清理${old.name}${old.sp.script}。` });
        } else if (act === 'tech') {
          const proj = lr.pick(PROJECTS); c.tech = Math.min(10, c.tech + 0.15);
          lev({ type: 'tech', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.tradeEv ?? c.lastColony,
            sum: `${c.polity()}建成了${proj}。`,
            trace: `${plName(c.home[0], c.home[1])}附近，${proj}刚刚投入运行，周围还漂浮着施工平台。` });
        } else if (act === 'unrest') {
          const ue = lev({ type: 'unrest', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.lastNeg,
            sum: `${c.polity()}爆发内乱。`, trace: '局势仍在发展。' + c.sp.unrest });
          c.lastNeg = ue;
          if (c.territory.size >= 3 && lr.chance(0.4)) {
            const hd = hops(c.home[0]);
            const far = [...c.territory].filter((x) => x !== c.home[0]).sort((a, b) => hd[b] - hd[a]);
            const take = far.slice(0, Math.max(1, Math.floor(far.length / 2)));
            const nhSys = take[0];
            let nhPl = systems[nhSys].planets.findIndex((p) => p.kind === 'rock' || p.kind === 'super');
            if (nhPl < 0) nhPl = 0;
            const oldName = c.polity();
            LD += 5;
            const nc = makeCiv([nhSys, nhPl], PRESENT, c, c.sp);
            nc.founded = true; nc.space = true; nc.stab = 0.6; nc.alive0 = false; nc.bornDay = LD; nc.society0 = nc.society; nc.nextDay = LD + 60;
            for (const x of take) { c.territory.delete(x); nc.territory.add(x); owner[x] = nc.id; }
            nc.contacted.add(c.id); c.contacted.add(nc.id); setRel(c, nc, -0.4);
            nc.foundEv = lev({ type: 'schism', civ: nc.id, other: c.id, sys: nhSys, pl: nhPl, cause: ue, own: take.map((x) => [x, nc.id]),
              sum: `${oldName}的边远星系宣布独立，成立${nc.polity()}。`,
              trace: `${lname(nhSys)}的街头挂满了新旗帜。独立宣言刚刚发布，用的是${c.name}${c.sp.script}的一种变体。` });
            nc.lastColony = nc.foundEv; contactEv[pk(c.id, nc.id)] = nc.foundEv;
            LD -= 5; c.stab += 0.2;
          } else if (lr.chance(0.5)) {
            const old = c.polity();
            c.society = lr.pick(c.sp.pol.filter((k) => k !== c.society));
            LD += 5;
            lev({ type: 'coup', civ: c.id, sys: c.home[0], pl: c.home[1], cause: ue, society: c.society,
              sum: `${old}被推翻，${c.polity()}宣告成立。`,
              trace: `${plName(c.home[0], c.home[1])}的政府建筑换上了新的徽记，旧政权的标识被连夜拆除。` });
            LD -= 5; c.stab += 0.25;
          }
        } else if (act === 'vanish') {
          const own = [];
          lev({ type: 'vanish', civ: c.id, sys: c.home[0], pl: c.home[1], cause: c.lastColony, own,
            sum: `${c.polity()}在几天之内停止了一切通讯。`,
            trace: '所有设施仍在运转，但找不到任何居民。最后一条公开广播只有一行数学公式。' });
          endCiv(c, '消失', own);
        }
      }
      // 战争推进
      for (const w of lwars) {
        if (w.over) continue;
        const A = civs[w.a], B = civs[w.b];
        if (!A.alive || !B.alive) { w.over = true; continue; }
        const b = border(A, B);
        if (b.length && lr.chance(0.14)) {
          const [s] = lr.pick(b), pl = pickPlanet(s);
          const be = lev({ type: 'battle', civ: w.a, other: w.b, sys: s, pl, cause: w.ev,
            sum: `${A.who}与${B.who}的舰队在${lname(s)}星系交火。`,
            trace: `${plName(s, pl)}附近的残骸还在发热，碎片正沿着轨道散开。救援船在残骸之间搜寻幸存者。` });
          A.lastNeg = be; B.lastNeg = be; A.stab -= 0.04; B.stab -= 0.04;
        }
        if (LD >= w.end) {
          w.over = true;
          const str = (c) => c.tech * (1 + c.territory.size * 0.3) * (0.5 + c.stab) * lr.range(0.7, 1.3);
          const sa = str(A), sb = str(B);
          const [win, lose] = sa > sb ? [A, B] : [B, A];
          const take = [...new Set(border(win, lose).map((x) => x[1]))].slice(0, lr.int(1, 2));
          if (take.length && Math.max(sa, sb) / Math.min(sa, sb) > 1.2) {
            const own = take.map((x) => [x, win.id]);
            for (const x of take) { lose.territory.delete(x); win.territory.add(x); owner[x] = win.id; ruins[x].add(lose.id); }
            const s = take[0];
            const ce = lev({ type: 'conquest', civ: win.id, other: lose.id, sys: s, pl: pickPlanet(s, 'solid'), cause: w.ev, own,
              sum: `${win.polity()}攻占了${take.map((t) => lname(t)).join('、')}，${lose.polity()}被迫后撤。`,
              trace: `${lname(s)}的旗帜和标识刚刚被替换，${lose.who}留下的设施上有明显的弹痕。` });
            lose.stab -= take.includes(lose.home[0]) ? 0.3 : 0.12; lose.lastNeg = ce;
            if (!lose.territory.size || take.includes(lose.home[0])) {
              const own2 = [];
              LD += 5;
              lev({ type: 'collapse', civ: lose.id, sys: lose.home[0], pl: lose.home[1], cause: ce, own: own2,
                sum: `${lose.polity()}失去了母星，作为独立文明不复存在。`,
                trace: `${plName(lose.home[0], lose.home[1])}上，${win.who}的部队正在接管${lose.who}的城市。` });
              for (const x of lose.territory) { owner[x] = win.id; win.territory.add(x); own2.push([x, win.id]); }
              lose.territory.clear();
              endCiv(lose, '被征服', own2);
              LD -= 5;
            }
          } else {
            const s = border(A, B)[0]?.[0] ?? A.home[0];
            const pe = lev({ type: 'peace', civ: w.a, other: w.b, sys: s, pl: pickPlanet(s, 'solid'), cause: w.ev,
              sum: `${A.polity()}与${B.polity()}宣布停火。`,
              trace: `${lname(s)}的前线阵地正在撤离，双方的舰船保持着安全距离。` });
            setRel(A, B, -0.2); A.lastNeg = pe; B.lastNeg = pe;
          }
        }
      }
    }
    for (const s of systems) { s.name = s.name0; s.catalog = s.catalog0; }

    for (const c of civs) {
      c.territory = [...c.territory];
      c.contacted = [...c.contacted];
      delete c.trade; delete c.dug;
    }
    const planetsCount = systems.reduce((a, s) => a + s.planets.length, 0);
    const habCount = systems.reduce((a, s) => a + s.planets.filter((p) => p.hab).length, 0);
    return {
      seed, W, H, systems, lanes, adj, civs, events, present: PRESENT, start, owner: baseOwner, histCount, liveDays: LIVE_DAYS,
      stats: { systems: systems.length, planets: planetsCount, habitable: habCount, events: histCount, civs: civs.filter((c) => c.bornDay == null).length, ms: (typeof performance !== 'undefined' ? performance : Date).now() - t0 },
      plName, ROMAN, STARS, sp, KIND_NAME, ETHOS_DESC, galaxy: { CX, CY, GR, density }, SPECIES,
    };
  }
  return { generate, R };
})();
if (typeof module !== 'undefined') module.exports = Gen;
</script>
<script>
/* ===== 遗星志 · 界面与探索 ===== */
(() => {
  const $ = (s) => document.querySelector(s);
  const SAVE = 'yxz-v4:';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, st, disc, atKey, sysKeys;
  let tab = 'sys', filter = null, freshIds = new Set(), anim = null;

  const civOf = (id) => W.civs[id];
  const civTag = (id) => `<span class="civtag" style="--c:${civOf(id).color}">${civOf(id).who}</span>`;
  const dist = (a, b) => Math.hypot(W.systems[a].x - W.systems[b].x, W.systems[a].y - W.systems[b].y);
  const travelDays = (a, b) => Math.max(1, Math.round(dist(a, b) / 36));
  const tempC = (T) => Math.round(T - 273);
  // 探索从历史推演结束的那一年（纪元 3000 年）第 1 天开始，航行、勘测都会推进日期
  const YEAR_DAYS = 365;
  const today = () => ({ y: W.present + Math.floor(st.days / YEAR_DAYS), d: (st.days % YEAR_DAYS) + 1 });
  const dateStr = () => { const t = today(); return `纪元 ${t.y} 年第 ${t.d} 天`; };
  const evDate = (e) => `纪元 ${W.present + Math.floor(e.day / YEAR_DAYS)} 年第 ${(e.day % YEAR_DAYS) + 1} 天`;

  // ---- 一整个螺旋星系：所有星区共享同一段历史 ----
  const GSAVE = 'yxz-g1:', LAST = 'yxz-g1-last';
  function load(seed, fresh) {
    $('#loading').hidden = false;
    $('#seed').value = seed;
    setTimeout(() => {
      W = Gen.generate(seed);
      const saved = fresh ? null : store.get(GSAVE + seed);
      st = saved && saved.v === 1 ? saved : { v: 1, cur: W.start, visited: [W.start], path: [W.start], surveyed: [], archEv: [], archived: [], days: 0 };
      st.sel = st.cur;
      store.set(LAST, seed);
      freshIds = new Set(); filter = null; anim = null; glowCv = null; bgKey = '';
      recompute(); renderLegend();
      $('#loading').hidden = true;
      fit(true);
      renderAll();
    }, 30);
  }
  function save() { const { sel, ...rest } = st; store.set(GSAVE + W.seed, rest); }

  // ---- 随时间变化的世界状态 ----
  const happened = (e) => !e.live || e.day <= st.days;
  let ownerNow = [], happenedCount = 0;
  const nameOf = (sid) => { const s = W.systems[sid]; let n = s.name; for (const r of s.renames) if (r.day <= st.days) n = r.name; return n; };
  const isCatalog = (sid) => W.systems[sid].catalog && !W.systems[sid].renames.some((r) => r.day <= st.days);
  const plName = (sid, pl) => (pl < 0 ? nameOf(sid) + '星系深空' : nameOf(sid) + ' ' + W.ROMAN[pl]);
  const aliveNow = (c) => (c.bornDay != null ? c.bornDay <= st.days : c.alive0) && !(c.endDay != null && c.endDay <= st.days);
  const polityNow = (c) => { let soc = c.society0; for (const id of c.events) { const e = W.events[id]; if (e.type === 'coup' && e.society && e.civ === c.id && e.live && happened(e)) soc = e.society; } return c.name + soc; };
  const heard = (e) => e.live && (known(e.sys) || st.archived.includes(e.civ) || (e.other != null && st.archived.includes(e.other)));
  function recompute() {
    atKey = {}; sysKeys = W.systems.map(() => new Set()); happenedCount = 0;
    ownerNow = W.owner.slice();
    visArr = new Uint8Array(W.systems.length); knownArr = new Uint8Array(W.systems.length);
    for (const v of st.visited) visArr[v] = 1;
    for (const x of W.systems) for (const v of st.visited) { const o = W.systems[v]; if ((o.x - x.x) ** 2 + (o.y - x.y) ** 2 <= SCAN * SCAN) { knownArr[x.id] = 1; break; } }
    for (const e of W.events) {
      if (!happened(e)) continue;
      happenedCount++;
      const k = e.sys + ':' + e.pl;
      (atKey[k] = atKey[k] || []).push(e.id);
      sysKeys[e.sys].add(k);
      if (e.own) for (const [x, o] of e.own) ownerNow[x] = o;
    }
    disc = new Map();
    for (const k of st.surveyed) for (const id of atKey[k] || []) disc.set(id, 'survey');
    for (const id of st.archEv) if (!disc.has(id)) disc.set(id, 'archive');
    for (const e of W.events) if (happened(e) && !disc.has(e.id) && heard(e)) disc.set(e.id, 'news');
    unsArr = W.systems.map((x) => [...sysKeys[x.id]].filter((k) => !st.surveyed.includes(k)).length);
    civAtArr = W.systems.map(() => []);
    for (const id of disc.keys()) { const e = W.events[id], L = civAtArr[e.sys]; if (!L.includes(e.civ)) L.push(e.civ); }
  }
  // 时间推进后，汇报途中截获的通讯
  function newsSince(before) {
    return [...disc.keys()].filter((id) => !before.has(id) && disc.get(id) === 'news').sort((a, b) => W.events[a].day - W.events[b].day);
  }
  const SCAN = 170; // 远程扫描半径（星图单位，约 85 pc）
  let visArr = [], knownArr = [], unsArr = [], civAtArr = [];
  const visited = (s) => visArr[s] === 1;
  const known = (s) => knownArr[s] === 1;
  // 已知范围内、离当前位置最近、还有未勘测痕迹的星系
  const nearestSignal = () => {
    let best = null, bd = Infinity;
    for (const x of W.systems) { if (x.id === st.cur || !known(x.id) || !unsArr[x.id]) continue; const d = dist(st.cur, x.id); if (d < bd) { bd = d; best = x.id; } }
    return best;
  };
  const unsurveyed = (s) => [...sysKeys[s]].filter((k) => !st.surveyed.includes(k));
  const civEvents = (cid) => W.events.filter((e) => (e.civ === cid || e.other === cid) && happened(e));
  const knownCivs = () => {
    const set = new Set();
    for (const id of disc.keys()) { const e = W.events[id]; set.add(e.civ); if (e.other != null) set.add(e.other); }
    return [...set].sort((a, b) => a - b);
  };

  /* ---------- 操作 ---------- */
  function select(s, toTab) {
    st.sel = s;
    if (toTab) tab = toTab;
    renderAll();
  }
  function travel(to) {
    if (to === st.cur) return;
    const from = st.cur;
    st.days += travelDays(from, to);
    st.cur = to; st.sel = to;
    if (!visited(to)) st.visited.push(to);
    st.path.push(to); if (st.path.length > 60) st.path.shift();
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before);
    freshIds = new Set(news);
    save();
    const dur = reduce ? 0 : Math.min(1800, 450 + dist(from, to) * 0.9);
    if (dur) anim = { from, to, t0: performance.now(), dur };
    follow(to, dur);
    tab = 'sys';
    renderAll();
    const n = unsurveyed(to).length;
    toast(`${dateStr()}，抵达${nameOf(to)}。` + (n ? `检测到 ${n} 处人工痕迹。` : '没有检测到人工痕迹。'), news);
  }
  function linksFor(ids) {
    let n = 0;
    for (const id of ids) {
      const e = W.events[id];
      if (e.cause != null && disc.has(e.cause)) n++;
      for (const o of W.events) if (o.cause === id && disc.has(o.id) && !ids.includes(o.id)) n++;
    }
    return n;
  }
  function survey(key) {
    if (st.surveyed.includes(key)) return;
    st.surveyed.push(key); st.days += 2;
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before);
    const got = [...disc.keys()].filter((id) => !before.has(id) && disc.get(id) !== 'news');
    freshIds = new Set([...got, ...news]);
    save(); renderAll();
    const links = linksFor(got);
    toast(got.length ? `复原 ${got.length} 条记录` + (links ? `，接上 ${links} 处因果联系。` : '。') : '这里的记录你已经通过其他途径获知。', news);
  }
  function archive(cid) {
    const c = civOf(cid);
    const missing = civEvents(cid).filter((e) => !disc.has(e.id)).sort((a, b) => a.y - b.y).slice(0, 5).map((e) => e.id);
    st.archived.push(cid); st.archEv.push(...missing); st.days += 1;
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before).filter((id) => !missing.includes(id));
    freshIds = new Set([...missing, ...news]);
    save(); renderAll();
    toast((missing.length ? `${c.who}的档案馆提供了 ${missing.length} 条记录。` : `${c.who}的档案中没有你尚未掌握的内容。`) + `今后会持续收到他们的通讯。`, news);
  }
  let toastT;
  function toast(msg, news) {
    const t = $('#toast');
    let h = `<div>${msg}</div>`;
    if (news && news.length) {
      const last = W.events[news[news.length - 1]];
      h += `<div class="tnews"><b>截获 ${news.length} 条新通讯</b>${last.sum}${news.length > 1 ? ' 等' : ''}</div>`;
    }
    t.innerHTML = W.sp(h); t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), news && news.length ? 5200 : 3200);
  }

  /* ---------- 渲染：顶栏、地图条 ---------- */
  function renderStatus() {
    const s = W.systems[st.cur];
    const t = today();
    $('#status').innerHTML = W.sp(`<span class="now" title="出发至今共 ${st.days} 天">当前 纪元 <b>${t.y}</b> 年 · 第 <b>${t.d}</b> 天</span><span>位置 <b>${nameOf(st.cur)}</b> · 星区 ${secName(W.systems[st.cur])}</span><span>记录 <b>${disc.size}</b>/${happenedCount}</span>`);
  }
  function renderBar() {
    const s = W.systems[st.sel], star = W.STARS[s.type];
    let html;
    if (st.sel === st.cur) {
      html = `${starSVG(star, 18)}<span class="where">${nameOf(st.sel)}</span><span class="meta">当前位置 · ${star.name}</span><span class="act">${nearestSignal() != null ? `<button class="btn" id="seek">前往最近的信号 · ${travelDays(st.cur, nearestSignal())} 天</button>` : `<span class="meta">附近没有已知信号，拖动星图去更远的地方看看</span>`}</span>`;
    } else {
      html = `${starSVG(star, 18)}<span class="where">${nameOf(st.sel)}</span><span class="meta">${star.name} · ${visited(st.sel) ? '已探索' : '未探索'} · 航程 ${travelDays(st.cur, st.sel)} 天</span>` +
        `<span class="act"><button class="btn primary" id="go">航行至此</button></span>`;
    }
    $('#mapbar').innerHTML = W.sp(html);
    const go = $('#go'); if (go) go.onclick = () => travel(st.sel);
    const seek = $('#seek'); if (seek) seek.onclick = () => travel(nearestSignal());
  }

  /* ---------- 图标 ---------- */
  function starSVG(star, size) {
    const c = star.color, g = star.glyph;
    let b = '';
    const ray = (n, L, w) => Array.from({ length: n }, (_, i) => { const a = (i * Math.PI * 2) / n; return `<line x1="0" y1="0" x2="${(Math.cos(a) * L).toFixed(2)}" y2="${(Math.sin(a) * L).toFixed(2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; }).join('');
    if (g === 'dwarf') b = `<circle r="7" fill="${c}" opacity=".18"/><circle r="4" fill="${c}"/>`;
    else if (g === 'sun') b = `<circle r="9.5" fill="${c}" opacity=".16"/><circle r="5.2" fill="${c}"/>`;
    else if (g === 'bright') b = `${ray(4, 11, 1)}<circle r="8" fill="${c}" opacity=".15"/><circle r="5" fill="${c}"/>`;
    else if (g === 'giant') b = `${ray(4, 11.5, 1.2)}<g transform="rotate(45)">${ray(4, 8, 1)}</g><circle r="9" fill="${c}" opacity=".2"/><circle r="6.4" fill="${c}"/>`;
    else if (g === 'white') b = `<circle r="7" fill="none" stroke="${c}" stroke-width="1" opacity=".7"/><circle r="2.6" fill="${c}"/>`;
    else if (g === 'pulsar') b = `<path d="M0 0 L-2.2 -11 L2.2 -11 Z M0 0 L-2.2 11 L2.2 11 Z" fill="${c}" opacity=".75" transform="rotate(25)"/><circle r="2.4" fill="#ffffff"/>`;
    else if (g === 'core') b = `<circle r="11" fill="${c}" opacity=".22"/><ellipse rx="11.5" ry="4" fill="none" stroke="${c}" stroke-width="1.8" transform="rotate(-18)"/><circle r="5.5" fill="#050a18" stroke="${c}" stroke-width="1"/>`;
    else if (g === 'hole') b = `<ellipse rx="10.5" ry="3.6" fill="none" stroke="${c}" stroke-width="1.6" transform="rotate(-18)"/><circle r="5" fill="#050a18" stroke="${c}" stroke-width=".8" opacity=".95"/>`;
    return `<svg class="ico" width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true">${b}</svg>`;
  }
  const PCOL = {
    海洋: ['#2f6fb0', '#2f6fb0'], 群岛: ['#2f6fb0', '#7fbf7a'], 温带: ['#3a76b5', '#6fae5c'], 草原: ['#3f74a8', '#b8b05a'], 雨林: ['#2f6a8f', '#3f8f4a'],
    荒漠: ['#c99a5e', '#a67646'], 冻原: ['#8fa6b8', '#e6eef4'], 冰封世界: ['#d9e7f2', '#ffffff'], 熔岩世界: ['#3b1d1a', '#ff8a3c'], 温室炼狱: ['#d9a443', '#f3d08a'],
    灼烧岩体: ['#8b6a5a', '#5d463b'], 冰冷岩体: ['#8d939e', '#666b75'], 荒芜岩体: ['#9a8e80', '#6d6459'],
    气态巨行星: ['#c9a27a', '#e8cfae'], 炽热气态巨行星: ['#d0704a', '#f2a477'], 冰巨星: ['#8fc6d6', '#c5e6ee'],
  };
  function planetSVG(p) {
    const R = { dwarf: 5.5, rock: 7.5, super: 9, gas: 11, ice: 10 }[p.kind] || 8;
    const [a, b2] = PCOL[p.climate] || ['#888', '#aaa'];
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    let f = '';
    const cl = p.climate;
    if (p.kind === 'gas' || p.kind === 'ice') {
      f = `<g clip-path="url(#${id})"><rect x="-14" y="${-R * 0.45}" width="28" height="${R * 0.28}" fill="${b2}" opacity=".7"/><rect x="-14" y="${R * 0.2}" width="28" height="${R * 0.22}" fill="${b2}" opacity=".5"/></g>`;
      if (p.moons >= 4 || p.kind === 'ice') f += `<ellipse rx="${R + 3.5}" ry="${R * 0.28}" fill="none" stroke="${b2}" stroke-width="1.1" opacity=".85" transform="rotate(${p.kind === 'ice' ? -55 : -14})"/>`;
    } else if (/海洋|温带|草原|雨林|群岛/.test(cl)) {
      f = cl === '群岛'
        ? `<g fill="${b2}"><circle cx="-3" cy="-2" r="1.3"/><circle cx="2" cy="1" r="1.1"/><circle cx="-1" cy="4" r="1"/><circle cx="4" cy="-4" r="0.9"/></g>`
        : cl === '海洋' ? `<path d="M${-R * 0.6} ${-R * 0.1} q${R * 0.3} ${-R * 0.25} ${R * 0.6} 0 t${R * 0.6} 0" fill="none" stroke="#9cc8ee" stroke-width=".9" opacity=".6"/>`
          : `<g clip-path="url(#${id})" fill="${b2}"><path d="M${-R} ${-R * 0.2} q${R * 0.4} ${-R * 0.7} ${R * 0.9} ${-R * 0.3} q${R * 0.2} ${R * 0.5} ${-R * 0.3} ${R * 0.7} z"/><path d="M${R * 0.15} ${R * 0.25} q${R * 0.5} ${-R * 0.3} ${R * 0.9} ${R * 0.1} l0 ${R * 0.6} q${-R * 0.5} ${R * 0.1} ${-R * 0.9} ${-R * 0.7} z"/></g>`;
      f += `<circle r="${R + 1.2}" fill="none" stroke="#8fc7ff" stroke-width=".8" opacity=".45"/>`;
    } else if (cl === '熔岩世界') {
      f = `<path d="M${-R * 0.7} ${-R * 0.2} l${R * 0.5} ${R * 0.3} l${R * 0.3} ${-R * 0.5} l${R * 0.6} ${R * 0.4} M${-R * 0.3} ${R * 0.5} l${R * 0.5} ${-R * 0.2}" stroke="${b2}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
    } else if (cl === '温室炼狱') {
      f = `<circle r="${R + 1.6}" fill="none" stroke="${b2}" stroke-width="1.4" opacity=".55"/><path d="M${-R} 0 h${R * 2}" stroke="${b2}" stroke-width="1" opacity=".6"/>`;
    } else if (cl === '冻原' || cl === '冰封世界') {
      f = `<g clip-path="url(#${id})" fill="${b2}"><ellipse cy="${-R}" rx="${R * 0.9}" ry="${R * 0.45}"/><ellipse cy="${R}" rx="${R * 0.8}" ry="${R * 0.35}"/></g>`;
    } else if (cl === '荒漠') {
      f = `<g clip-path="url(#${id})"><path d="M${-R} ${R * 0.1} q${R * 0.5} ${-R * 0.3} ${R} 0 t${R} 0" fill="none" stroke="${b2}" stroke-width="1.2"/><path d="M${-R} ${R * 0.5} q${R * 0.5} ${-R * 0.3} ${R} 0 t${R} 0" fill="none" stroke="${b2}" stroke-width="1"/></g>`;
    } else {
      f = `<circle cx="${-R * 0.3}" cy="${-R * 0.25}" r="${R * 0.22}" fill="${b2}"/><circle cx="${R * 0.35}" cy="${R * 0.3}" r="${R * 0.16}" fill="${b2}"/><circle cx="${R * 0.25}" cy="${-R * 0.45}" r="${R * 0.1}" fill="${b2}"/>`;
    }
    return `<svg class="ico" width="28" height="28" viewBox="-14 -14 28 28" aria-hidden="true"><defs><clipPath id="${id}"><circle r="${R}"/></clipPath></defs><circle r="${R}" fill="${a}" stroke="rgba(234,242,255,.22)" stroke-width=".7"/>${f}<path d="M${R * 0.1} ${-R} A${R} ${R} 0 0 1 ${R * 0.1} ${R} A${R * 0.75} ${R} 0 0 0 ${R * 0.1} ${-R}" fill="#000" opacity=".28"/></svg>`;
  }
  const debrisSVG = () => `<svg class="ico" width="28" height="28" viewBox="-14 -14 28 28" aria-hidden="true"><g fill="#98aed4"><rect x="-7" y="-3" width="5" height="2" transform="rotate(20)"/><rect x="2" y="-6" width="3" height="3" transform="rotate(-15)"/><rect x="-2" y="4" width="6" height="1.6"/><circle cx="7" cy="3" r="1"/></g></svg>`;
  function renderLegend() {
    const order = ['M', 'K', 'B', 'W', 'N', 'H', 'S'];
    const lab = { M: '红矮星', K: '主序恒星', B: '蓝白巨星', W: '白矮星', N: '脉冲星', H: '黑洞', S: '银河核心' };
    $('#lg').innerHTML = order.map((k) => `<span>${starSVG(W.STARS[k], 18)}${lab[k]}</span>`).join('') +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><path d="M0 -5 L5 0 L0 5 L-5 0 Z" fill="#ffd27a"/></svg>检测到人工痕迹</span>` +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><circle r="8" fill="none" stroke="#c9a8ff" stroke-width="1.6"/></svg>已发现文明遗迹</span>` +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><path d="M-10 0 H10" stroke="#8fd3ff" stroke-dasharray="3 3" stroke-width="1.5"/></svg>你的航迹</span>` +
      `<span><b class="mono">KSC</b>无人命名的星系</span><span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><circle r="10" fill="#8fd3ff" opacity=".22"/></svg>远程扫描范围</span>`;
  }

  /* ---------- 渲染：面板 ---------- */
  function fragHTML(id) {

        (done ? `<span class="chip">档案已查阅</span>` : here ? `<button class="btn" data-arch="${ow}">请求查阅档案 · 1 天</button>` : `<span class="chip">抵达后可查阅档案</span>`) + `</div>`;

  function renderCivs() {
    const kc = knownCivs();
    let h = `<div class="eyebrow">已识别的文明</div><div class="sysname" style="font-size:22px">${kc.length} 个</div>`;
    if (!kc.length) { h += `<p class="empty">尚未识别任何文明。勘测遗迹后，留下痕迹的文明会出现在这里，它们的特征随记录增多逐步揭示。</p>` + codexHTML(); $('#pane').innerHTML = W.sp(h); return; }
    const TMAX = Math.max(W.present, today().y);
    for (const cid of kc) {
      const c = civOf(cid), evs = civEvents(cid), got = evs.filter((e) => disc.has(e.id));
      const types = new Set(got.map((e) => e.type));
      const arch = st.archived.includes(cid);
      const foundKnown = got.some((e) => (e.type === 'found' || e.type === 'schism') && e.civ === cid) || arch;
      const end = got.find((e) => e.civ === cid && (e.type === 'collapse' || e.type === 'vanish'));
      const alive = aliveNow(c);
      const seenAlive = alive && (arch || got.some((e) => e.live) || st.visited.some((v) => ownerNow[v] === cid));
      const unk = (v) => `<dd class="unk">${v || '未知'}</dd>`;
      const home = plName(c.home[0], c.home[1]);
      let fate;
      if (end) fate = end.live ? `<dd>${c.fate}，${evDate(end)}</dd>` : `<dd>${c.fate}，约纪元 ${c.endYear} 年</dd>`;
      else if (seenAlive) fate = `<dd class="alive">仍然存续 · 领土 ${ownerNow.filter((o) => o === cid).length} 个星系</dd>`;
      else fate = unk('不明');
      const span0 = Math.min(...got.map((e) => e.y)), span1 = Math.max(...got.map((e) => e.y));
      const spKnown = foundKnown || got.length >= 2;
      h += `<div class="civ" style="--c:${c.color}"><h3>${c.who}${spKnown ? `<span class="sp">${c.species}</span>` : ''}</h3><dl>
        <dt>物种</dt>${spKnown ? `<dd>${c.species}<span class="sub">${c.sp.desc}</span></dd>` : unk()}
        <dt>${c.parent != null ? '起源' : '母星'}</dt>${foundKnown ? `<dd>${c.parent != null ? `自${civOf(c.parent).who}分离 · ${home}` : home}</dd>` : unk()}
        <dt>记录</dt>${spKnown ? `<dd>${c.sp.script} · 命名${c.langLabel.replace('近似', '近似')}</dd>` : unk()}
        <dt>文化</dt>${got.length >= 4 || arch ? `<dd>${c.culture.join('；')}</dd>` : unk('需要更多记录')}
        <dt>政体</dt>${got.length >= 3 || arch ? `<dd>${polityNow(c)}${alive ? '' : '（末期）'}</dd>` : unk('需要更多记录')}
        <dt>取向</dt>${got.length >= 5 || arch ? `<dd>${c.ethos} · ${W.ETHOS_DESC[c.ethos]}</dd>` : unk('需要更多记录')}
        <dt>现状</dt>${fate}
      </dl>
      <div class="track"><div class="axis"></div><div class="span" style="left:${span0 / TMAX * 100}%;width:${Math.max(0.6, (span1 - span0) / TMAX * 100)}%"></div>
      ${got.map((e) => `<div class="dot" style="left:${Math.min(100, e.y / TMAX * 100)}%" title="${e.y} 年"></div>`).join('')}</div>
      <div class="ticks"><span>0</span><span>1000</span><span>2000</span><span>${W.present}</span></div>
      <div class="cnt">已复原 ${got.length} / ${evs.length} 条相关记录</div></div>`;
    }
    h += codexHTML();
    $('#pane').innerHTML = W.sp(h);
  }
  // 物种图鉴：识别出某个文明的物种后点亮对应条目
  function codexHTML() {
    const seen = new Map();
    for (const cid of knownCivs()) {
      const c = civOf(cid), got = civEvents(cid).filter((e) => disc.has(e.id));
      const ok = st.archived.includes(cid) || got.length >= 2 || got.some((e) => (e.type === 'found' || e.type === 'schism') && e.civ === cid);
      if (ok) { const L = seen.get(c.sp.id) || []; L.push(cid); seen.set(c.sp.id, L); }
    }
    const inGalaxy = new Set(W.civs.map((c) => c.sp.id));
    let h = `<div class="codex"><div class="eyebrow">物种图鉴</div><div class="sysname" style="font-size:20px">${seen.size} / ${W.SPECIES.length}</div>
      <p class="note" style="margin:4px 0 10px">这片星系中出现过 ${inGalaxy.size} 个物种。识别出一个文明的物种后，对应条目会点亮。</p><div class="cgrid">`;
    const order = [...W.SPECIES].sort((a, b) => (seen.has(b.id) ? 1 : 0) - (seen.has(a.id) ? 1 : 0));
    for (const x of order) {
      const L = seen.get(x.id);
      h += L ? `<div class="centry"><b>${x.label}</b><span class="cwho">称作「${x.who}」 · ${x.script}</span><p>${x.desc}</p><span class="cciv">${L.map(civTag).join(' ')}</span></div>`
             : `<div class="centry dim"><b>？？？</b><p>${inGalaxy.has(x.id) ? '尚未识别' : '这片星系中似乎没有这个物种'}</p></div>`;
    }
    return h + `</div></div>`;
  }
  function renderAbout() {
    const s = W.stats;
    $('#pane').innerHTML = `<div class="about">
      <h2>一个种子，一片星域</h2>
      <p>这里没有存储任何星球数据。输入框里的种子经过哈希，变成一串确定的伪随机数；每个星系又用 <code>种子 + 编号</code> 得到自己的随机数序列。同一个种子永远生成同一片星域，换一个种子就是另一片宇宙。</p>
      <div class="stats">
        <div><b>${s.systems}</b><span>恒星系</span></div><div><b>${s.planets}</b><span>行星</span></div>
        <div><b>${s.habitable}</b><span>宜居行星</span></div><div><b>${s.civs}</b><span>文明（含分裂）</span></div>
        <div><b>${s.events}</b><span>历史事件</span></div><div><b>${s.ms.toFixed(0)} ms</b><span>生成并推演 ${W.present} 年</span></div>
      </div>
      <h2>一整个星系</h2>
      <p>宇宙是一个完整的螺旋星系：约一千个恒星系沿着几条旋臂分布，臂间稀疏，中心是超大质量黑洞。所有文明在同一张图上推演同一段历史，会越过星区边界扩张、接触和交战。星区（A1 到 F6）只是方便定位的网格编号。拖动星图可以平移，滚轮或双指可以缩放，右下角的按钮可以回到当前位置或纵览全星系，左上角的小地图点一下就能把视野移过去。</p>
      <h2>名字也是线索</h2>
      <p>每个文明分到一种命名语言和一种记录方式（文字、符文、信息素刻痕、晶体生长纹……）（音节表、辅音、元音和词尾的组合）。一个星系在第一次被某个文明占据时，用这个文明的语言命名；从未被占据的星系只有星表编号。所以在星图上，一片读音相近的星名往往就是同一个文明的旧疆域。分裂出来的文明沿用母文明的语言。</p>
      <h2>属性按因果推导</h2>
      <p>每一层只在上一层给定的范围内随机：</p>
      <pre>恒星类型（按真实比例，红矮星最多）
 → 光度 → 各轨道的平衡温度
 → 行星质量 → 能否保有大气 → 温室效应修正
 → 气候（海洋、荒漠、冻原……）→ 是否宜居
 → 母星环境 → 能在这里诞生的物种</pre>
      <p>物种共有 ${W.SPECIES.length} 类，取材于科幻和奇幻里常见的原型，名字与细节都是原创的：类人种族、精灵、矮人、兽人、猫裔、翼族，虫族与吞噬虫群，金属生命、数字意识、硅基晶族，菌丝网络、光合林民，深海种族、智慧头足类、覆盖整颗行星的单一海洋意识，冰原种族、潮汐锁定行星上的昏线族，气态巨行星里的浮游族和无实体意识，栖居在恒星日冕中的恒星之灵，只在死亡恒星旁繁衍的辐食族，寄居宿主体内的共生体，能模仿一切的拟形族，以及早在多数种族诞生之前就已消失的上古先行者。</p>
      <p>每个物种只会诞生在特定环境里，有的还挑恒星：光合族需要明亮的恒星，昏线族只出现在红矮星和橙矮星周围的潮汐锁定行星上，辐食族只在脉冲星、白矮星和黑洞附近。物种也影响历史：兽人、龙族和吞噬虫群好战，猫裔和拟形族更容易与人交好，数字意识和恒星之灵不受瘟疫影响、科技发展快，也更早从记录中消失；上古先行者总是最早出现，以很高的科技起步。</p>
      <h2>历史是推演出来的</h2>
      <p>每个文明有科技、稳定度、领土和对外关系。时间以 50 年为一步推进，每一步检查哪些事件满足触发条件：领土相邻会产生接触，关系恶化会引发战争，贸易航线会带来瘟疫，稳定度过低会导致内乱、政变、分裂或瓦解。</p>
      <p>事件发生时会记下它的起因。你在编年史里看到的「起因」链接，就是推演时真实存在的因果，而不是事后拼接的文字。</p>
      <h2>你看到的只是碎片</h2>
      <p>历史推演到纪元 ${W.present} 年为止，你的探索从这一年的第 1 天开始。仍然存续的文明不会停下：生成星域时，它们的未来十年也以 10 天为一步推演好了，你的日期走到哪一天，那一天之前的事就真的发生了。他们会殖民（并给新星系命名）、开战、签约、分裂，也可能崩溃。发生在你扫描范围内的事件，以及你查阅过档案的文明的消息，会以「截获通讯」的形式进入编年史；其余的要靠你去现场勘测。每次航行按距离消耗天数，勘测一处遗迹 2 天，查阅档案 1 天，顶栏会显示当前日期，编年史里的「多少年前」也按当前日期计算。</p>
      <p>全部历史在生成时就已确定，但每条记录只留在一个地点。你的工作是从遗迹里把它们找回来，并把起因与结果对上。</p>
    </div>`;
  }
