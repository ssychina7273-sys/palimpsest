</script>
<script>
/* ===== 遗星志 · 界面与探索 ===== */
(() => {
  const $ = (s) => document.querySelector(s);
  const SAVE = 'yxz-v4:';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, st, disc, atKey, sysKeys;
  let tab = 'sys', filter = null, freshIds = new Set(), anim = null;

  const civOf = (id) => W.civs[id];
  const civTag = (id) => `<span class="civtag" style="--c:${civOf(id).color}">${civOf(id).who}</span>`;
  const dist = (a, b) => Math.hypot(W.systems[a].x - W.systems[b].x, W.systems[a].y - W.systems[b].y);
  const travelDays = (a, b) => Math.max(1, Math.round(dist(a, b) / 36));
  const tempC = (T) => Math.round(T - 273);
  // 探索从历史推演结束的那一年（纪元 3000 年）第 1 天开始，航行、勘测都会推进日期
  const YEAR_DAYS = 365;
  const today = () => ({ y: W.present + Math.floor(st.days / YEAR_DAYS), d: (st.days % YEAR_DAYS) + 1 });
  const dateStr = () => { const t = today(); return `纪元 ${t.y} 年第 ${t.d} 天`; };
  const evDate = (e) => `纪元 ${W.present + Math.floor(e.day / YEAR_DAYS)} 年第 ${(e.day % YEAR_DAYS) + 1} 天`;

  // ---- 一整个螺旋星系：所有星区共享同一段历史 ----
  const GSAVE = 'yxz-g2:', LAST = 'yxz-g1-last'; // g2：历史推演改版后，旧存档里的记录编号不再对应
  function load(seed, fresh) {
    $('#loading').hidden = false;
    $('#seed').value = seed;
    setTimeout(() => {
      W = Gen.generate(seed);
      const saved = fresh ? null : store.get(GSAVE + seed);
      st = saved && saved.v === 1 ? saved : { v: 1, cur: W.start, visited: [W.start], path: [W.start], surveyed: [], archEv: [], archived: [], days: 0 };
      st.sel = st.cur;
      store.set(LAST, seed);
      freshIds = new Set(); filter = null; anim = null; glowCv = null; bgKey = '';
      recompute(); renderLegend();
      $('#loading').hidden = true;
      fit(true);
      renderAll();
    }, 30);
  }
  function save() { const { sel, ...rest } = st; store.set(GSAVE + W.seed, rest); }

  // ---- 随时间变化的世界状态 ----
  const happened = (e) => !e.live || e.day <= st.days;
  let ownerNow = [], happenedCount = 0;
  const nameOf = (sid) => { const s = W.systems[sid]; let n = s.name; for (const r of s.renames) if (r.day <= st.days) n = r.name; return n; };
  const isCatalog = (sid) => W.systems[sid].catalog && !W.systems[sid].renames.some((r) => r.day <= st.days);
  const plName = (sid, pl) => (pl < 0 ? nameOf(sid) + '星系深空' : nameOf(sid) + ' ' + W.ROMAN[pl]);
  const aliveNow = (c) => (c.bornDay != null ? c.bornDay <= st.days : c.alive0) && !(c.endDay != null && c.endDay <= st.days);
  const polityNow = (c) => { let soc = c.society0; for (const id of c.events) { const e = W.events[id]; if (e.type === 'coup' && e.society && e.civ === c.id && e.live && happened(e)) soc = e.society; } return c.name + soc; };
  const heard = (e) => e.live && (known(e.sys) || st.archived.includes(e.civ) || (e.other != null && st.archived.includes(e.other)));
  function recompute() {
    atKey = {}; sysKeys = W.systems.map(() => new Set()); happenedCount = 0;
    ownerNow = W.owner.slice();
    visArr = new Uint8Array(W.systems.length); knownArr = new Uint8Array(W.systems.length);
    for (const v of st.visited) visArr[v] = 1;
    for (const x of W.systems) for (const v of st.visited) { const o = W.systems[v]; if ((o.x - x.x) ** 2 + (o.y - x.y) ** 2 <= SCAN * SCAN) { knownArr[x.id] = 1; break; } }
    for (const e of W.events) {
      if (!happened(e)) continue;
      happenedCount++;
      const k = e.sys + ':' + e.pl;
      (atKey[k] = atKey[k] || []).push(e.id);
      sysKeys[e.sys].add(k);
      if (e.own) for (const [x, o] of e.own) ownerNow[x] = o;
    }
    disc = new Map();
    for (const k of st.surveyed) for (const id of atKey[k] || []) disc.set(id, 'survey');
    for (const id of st.archEv) if (!disc.has(id)) disc.set(id, 'archive');
    for (const e of W.events) if (happened(e) && !disc.has(e.id) && heard(e)) disc.set(e.id, 'news');
    unsArr = W.systems.map((x) => [...sysKeys[x.id]].filter((k) => !st.surveyed.includes(k)).length);
    civAtArr = W.systems.map(() => []);
    for (const id of disc.keys()) { const e = W.events[id], L = civAtArr[e.sys]; if (!L.includes(e.civ)) L.push(e.civ); }
  }
  // 时间推进后，汇报途中截获的通讯
  function newsSince(before) {
    return [...disc.keys()].filter((id) => !before.has(id) && disc.get(id) === 'news').sort((a, b) => W.events[a].day - W.events[b].day);
  }
  const SCAN = 170; // 远程扫描半径（星图单位，约 85 pc）
  let visArr = [], knownArr = [], unsArr = [], civAtArr = [];
  const visited = (s) => visArr[s] === 1;
  const known = (s) => knownArr[s] === 1;
  // 已知范围内、离当前位置最近、还有未勘测痕迹的星系
  const nearestSignal = () => {
    let best = null, bd = Infinity;
    for (const x of W.systems) { if (x.id === st.cur || !known(x.id) || !unsArr[x.id]) continue; const d = dist(st.cur, x.id); if (d < bd) { bd = d; best = x.id; } }
    return best;
  };
  const unsurveyed = (s) => [...sysKeys[s]].filter((k) => !st.surveyed.includes(k));
  const civEvents = (cid) => W.events.filter((e) => (e.civ === cid || e.other === cid) && happened(e));
  const knownCivs = () => {
    const set = new Set();
    for (const id of disc.keys()) { const e = W.events[id]; set.add(e.civ); if (e.other != null) set.add(e.other); }
    return [...set].sort((a, b) => a - b);
  };

  /* ---------- 操作 ---------- */
  function select(s, toTab) {
    st.sel = s;
    if (toTab) tab = toTab;
    renderAll();
  }
  function travel(to) {
    if (to === st.cur) return;
    const from = st.cur;
    st.days += travelDays(from, to);
    st.cur = to; st.sel = to;
    if (!visited(to)) st.visited.push(to);
    st.path.push(to); if (st.path.length > 60) st.path.shift();
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before);
    freshIds = new Set(news);
    save();
    const dur = reduce ? 0 : Math.min(1800, 450 + dist(from, to) * 0.9);
    if (dur) anim = { from, to, t0: performance.now(), dur };
    follow(to, dur);
    tab = 'sys';
    renderAll();
    const n = unsurveyed(to).length;
    toast(`${dateStr()}，抵达${nameOf(to)}。` + (n ? `检测到 ${n} 处人工痕迹。` : '没有检测到人工痕迹。'), news);
  }
  function linksFor(ids) {
    let n = 0;
    for (const id of ids) {
      const e = W.events[id];
      if (e.cause != null && disc.has(e.cause)) n++;
      for (const o of W.events) if (o.cause === id && disc.has(o.id) && !ids.includes(o.id)) n++;
    }
    return n;
  }
  function survey(key) {
    if (st.surveyed.includes(key)) return;
    st.surveyed.push(key); st.days += 2;
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before);
    const got = [...disc.keys()].filter((id) => !before.has(id) && disc.get(id) !== 'news');
    freshIds = new Set([...got, ...news]);
    save(); renderAll();
    const links = linksFor(got);
    toast(got.length ? `复原 ${got.length} 条记录` + (links ? `，接上 ${links} 处因果联系。` : '。') : '这里的记录你已经通过其他途径获知。', news);
  }
  function archive(cid) {
    const c = civOf(cid);
    const missing = civEvents(cid).filter((e) => !disc.has(e.id)).sort((a, b) => a.y - b.y).slice(0, 5).map((e) => e.id);
    st.archived.push(cid); st.archEv.push(...missing); st.days += 1;
    const before = new Set(disc.keys());
    recompute();
    const news = newsSince(before).filter((id) => !missing.includes(id));
    freshIds = new Set([...missing, ...news]);
    save(); renderAll();
    toast((missing.length ? `${c.who}的档案馆提供了 ${missing.length} 条记录。` : `${c.who}的档案中没有你尚未掌握的内容。`) + `今后会持续收到他们的通讯。`, news);
  }
  let toastT;
  function toast(msg, news) {
    const t = $('#toast');
    let h = `<div>${msg}</div>`;
    if (news && news.length) {
      const last = W.events[news[news.length - 1]];
      h += `<div class="tnews"><b>截获 ${news.length} 条新通讯</b>${last.sum}${news.length > 1 ? ' 等' : ''}</div>`;
    }
    t.innerHTML = W.sp(h); t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), news && news.length ? 5200 : 3200);
  }

  /* ---------- 渲染：顶栏、地图条 ---------- */
  function renderStatus() {
    const s = W.systems[st.cur];
    const t = today();
    $('#status').innerHTML = W.sp(`<span class="now" title="出发至今共 ${st.days} 天">当前 纪元 <b>${t.y}</b> 年 · 第 <b>${t.d}</b> 天</span><span>位置 <b>${nameOf(st.cur)}</b> · 星区 ${secName(W.systems[st.cur])}</span><span>记录 <b>${disc.size}</b>/${happenedCount}</span>`);
  }
  function renderBar() {
    const s = W.systems[st.sel], star = W.STARS[s.type];
    let html;
    if (st.sel === st.cur) {
      html = `${starSVG(star, 18)}<span class="where">${nameOf(st.sel)}</span><span class="meta">当前位置 · ${star.name}</span><span class="act">${nearestSignal() != null ? `<button class="btn" id="seek">前往最近的信号 · ${travelDays(st.cur, nearestSignal())} 天</button>` : `<span class="meta">附近没有已知信号，拖动星图去更远的地方看看</span>`}</span>`;
    } else {
      html = `${starSVG(star, 18)}<span class="where">${nameOf(st.sel)}</span><span class="meta">${star.name} · ${visited(st.sel) ? '已探索' : '未探索'} · 航程 ${travelDays(st.cur, st.sel)} 天</span>` +
        `<span class="act"><button class="btn primary" id="go">航行至此</button></span>`;
    }
    $('#mapbar').innerHTML = W.sp(html);
    const go = $('#go'); if (go) go.onclick = () => travel(st.sel);
    const seek = $('#seek'); if (seek) seek.onclick = () => travel(nearestSignal());
  }

  /* ---------- 图标 ---------- */
  function starSVG(star, size) {
    const c = star.color, g = star.glyph;
    let b = '';
    const ray = (n, L, w) => Array.from({ length: n }, (_, i) => { const a = (i * Math.PI * 2) / n; return `<line x1="0" y1="0" x2="${(Math.cos(a) * L).toFixed(2)}" y2="${(Math.sin(a) * L).toFixed(2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; }).join('');
    if (g === 'dwarf') b = `<circle r="7" fill="${c}" opacity=".18"/><circle r="4" fill="${c}"/>`;
    else if (g === 'sun') b = `<circle r="9.5" fill="${c}" opacity=".16"/><circle r="5.2" fill="${c}"/>`;
    else if (g === 'bright') b = `${ray(4, 11, 1)}<circle r="8" fill="${c}" opacity=".15"/><circle r="5" fill="${c}"/>`;
    else if (g === 'giant') b = `${ray(4, 11.5, 1.2)}<g transform="rotate(45)">${ray(4, 8, 1)}</g><circle r="9" fill="${c}" opacity=".2"/><circle r="6.4" fill="${c}"/>`;
    else if (g === 'white') b = `<circle r="7" fill="none" stroke="${c}" stroke-width="1" opacity=".7"/><circle r="2.6" fill="${c}"/>`;
    else if (g === 'pulsar') b = `<path d="M0 0 L-2.2 -11 L2.2 -11 Z M0 0 L-2.2 11 L2.2 11 Z" fill="${c}" opacity=".75" transform="rotate(25)"/><circle r="2.4" fill="#ffffff"/>`;
    else if (g === 'core') b = `<circle r="11" fill="${c}" opacity=".22"/><ellipse rx="11.5" ry="4" fill="none" stroke="${c}" stroke-width="1.8" transform="rotate(-18)"/><circle r="5.5" fill="#050a18" stroke="${c}" stroke-width="1"/>`;
    else if (g === 'hole') b = `<ellipse rx="10.5" ry="3.6" fill="none" stroke="${c}" stroke-width="1.6" transform="rotate(-18)"/><circle r="5" fill="#050a18" stroke="${c}" stroke-width=".8" opacity=".95"/>`;
    return `<svg class="ico" width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true">${b}</svg>`;
  }
  const PCOL = {
    海洋: ['#2f6fb0', '#2f6fb0'], 群岛: ['#2f6fb0', '#7fbf7a'], 温带: ['#3a76b5', '#6fae5c'], 草原: ['#3f74a8', '#b8b05a'], 雨林: ['#2f6a8f', '#3f8f4a'],
    荒漠: ['#c99a5e', '#a67646'], 冻原: ['#8fa6b8', '#e6eef4'], 冰封世界: ['#d9e7f2', '#ffffff'], 熔岩世界: ['#3b1d1a', '#ff8a3c'], 温室炼狱: ['#d9a443', '#f3d08a'],
    灼烧岩体: ['#8b6a5a', '#5d463b'], 冰冷岩体: ['#8d939e', '#666b75'], 荒芜岩体: ['#9a8e80', '#6d6459'],
    气态巨行星: ['#c9a27a', '#e8cfae'], 炽热气态巨行星: ['#d0704a', '#f2a477'], 冰巨星: ['#8fc6d6', '#c5e6ee'],
  };
  function planetSVG(p) {
    const R = { dwarf: 5.5, rock: 7.5, super: 9, gas: 11, ice: 10 }[p.kind] || 8;
    const [a, b2] = PCOL[p.climate] || ['#888', '#aaa'];
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    let f = '';
    const cl = p.climate;
    if (p.kind === 'gas' || p.kind === 'ice') {
      f = `<g clip-path="url(#${id})"><rect x="-14" y="${-R * 0.45}" width="28" height="${R * 0.28}" fill="${b2}" opacity=".7"/><rect x="-14" y="${R * 0.2}" width="28" height="${R * 0.22}" fill="${b2}" opacity=".5"/></g>`;
      if (p.moons >= 4 || p.kind === 'ice') f += `<ellipse rx="${R + 3.5}" ry="${R * 0.28}" fill="none" stroke="${b2}" stroke-width="1.1" opacity=".85" transform="rotate(${p.kind === 'ice' ? -55 : -14})"/>`;
    } else if (/海洋|温带|草原|雨林|群岛/.test(cl)) {
      f = cl === '群岛'
        ? `<g fill="${b2}"><circle cx="-3" cy="-2" r="1.3"/><circle cx="2" cy="1" r="1.1"/><circle cx="-1" cy="4" r="1"/><circle cx="4" cy="-4" r="0.9"/></g>`
        : cl === '海洋' ? `<path d="M${-R * 0.6} ${-R * 0.1} q${R * 0.3} ${-R * 0.25} ${R * 0.6} 0 t${R * 0.6} 0" fill="none" stroke="#9cc8ee" stroke-width=".9" opacity=".6"/>`
          : `<g clip-path="url(#${id})" fill="${b2}"><path d="M${-R} ${-R * 0.2} q${R * 0.4} ${-R * 0.7} ${R * 0.9} ${-R * 0.3} q${R * 0.2} ${R * 0.5} ${-R * 0.3} ${R * 0.7} z"/><path d="M${R * 0.15} ${R * 0.25} q${R * 0.5} ${-R * 0.3} ${R * 0.9} ${R * 0.1} l0 ${R * 0.6} q${-R * 0.5} ${R * 0.1} ${-R * 0.9} ${-R * 0.7} z"/></g>`;
      f += `<circle r="${R + 1.2}" fill="none" stroke="#8fc7ff" stroke-width=".8" opacity=".45"/>`;
    } else if (cl === '熔岩世界') {
      f = `<path d="M${-R * 0.7} ${-R * 0.2} l${R * 0.5} ${R * 0.3} l${R * 0.3} ${-R * 0.5} l${R * 0.6} ${R * 0.4} M${-R * 0.3} ${R * 0.5} l${R * 0.5} ${-R * 0.2}" stroke="${b2}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
    } else if (cl === '温室炼狱') {
      f = `<circle r="${R + 1.6}" fill="none" stroke="${b2}" stroke-width="1.4" opacity=".55"/><path d="M${-R} 0 h${R * 2}" stroke="${b2}" stroke-width="1" opacity=".6"/>`;
    } else if (cl === '冻原' || cl === '冰封世界') {
      f = `<g clip-path="url(#${id})" fill="${b2}"><ellipse cy="${-R}" rx="${R * 0.9}" ry="${R * 0.45}"/><ellipse cy="${R}" rx="${R * 0.8}" ry="${R * 0.35}"/></g>`;
    } else if (cl === '荒漠') {
      f = `<g clip-path="url(#${id})"><path d="M${-R} ${R * 0.1} q${R * 0.5} ${-R * 0.3} ${R} 0 t${R} 0" fill="none" stroke="${b2}" stroke-width="1.2"/><path d="M${-R} ${R * 0.5} q${R * 0.5} ${-R * 0.3} ${R} 0 t${R} 0" fill="none" stroke="${b2}" stroke-width="1"/></g>`;
    } else {
      f = `<circle cx="${-R * 0.3}" cy="${-R * 0.25}" r="${R * 0.22}" fill="${b2}"/><circle cx="${R * 0.35}" cy="${R * 0.3}" r="${R * 0.16}" fill="${b2}"/><circle cx="${R * 0.25}" cy="${-R * 0.45}" r="${R * 0.1}" fill="${b2}"/>`;
    }
    return `<svg class="ico" width="28" height="28" viewBox="-14 -14 28 28" aria-hidden="true"><defs><clipPath id="${id}"><circle r="${R}"/></clipPath></defs><circle r="${R}" fill="${a}" stroke="rgba(234,242,255,.22)" stroke-width=".7"/>${f}<path d="M${R * 0.1} ${-R} A${R} ${R} 0 0 1 ${R * 0.1} ${R} A${R * 0.75} ${R} 0 0 0 ${R * 0.1} ${-R}" fill="#000" opacity=".28"/></svg>`;
  }
  const debrisSVG = () => `<svg class="ico" width="28" height="28" viewBox="-14 -14 28 28" aria-hidden="true"><g fill="#98aed4"><rect x="-7" y="-3" width="5" height="2" transform="rotate(20)"/><rect x="2" y="-6" width="3" height="3" transform="rotate(-15)"/><rect x="-2" y="4" width="6" height="1.6"/><circle cx="7" cy="3" r="1"/></g></svg>`;
  function renderLegend() {
    const order = ['M', 'K', 'B', 'W', 'N', 'H', 'S'];
    const lab = { M: '红矮星', K: '主序恒星', B: '蓝白巨星', W: '白矮星', N: '脉冲星', H: '黑洞', S: '银河核心' };
    $('#lg').innerHTML = order.map((k) => `<span>${starSVG(W.STARS[k], 18)}${lab[k]}</span>`).join('') +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><path d="M0 -5 L5 0 L0 5 L-5 0 Z" fill="#ffd27a"/></svg>检测到人工痕迹</span>` +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><circle r="8" fill="none" stroke="#c9a8ff" stroke-width="1.6"/></svg>已发现文明遗迹</span>` +
      `<span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><path d="M-10 0 H10" stroke="#8fd3ff" stroke-dasharray="3 3" stroke-width="1.5"/></svg>你的航迹</span>` +
      `<span><b class="mono">KSC</b>无人命名的星系</span><span><svg class="ico" width="18" height="18" viewBox="-12 -12 24 24"><circle r="10" fill="#8fd3ff" opacity=".22"/></svg>远程扫描范围</span>`;
  }

  /* ---------- 渲染：面板 ---------- */
  function fragHTML(id) {
    const e = W.events[id];
    return `<div class="frag${freshIds.has(id) ? ' new' : ''}" style="--c:${civOf(e.civ).color}">
      <div class="find">${e.trace}</div>
      <div class="infer">${e.live ? `<b>${evDate(e)}</b>` : `推断 · <b>约纪元 ${e.y} 年</b>`}：${e.sum}</div></div>`;
  }
  function renderSys() {
    const sid = st.sel, s = W.systems[sid], star = W.STARS[s.type];
    const here = sid === st.cur, vis = visited(sid);
    let h = `<div class="eyebrow">恒星系 · 星区 ${secName(s)} · ${(s.x * 0.5).toFixed(0)}, ${(s.y * 0.5).toFixed(0)} pc</div>
      <div class="sysname"><span class="sicon">${starSVG(star, 30)}</span>${nameOf(sid)}${here ? '<span class="chip here">当前位置</span>' : vis ? '<span class="chip">已探索</span>' : '<span class="chip">未探索</span>'}</div>
      <div class="starline">${star.name} · ${star.cls}${star.temp ? ` · ${star.temp.toLocaleString('en')} K` : ''} · 光度 ${s.lum < 0.001 ? '< 0.001' : s.lum < 0.1 ? s.lum.toFixed(3) : s.lum.toFixed(2)} L☉</div>`;
    if (s.nova != null) h += `<p class="note">这是一处超新星遗迹。按气壳的膨胀速度推算，爆发发生在约纪元 ${Math.round(s.nova / 50) * 50} 年，此前这里是一颗${W.STARS[s.type0].name}。</p>`;
    if (!vis) {
      const sig = known(sid) ? unsurveyed(sid).length : 0;

  // 物种图鉴：识别出某个文明的物种后点亮对应条目
  function codexHTML() {
    const seen = new Map();
    for (const cid of knownCivs()) {
      const c = civOf(cid), got = civEvents(cid).filter((e) => disc.has(e.id));
      const ok = st.archived.includes(cid) || got.length >= 2 || got.some((e) => (e.type === 'found' || e.type === 'schism' || e.type === 'remnant') && e.civ === cid);
      if (ok) { const L = seen.get(c.sp.id) || []; L.push(cid); seen.set(c.sp.id, L); }
    }
    const inGalaxy = new Set(W.civs.map((c) => c.sp.id));
    let h = `<div class="codex"><div class="eyebrow">物种图鉴</div><div class="sysname" style="font-size:20px">${seen.size} / ${W.SPECIES.length}</div>
      <p class="note" style="margin:4px 0 10px">这片星系中出现过 ${inGalaxy.size} 个物种。识别出一个文明的物种后，对应条目会点亮。</p><div class="cgrid">`;
    const order = [...W.SPECIES].sort((a, b) => (seen.has(b.id) ? 1 : 0) - (seen.has(a.id) ? 1 : 0));
    for (const x of order) {
      const L = seen.get(x.id);
      h += L ? `<div class="centry"><b>${x.label}</b><span class="cwho">称作「${x.who}」 · ${x.script}</span><p>${x.desc}</p><span class="cciv">${L.map(civTag).join(' ')}</span></div>`
             : `<div class="centry dim"><b>？？？</b><p>${inGalaxy.has(x.id) ? '尚未识别' : '这片星系中似乎没有这个物种'}</p></div>`;
    }
    return h + `</div></div>`;
  }
  function renderAbout() {
    const s = W.stats;
    $('#pane').innerHTML = `<div class="about">
      <h2>一个种子，一片星域</h2>
      <p>这里没有存储任何星球数据。输入框里的种子经过哈希，变成一串确定的伪随机数；每个星系又用 <code>种子 + 编号</code> 得到自己的随机数序列。同一个种子永远生成同一片星域，换一个种子就是另一片宇宙。</p>
      <div class="stats">
        <div><b>${s.systems}</b><span>恒星系</span></div><div><b>${s.planets}</b><span>行星</span></div>
        <div><b>${s.habitable}</b><span>宜居行星</span></div><div><b>${s.civs}</b><span>文明（含分裂）</span></div>
        <div><b>${s.events}</b><span>历史事件</span></div><div><b>${s.figures}</b><span>留名的人物</span></div>
        <div><b>${W.wonders.length}</b><span>奇观</span></div><div><b>${s.ms.toFixed(0)} ms</b><span>生成并推演 ${W.present} 年</span></div>
      </div>
      <h2>一整个星系</h2>
      <p>宇宙是一个完整的螺旋星系：约一千个恒星系沿着几条旋臂分布，臂间稀疏，中心是超大质量黑洞。所有文明在同一张图上推演同一段历史，会越过星区边界扩张、接触和交战。星区（A1 到 F6）只是方便定位的网格编号。拖动星图可以平移，滚轮或双指可以缩放，右下角的按钮可以回到当前位置或纵览全星系，左上角的小地图点一下就能把视野移过去。</p>
      <h2>名字也是线索</h2>
      <p>每个文明分到一种命名语言和一种记录方式（文字、符文、信息素刻痕、晶体生长纹……）（音节表、辅音、元音和词尾的组合）。一个星系在第一次被某个文明占据时，用这个文明的语言命名；从未被占据的星系只有星表编号。所以在星图上，一片读音相近的星名往往就是同一个文明的旧疆域。分裂出来的文明沿用母文明的语言。</p>
      <h2>属性按因果推导</h2>
      <p>每一层只在上一层给定的范围内随机：</p>
      <pre>恒星类型（按真实比例，红矮星最多）
 → 光度 → 各轨道的平衡温度
 → 行星质量 → 能否保有大气 → 温室效应修正
 → 气候（海洋、荒漠、冻原……）→ 是否宜居
 → 母星环境 → 能在这里诞生的物种</pre>
      <p>物种共有 ${W.SPECIES.length} 类，取材于科幻和奇幻里常见的原型，名字与细节都是原创的：类人种族、精灵、矮人、兽人、猫裔、翼族，虫族与吞噬虫群，金属生命、数字意识、硅基晶族，菌丝网络、光合林民，深海种族、智慧头足类、覆盖整颗行星的单一海洋意识，冰原种族、潮汐锁定行星上的昏线族，气态巨行星里的浮游族和无实体意识，栖居在恒星日冕中的恒星之灵，只在死亡恒星旁繁衍的辐食族，寄居宿主体内的共生体，能模仿一切的拟形族，以及早在多数种族诞生之前就已消失的上古先行者。</p>
      <p>每个物种只会诞生在特定环境里，有的还挑恒星：光合族需要明亮的恒星，昏线族只出现在红矮星和橙矮星周围的潮汐锁定行星上，辐食族只在脉冲星、白矮星和黑洞附近。物种也影响历史：兽人、龙族和吞噬虫群好战，猫裔和拟形族更容易与人交好，数字意识和恒星之灵不受瘟疫影响、科技发展快，也更早从记录中消失；上古先行者总是最早出现，以很高的科技起步。</p>
      <h2>历史是推演出来的</h2>
      <p>每个文明有科技、稳定度、领土和对外关系。时间以 50 年为一步推进，每一步检查哪些事件满足触发条件：探测范围重叠会产生接触，关系恶化会引发战争，贸易航线会带来瘟疫，稳定度过低会导致内乱、政变、分裂或瓦解。</p>
      <p>多数文明诞生在别的文明附近，所以星系里会形成几个彼此纠缠的区域，也总有几个文明独自发展了很久。约三成文明是后来者：它们还没有飞船的时候，邻居可能已经在轨道上了。先到的一方按自己的取向行事，求知和隐修的只在暗处观察，贸易和信仰的带来技术，扩张的直接收为附庸。</p>
      <p>文明之间会通商、结盟、传教、窃取技术。开战时，盟友和宗主会被卷进来，也可能临阵背约；战败的一方可能割地，可能称臣，称臣的日后又可能起兵。每场战争都有名字。</p>
      <p>殖民地各有用途：定居点、矿场、采集站、转运港、观测站、边境要塞、隐修地、流放地、瘟疫后的安置点。用途由当时的处境决定，所以它的起因也不同：要塞是因为邻居，流放地是因为政变，矿场是因为本土枯竭。</p>
      <p>事件发生时会记下它的起因。你在编年史里看到的「起因」链接，就是推演时真实存在的因果，而不是事后拼接的文字。</p>
      <h2>人物、奇观与圣物</h2>
      <p>君主、统帅、先知和学者会留下名字，名字出自各自文明的语言。寿命按物种计算：精灵的君主在位几百年，龙王上千年；虫族只记母后的代数，金属生命和数字意识用编号；菌丝网络、行星之海这样的物种不为个体留名。一个人物可能出现在好几条记录里，墓志上列着他做过的事。</p>
      <p>繁荣的文明会建造奇观。奇观所在的星系被攻占时，它可能毁于战火，也可能换了主人。圣物会被供奉、被夺走、被陈列在征服者的都城，失主会为它再次开战；持有它的文明瓦解后，它留在废墟里，等后来者挖出来。</p>
      <h2>天灾</h2>
      <p>蓝白巨星可能爆发为超新星，留下脉冲星或黑洞，剥去周围星系的地表；栖居在那颗恒星里的文明会随它一同消亡。红矮星的耀斑会毁掉殖民地，小天体撞击会让宜居的行星变成冻原，过度开采的母星可能失去原有的气候，逼得文明迁都。行星现在的样子未必是它原来的样子，地层里留着记录。</p>
      <h2>你看到的只是碎片</h2>

    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch.k * (d / pinch.d));
    } else if (drag) {
      const [x, y] = local(e), dx = x - drag.x, dy = y - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
      if (drag.moved) { view.cx = drag.cx - dx / view.k; view.cy = drag.cy - dy / view.k; cv.classList.add('dragging'); draw(); }
    }
  });
  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const single = ptrs.size === 1;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (single && drag && !drag.moved && e.type === 'pointerup') clickAt(...local(e));
    if (!ptrs.size) { drag = null; cv.classList.remove('dragging'); }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, view.k * Math.exp(-e.deltaY * 0.0016)); }, { passive: false });
  function clickAt(mx, my) {
    let best = null, bd = 22;
    for (const s of W.systems) { const [px, py] = P(s.x, s.y); const d = Math.hypot(px - mx, py - my); if (d < bd) { bd = d; best = s.id; } }
    if (best == null) return;
    if (best === st.sel && best !== st.cur) travel(best);
    else select(best, 'sys');
  }
  mm.addEventListener('click', (e) => {
    const r = mm.getBoundingClientRect(), f = W.W / r.width;
    camTo((e.clientX - r.left) * f, (e.clientY - r.top) * f, view.k, 500);
  });
  $('#z-in').onclick = () => camTo(view.cx, view.cy, view.k * 1.6, 300);
  $('#z-out').onclick = () => camTo(view.cx, view.cy, view.k / 1.6, 300);
  $('#z-me').onclick = () => { const s = W.systems[st.cur]; camTo(s.x, s.y, KDEF(), 600); };
  $('#z-all').onclick = () => camTo(W.galaxy.CX, W.galaxy.CY, KMIN(), 700);

  /* ---------- 启动 ---------- */
  document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; freshIds = new Set(); renderPane(); }));
  $('#seedform').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#seed').value.trim() || '001'; tab = 'sys'; load(v); });
  $('#rand').onclick = () => { const v = Math.random().toString(36).slice(2, 7); tab = 'sys'; load(v, true); };
  new ResizeObserver(() => fit()).observe($('#mapwrap'));
  load(store.get(LAST) || '遗星-001');
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
