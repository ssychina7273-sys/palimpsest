<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="遗星志：一个由种子生成的螺旋星系。航行、勘测遗迹，拼回数十个文明三千年的因果历史。">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>遗星志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 布局：左侧星图（主角），右侧档案面板；窄屏上下堆叠。单一深色主题：夜间星图室 */
:root {
  /* 深空蓝：星图是最深的一层，面板浅一档，强调色取星光的冷青 */
  --ink: #0f2148;
  --ink-2: #16305e;
  --ink-3: #1f3d73;
  --line: #2d4d86;
  --fg: #eaf2ff;
  --fg-2: #c6d6f0;
  --muted: #98aed4;
  --faint: #6a84b2;
  --brass: #8fd3ff;
  --brass-dim: #4677b4;
  --signal: #ffd27a;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- 顶栏 ---------- */
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0b1838, var(--ink));
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 24px; letter-spacing: 0.18em; }
.brand span { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.seedbox { display: flex; align-items: center; gap: 6px; }
.seedbox label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.seedbox input {
  width: 9em; background: var(--ink-2); border: 1px solid var(--line); color: var(--fg); border-radius: 4px;
  padding: 5px 8px; font-family: var(--mono); font-size: 13px;
}
.btn {
  background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 11px; cursor: pointer; font-size: 13px;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--brass-dim); background: var(--ink-3); }
.btn.primary { border-color: var(--brass); color: #0b1a3a; background: var(--brass); font-weight: 600; }
.btn.primary:hover { background: #b4e3ff; }
.btn[disabled] { opacity: .45; cursor: default; }
.status { margin-left: auto; display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { color: var(--fg); font-weight: 500; }
.status { flex-wrap: wrap; row-gap: 6px; align-items: center; }
.status > span { white-space: nowrap; }
.status .now { color: var(--brass); padding: 2px 10px; border: 1px solid var(--brass-dim); border-radius: 12px; }
.status .now b { color: var(--brass); }

/* ---------- 主体 ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 410px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; display: block; }
.mapbar {
  position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: rgba(15, 33, 72, .82); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; backdrop-filter: blur(6px);
}
.mapbar .where { font-family: var(--serif); font-weight: 600; font-size: 15px; }
.mapbar .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mapbar .act { margin-left: auto; }
.legend { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); z-index: 2; }
.legend summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(15,33,72,.82); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::before { content: "+"; color: var(--brass); }
.legend[open] summary::before { content: "−"; }
.lg { margin-top: 6px; display: grid; grid-template-columns: repeat(2, max-content); gap: 6px 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: rgba(15,33,72,.94); box-shadow: 0 8px 24px rgba(3,10,30,.35); }
.lg span { display: inline-flex; align-items: center; gap: 7px; }
.lg .mono { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--fg); width: 18px; text-align: center; }
.ico { flex: none; display: block; }
.sicon { display: inline-flex; vertical-align: -4px; margin-right: 8px; }
.mapbar .ico { margin-right: -4px; }
.civ h3 .sp { font-family: var(--sans); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; }
.civ dd .sub { display: block; color: var(--muted); font-size: 12px; }
.civ dd .fig { display: inline-block; margin-right: 12px; }
.civ dd .fig small { margin-left: 5px; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.toast {
  position: absolute; top: 12px; right: 14px; max-width: min(320px, calc(100% - 28px));
  background: var(--ink-3); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 8px 12px; font-size: 13px;
  transition: opacity .3s, transform .3s; opacity: 0; transform: translateY(-6px); pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* ---------- 面板 ---------- */
aside.panel { border-left: 1px solid var(--line); background: var(--ink-2); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button {
  flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 4px 9px; cursor: pointer; color: var(--muted);
  font-size: 13px; letter-spacing: .06em;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tabs button .n { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 3px; }
.pane { overflow-y: auto; padding: 18px; padding-bottom: 32px; flex: 1; min-height: 0; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sysname { font-family: var(--serif); font-weight: 900; font-size: 28px; letter-spacing: .08em; margin: 4px 0 2px; text-wrap: balance; }
.starline { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 2px; margin-left: 6px; font-family: var(--sans); }
.chip.here { border-color: var(--brass-dim); color: var(--brass); }
.note { color: var(--muted); font-size: 13px; margin: 14px 0; }
.guide { margin: 16px 0 4px; padding: 12px 14px; border: 1px solid var(--brass-dim); border-radius: 6px; background: rgba(143,211,255,.07); font-size: 13px; }
.guide b { color: var(--brass); font-weight: 600; }
.guide ol { margin: 6px 0 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--fg-2); }
.mm { position: absolute; top: 46px; left: 14px; z-index: 1; width: 150px; height: 150px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #071230; }
.zoomctl { position: absolute; right: 14px; bottom: 78px; z-index: 1; display: grid; gap: 4px; }
.zoomctl button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: rgba(15,33,72,.82); color: var(--fg); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
.zoomctl button:hover { border-color: var(--brass); color: var(--brass); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,15,40,.75); color: var(--fg-2); font-family: var(--serif); font-size: 15px; letter-spacing: .1em; z-index: 3; }
.loading[hidden] { display: none; }
canvas#map { touch-action: none; cursor: grab; }
canvas#map.dragging { cursor: grabbing; }
@media (max-width: 860px) { .mm { width: 104px; height: 104px; } .zoomctl { bottom: 100px; } .toast { top: 46px; left: 130px; right: 14px; max-width: none; } }
.codex { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.centry { padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: rgba(143,211,255,.04); min-width: 0; }
.centry b { font-family: var(--serif); font-size: 14px; }
.centry .cwho { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.centry p { margin: 5px 0 6px; font-size: 12px; color: var(--fg-2); line-height: 1.55; }
.centry .cciv { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.centry.dim { opacity: .5; border-style: dashed; }
.centry.dim p { color: var(--muted); }
.goline { margin: 14px 0 4px; display: flex; align-items: center; gap: 12px; }
.goline .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.owned { margin: 16px 0 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owned p { margin: 0; flex: 1 1 180px; font-size: 13px; }

.planets { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); }
.planet { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.planet .num { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--serif); font-size: 12px; color: var(--muted); }
.planet .ttl { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.planet .ttl .kind { font-weight: 400; color: var(--muted); font-size: 12px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid; }
.tag.hab { color: #92e3ad; border-color: #2f6b5a; }
.tag.sig { color: var(--signal); border-color: #8a7444; }
.tag.won { color: #c9a8ff; border-color: #5b4a8c; }
.planet .data { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.planet .do { margin-top: 8px; }

.frag { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--c, var(--brass)); }
.frag .find { font-family: var(--serif); font-size: 13.5px; line-height: 1.75; }
.frag .infer { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.frag .infer b { color: var(--fg); font-weight: 600; }
.frag.new { animation: glow 2.2s ease-out; }
@keyframes glow { from { background: rgba(143, 211, 255, .14); } to { background: transparent; } }

.civtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.civtag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

/* 编年史 */
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
.progress div { height: 100%; background: var(--brass); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.filters button { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.filters button[aria-pressed="true"] { border-color: var(--brass-dim); color: var(--fg); background: var(--ink-3); }
.chron { list-style: none; margin: 10px 0 0; padding: 0; }
.entry { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.entry .yr { font-family: var(--mono); font-size: 12px; color: var(--brass); font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right; }
.entry .yr small { display: block; color: var(--faint); font-size: 10px; }
.entry .sum { font-family: var(--serif); font-size: 14px; line-height: 1.7; }
.entry .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.entry .meta button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; font-size: 12px; }
.entry .meta button:hover { color: var(--fg); }
.cause { margin-top: 6px; font-size: 12px; color: var(--muted); }
.cause.open { color: var(--faint); font-style: italic; }
.cause span.k { font-family: var(--mono); color: var(--brass-dim); margin-right: 4px; }
.toast .tnews { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); }
.toast .tnews b { display: block; color: var(--brass); font-weight: 600; font-size: 12px; }
.recent { margin: 14px 0 4px; padding: 10px 12px; border: 1px solid var(--brass-dim); border-radius: 6px; background: rgba(143,211,255,.05); display: grid; gap: 6px; }
.recent .ritem { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; font-size: 13px; }
.recent .rd { font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--brass); padding-top: 2px; }
.entry.live .yr { color: var(--brass); }
.entry.live .sum::before { content: "●"; color: var(--brass); font-size: 9px; vertical-align: 3px; margin-right: 6px; }
.civ dd.alive { color: #92e3ad; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; line-height: 1.8; }

/* 文明 */
.civ { padding: 16px 0; border-bottom: 1px solid var(--line); }
.civ h3 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 19px; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; }
.civ h3::before { content: ""; width: 12px; height: 12px; border-radius: 2px; background: var(--c); }
.civ dl { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 3px 10px; margin: 10px 0; font-size: 13px; }
.civ dt { color: var(--muted); }
.civ dd { margin: 0; }
.civ dd.unk { color: var(--faint); }
.track { position: relative; height: 18px; margin-top: 8px; }
.track .axis { position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: var(--line); }
.track .span { position: absolute; top: 7px; height: 3px; background: var(--c); opacity: .45; border-radius: 2px; }
.track .dot { position: absolute; top: 5px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--c); }
.ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.civ .cnt { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }

/* 原理 */
.about h2 { font-family: var(--serif); font-weight: 900; font-size: 18px; margin: 22px 0 6px; letter-spacing: .05em; }
.about h2:first-child { margin-top: 0; }
.about p { margin: 6px 0; color: var(--fg-2); max-width: 65ch; font-size: 13.5px; }
.about code { font-family: var(--mono); font-size: 12px; background: var(--ink-3); padding: 1px 5px; border-radius: 3px; color: var(--fg); }
.about pre { font-family: var(--mono); font-size: 11.5px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; color: var(--muted); line-height: 1.7; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-top: 10px; }
.stats div { background: var(--ink-2); padding: 9px 12px; }
.stats b { display: block; font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  html, body { height: auto; }
  body { overflow: auto; display: block; }
  .status { margin-left: 0; width: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 68vh; min-height: 420px; max-height: 720px; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .frag.new { animation: none; } .toast { transition: none; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand"><h1>遗星志</h1><span>星域考古模拟</span></div>
  <form class="seedbox" id="seedform">
    <label for="seed">种子</label>
    <input id="seed" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">生成</button>
    <button class="btn" type="button" id="rand">随机</button>
  </form>
  <div class="status" id="status"></div>
</header>
<main>
  <section class="mapwrap" id="mapwrap" aria-label="星图">
    <canvas id="map"></canvas>
    <details class="legend" id="legend"><summary>图例</summary><div class="lg" id="lg"></div></details>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas class="mm" id="mm" aria-label="全星系小地图，点击移动视野"></canvas>
    <div class="zoomctl" role="group" aria-label="星图视角">
      <button type="button" id="z-in" title="放大">+</button>
      <button type="button" id="z-out" title="缩小">−</button>
      <button type="button" id="z-me" title="回到当前位置">◎</button>
      <button type="button" id="z-all" title="纵览全星系">⤢</button>
    </div>
    <div class="loading" id="loading">正在生成星系并推演三千年历史…</div>
    <div class="mapbar" id="mapbar"></div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-sys" data-tab="sys" aria-selected="true">星系</button>
      <button role="tab" id="t-chron" data-tab="chron" aria-selected="false">编年史</button>
      <button role="tab" id="t-civ" data-tab="civ" aria-selected="false">文明</button>
      <button role="tab" id="t-about" data-tab="about" aria-selected="false">原理</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<script>
/* ===== 遗星志 · 生成器 =====
   同一个种子 → 同一片星域、同一段历史。
   1) 布局：恒星位置与航道
   2) 恒星系：恒星类型 → 行星轨道 → 温度 → 大气 → 气候
   3) 文明：从宜居行星中选出母星，物种形态由母星气候决定
   4) 历史：按 50 年一步推演，事件由条件触发，并记录"起因"
   5) 文本与年份抖动使用独立的随机数序列，改写描述不会改变历史本身
*/
const Gen = (() => {
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return () => {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function R(...parts) {
    const f = mulberry32(xmur3(parts.join('|'))());
    const r = {
      f,
      int: (a, b) => a + Math.floor(f() * (b - a + 1)),
      range: (a, b) => a + f() * (b - a),
      pick: (arr) => arr[Math.floor(f() * arr.length)],
      chance: (p) => f() < p,
      weighted: (pairs) => {
        let t = 0; for (const [, w] of pairs) t += w;
        let x = f() * t;

  function langWord(r, L, n, endP) {
    let w = '';
    for (let i = 0; i < n; i++) {
      if (L.syl) w += r.pick(L.syl) + (i === n - 1 ? '' : r.chance(0.15) ? r.pick(L.co) : '');
      else w += r.pick(L.on) + r.pick(L.vo) + (i < n - 1 && r.chance(0.35) ? r.pick(L.co) : '');
    }
    if (r.chance(endP)) w += r.pick(L.end);
    w = w.replace(/(.)\1\1/g, '$1$1');
    return w.charAt(0).toUpperCase() + w.slice(1);
  }

    const out = [];

    for (let i = 0; i < n; i++) {

      const outer = orbit > frost;
      const kind = outer
        ? r.weighted([['gas', 45], ['ice', 30], ['rock', 15], ['dwarf', 10]])

      else if (kind === 'rock') atmo = r.weighted([['无', 25], ['稀薄', 25], ['适中', 35], ['浓厚', 15]]);
      else if (kind === 'super') atmo = r.weighted([['稀薄', 15], ['适中', 45], ['浓厚', 40]]);
      let T = 278 * Math.pow(lum, 0.25) / Math.sqrt(orbit);

      else if (atmo === '适中') T += r.range(12, 38);
      else if (atmo === '稀薄') T += r.range(0, 6);
      let climate, hab = false;

  const KIND_NAME = { rock: '岩质行星', super: '超级地球', dwarf: '矮行星', gas: '气态巨行星', ice: '冰巨星' };

  function generate(seed) {

    const MIN = 60, CELL = 64, grid = new Map();

    const tooClose = (x, y, m) => {

    };
    const put = (s) => { const k = gk(Math.floor(s.x / CELL), Math.floor(s.y / CELL)); (grid.get(k) || grid.set(k, []).get(k)).push(s); };
    const systems = [];
    const used = new Set();
    const core = { id: 0, x: CX, y: CY, name: 'Sgr Ω', catalog: false, namedBy: null, type: 'S', lum: 0.0001, planets: [] };

    const n = systems.length;

    // 航道：最小生成树保证全图连通，再连上每个星系最近的两个邻居

    const edges = new Set();
    const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
    {
      const inT = new Uint8Array(n), bestD = new Float64Array(n).fill(Infinity), bestF = new Int32Array(n).fill(-1);
      bestD[0] = 0;

    }
    for (const s of systems) {

      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) { const L = grid.get(gk(gx + i, gy + j)); if (L) for (const o of L) if (o !== s) near.push(o); }
      near.sort((a, b) => d(s, a) - d(s, b));

    }

    const adj = systems.map(() => []);
    for (const [a, b] of lanes) { adj[a].push(b); adj[b].push(a); }
    const hops = (from) => {
      const dist = new Array(n).fill(Infinity); dist[from] = 0; const q = [from];
      for (let qi = 0; qi < q.length; qi++) { const c = q[qi]; for (const m of adj[c]) if (dist[m] === Infinity) { dist[m] = dist[c] + 1; q.push(m); } }

    };


    // ===== 文明 =====
    const cr = R(seed, 'civs');
    const civCount = Math.round(n / 40) + cr.int(-2, 2);
    const spPool = cr.shuffle(SPECIES);
    const allPl = [];
    for (const x of systems) if (x.type !== 'S') x.planets.forEach((p) => allPl.push([x.id, p.i]));
    const homes = [], homeSp = [], homeHops = [];
    for (let i = 0; i < civCount; i++) {
      const spc = spPool[i % spPool.length];
      const free = (c) => !homes.some((h) => h[0] === c[0]);
      const starOk = (c) => (spc.stars ? spc.stars.includes(systems[c[0]].type) : !'BNH'.includes(systems[c[0]].type));
      const cand = cr.shuffle(allPl.filter((c) => free(c) && starOk(c) && spc.homes.includes(systems[c[0]].planets[c[1]].climate)));
      const minHop = (c) => { let m = Infinity; for (const h of homeHops) if (h[c[0]] < m) m = h[c[0]]; return m; };
      let pick = null;
      // 多数文明诞生在别的文明附近，形成几个彼此纠缠的区域；少数远离所有人，独自发展
      if (i > 0 && cr.chance(0.72)) pick = cand.find((c) => { const m = minHop(c); return m >= 4 && m <= 7; });
      if (!pick) for (const need of [10, 6, 5, 4, 3, 2, 1]) { pick = cand.find((c) => minHop(c) >= need); if (pick) break; }

        if (!opts.length) opts = cr.shuffle(allPl.filter(free));
        pick = opts.find((c) => minHop(c) >= 4) || opts[0];
        const p = systems[pick[0]].planets[pick[1]], cl = spc.homes[0];

    const civs = [], figures = [];

    // 文本与年份抖动专用的随机数：改写描述不会影响推演结果

    // 星系在第一次被某个文明占据时，以该文明的语言命名

    };
    const makeCiv = (home, origin, parent, spc) => {
      const id = civs.length;
      const rr = R(seed, 'civ', id);
      const lang = parent ? parent.lang : langPool[id % langPool.length];
      let name;
      do { name = langWord(rr, lang, rr.int(1, 2), parent ? 0.9 : 0.55); } while ((!speakable(name, 4, 8) || used.has(name)) && rr.f() < 0.999);

        id, name, lang, langLabel: lang.label, color: civColor(id),

        culture: parent ? [parent.culture[0], rr.pick(S.cult.filter((x) => x !== parent.culture[0]))] : rr.shuffle(S.cult).slice(0, 2),
        society: rr.pick(S.pol),

    };

    const reserved = new Set(homes.map((h) => h[0]));

    const contactEv = {}, tradeEvP = {}, allyEv = {};
    const wars = [], wonders = [], relics = [];
    const pk = (a, b) => (a < b ? a + ':' + b : b + ':' + a);

        : /部族|部落|氏族/.test(s) ? '大酋长' : /共和|议|长老|联盟|同盟|联合|共同体|执政|大会/.test(s) ? '执政官' : '领袖');

          `一座没有被盗掘过的陵墓，随葬品的摆放遵循「${c.culture[0]}」的习俗。棺椁上只刻了一个名字：${f.name}。`,

    };

    // ---- 奇观与圣物 ----

    };
    const RELIC_SP = { silicon: ['初生晶核', '第一道生长纹'], fungal: ['始祖孢囊', '母网的第一个节点'], plant: ['母株之种', '初花的标本'], oceanmind: ['初潮之水'] };
    const properName = (c) => { let nm, g = 0; do { nm = langWord(tx, c.lang, 2, 0.5); } while ((!speakable(nm, 4, 9) || used.has(nm)) && g++ < 60); used.add(nm); return nm; };
    const DISC = [
      ['绘制出本旋臂的航道潮汐图', '航道潮汐图'], ['证明了跨星系即时通讯的可行性', '论即时通讯'], ['解出了恒星寿命的演化方程', '恒星寿命表'],

    ];

    // 圣物的归宿：持有者覆灭时，原主若还在就把它取回去；否则它留在废墟里，等后来者发掘
    const dropRelics = (c, id, y) => {
      for (const r of relics) {

          ev({ y, type: 'reclaim', relic: r.id, civ: O.id, other: c.id, sys: r.sys, pl: r.pl, cause: id,
            sum: `${c.name}覆灭后，${O.polity()}取回了「${r.name}」。`,
            trace: `「${r.name}」回到了原处。基座上原有的轮廓与它严丝合缝，只是旁边多了一道修补过的裂痕。` });
          if (O.grudge === c.id) { O.grudge = null; O.relicLost = null; }
          O.stab += 0.1;
        } else { r.holder = null; r.lost = true; r.lostEv = id; }
      }
    };

    // ---- 一个文明的终结，以及它的余波 ----
    const collapse = (c, y, cause, conquered, how) => {
      if (!c.alive) return;
      const sid = c.cap[0], pl = c.cap[1];
      if (!conquered && !how && c.tech >= 5 && er.chance(0.5)) {
        cause = ev({ y, type: 'exodus', civ: c.id, sys: sid, pl, cause,
          sum: `${c.polity()}在衰落中建造方舟舰队，驶离了本星域。`,
          trace: V([
            `${plName(sid, pl)}轨道上的巨型船坞已经空置。最后一次发射的航向记录指向星域之外，此后没有回传信号。`,
            `${plName(sid, pl)}的高轨道上留着 ${tx.int(6, 30)} 座空的船台，排成一列。每座船台的铭牌上都有一个船名，其中一个被划掉了。`,
          ]) });
      }
      const terr = [...c.territory];
      const id = ev({ y, type: 'collapse', civ: c.id, sys: sid, pl, cause,
        sum: conquered ? V([`${c.polity()}失去最后的领土，作为独立文明不复存在。`, `${c.polity()}亡于外敌，此后的记录都出自征服者之手。`])
          : how === 'nova' ? `恒星熄灭，${c.polity()}随之消亡。`
          : V([`${c.polity()}瓦解，此后不再留下任何记录。`, `${c.polity()}的中央政权停止运作，各地各自为政，不久便都沉寂了。`]),
        trace: conquered
          ? V([
            `${c.name}的核心设施在同一时期被摧毁，焦土层厚达数米。此后的地层中只有征服者的遗物。`,
            `${c.name}的设施在很短的时间内相继停用。最后一批${c.sp.script}记录的是物资移交清单，接收方一栏写着另一个文明的名字。`,
          ])
          : how === 'nova' ? `这里只剩下恒星残骸周围一圈缓慢扩散的气壳。${c.name}${c.sp.script}的最后一段记录异常平静，逐项列出了它们打算保存的东西。`
          : V(K(c, {
            flesh: [
              `所有官方记录在同一年中断。城市没有遭受破坏的迹象，只是被逐渐遗弃，风沙填满了街道。`,
              `最后一批官方文书的日期越来越稀疏，最后一份只写了开头。此后的地层里只有零散的个人物品。`,
              `粮仓和水库是最后被废弃的建筑。仓门上的封条被反复撕开又贴上，最上面一层没有盖章。`,
            ],
            any: [
              `所有记录在同一年中断。设施没有遭受破坏的迹象，只是一处接一处地停止了运转。`,
              `${c.name}${c.sp.script}的记录越来越稀疏，最后一段没有写完。此后这里再没有新的痕迹。`,
            ],
          })) });
      c.alive = false; c.endYear = events[id].y; c.fate = conquered ? '被征服' : how === 'nova' ? '毁于超新星' : '瓦解'; c.endEv = id;
      for (const s of c.territory) { owner[s] = null; ruins[s].add(c.id); }
      c.territory.clear();
      for (const w of wars) {
        if (w.over) continue;
        if (w.a === c.id || w.b === c.id) w.over = true;
        else { w.sa = w.sa.filter((x) => x !== c.id); w.sb = w.sb.filter((x) => x !== c.id); }
      }
      for (const a of c.allies) civs[a].allies.delete(c.id);
      c.allies.clear();
      dropRelics(c, id, y);
      // 难民：投奔关系最好的邻居
      let host = null;
      for (const oid of c.contacted) { const o = civs[oid]; if (o.alive && o.space && getRel(c, o) > -0.1 && (!host || getRel(c, o) > getRel(c, host))) host = o; }
      if (host && c.sp.kind !== 'field' && er.chance(conquered ? 0.35 : 0.6)) {
        const hs = host.cap[0], hp = host.cap[1];
        ev({ y, type: 'refugee', civ: host.id, other: c.id, sys: hs, pl: hp, cause: id,
          sum: `${c.name}覆灭后，一批${c.who}难民在${host.polity()}境内定居。`,
          trace: c.sp.kind === 'flesh' && host.sp.kind === 'flesh'
            ? `${at(hs, hp)}有一个街区的建筑风格与周围完全不同。门楣上的${c.name}${c.sp.script}一直用到了第三代人，之后换成了${host.name}${host.sp.script}。`
            : `${at(hs, hp)}有一处聚居地，遗物全部属于${c.who}，却建在${host.who}的疆域深处。最早的一批物件上还留着仓促迁徙的痕迹。` });
        host.tech = Math.min(10, host.tech + 0.2); host.stab -= 0.04;
      }
      // 残部：边远的驻地自立为新的政权
      if (!conquered && terr.length >= 4 && er.chance(0.45)) {
        const hd = hops(sid);
        const far = terr.filter((s) => s !== sid && systems[s].planets.length && systems[s].type !== 'S' && !systems[s].nova).sort((a, b) => hd[b] - hd[a]);
        if (far.length) {
          const base = far[0];
          const take = [base, ...adj[base].filter((x) => terr.includes(x) && x !== sid)].slice(0, 3);
          let bp = systems[base].planets.findIndex((p) => p.kind === 'rock' || p.kind === 'super');
          if (c.sp.prefer === 'gas' || bp < 0) bp = pickPlanet(base, c.sp.prefer || 'solid');
          const nc = makeCiv([base, bp], y, c, c.sp);
          nc.founded = true; nc.space = true; nc.stab = 0.55; nc.tech = Math.max(3, c.tech - 0.6);
          nc.territory.clear();
          for (const s of take) { nc.territory.add(s); owner[s] = nc.id; }
          for (const oid of c.contacted) { const o = civs[oid]; if (o.alive) { nc.contacted.add(oid); o.contacted.add(nc.id); setRel(nc, o, getRel(c, o) * 0.5); contactEv[pk(nc.id, oid)] = contactEv[pk(c.id, oid)]; } }
          const f = figure(nc, 'ruler', y); nc.ruler = f;
          nc.foundEv = deed(f, ev({ y, type: 'remnant', civ: nc.id, other: c.id, sys: base, pl: bp, cause: id,
            sum: `${c.name}瓦解后，${sysN(base)}的驻地${f ? '在' + f.full + '带领下' : ''}自立，建立${nc.polity()}。`,
            trace: K(nc, {
              flesh: `${at(base, bp)}的官署换过一次门牌。旧门牌没有拆走，只是翻了个面，背面刻上了「${nc.polity()}」。`,
              any: `${at(base, bp)}的设施在母邦瓦解之后继续运转了下去。纪年方式在那一年改了，新的元年就是${nc.name}建立的那一年。`,
            }) }));
          nc.lastColony = nc.foundEv;
        }
      }
    };

    // 迁都：母星受创后，把政治中心搬到最好的一处殖民地
    const moveCapital = (c, y, cause) => {
      const opts = [...c.territory].filter((s) => s !== c.cap[0] && systems[s].planets.length);
      if (!opts.length) return;
      const s = opts.find((x) => systems[x].planets.some((p) => p.hab)) ?? opts[0];
      const pl = pickPlanet(s, c.sp.prefer || 'hab');
      c.cap = [s, pl];
      ev({ y, type: 'capital', civ: c.id, sys: s, pl, cause,
        sum: `${c.polity()}把都城迁往${plName(s, pl)}。`,
        trace: K(c, {
          flesh: `${at(s, pl)}的官方建筑是在很短的时间内建成的，用料却很讲究。奠基铭文提到了旧都，用的是过去时。`,
          any: `${at(s, pl)}的设施在这一时期突然扩大了数倍。${c.name}的记录从此改以这里为起算点。`,
        }) });
    };

    // ---- 天灾 ----
    const bStars = systems.filter((s) => s.type === 'B');
    const nova = (s, y) => {
      const oldName = STARS[s.type].name;
      const rem = er.chance(0.75) ? 'N' : 'H';
      s.nova = y; s.type0 = s.type; s.type = rem; s.lum = er.range(STARS[rem].lum[0], STARS[rem].lum[1]);
      for (const p of s.planets) if (p.kind !== 'gas' && p.kind !== 'ice') { p.was = p.climate; p.climate = '冰冷岩体'; p.atmo = '无'; p.hab = false; p.T = er.range(40, 120); }
      const ring1 = new Set([s.id, ...adj[s.id]]), hit = new Map();
      for (const x of [s.id, ...near2[s.id]]) { const o = owner[x]; if (o != null) (hit.get(o) || hit.set(o, []).get(o)).push(x); }
      let any = false;
      for (const [cid, list] of hit) {
        const c = civs[cid]; any = true;
        const doomed = ring1.has(c.cap[0]);
        const lost = list.filter((x) => ring1.has(x) && x !== c.cap[0]);
        const site = lost[0] ?? list[0], pl = pickPlanet(site);
        for (const x of lost) abandon(c, x);
        c.stab -= doomed ? 0.4 : 0.08 + lost.length * 0.06;
        const ne = ev({ y, type: 'nova', civ: c.id, sys: site, pl, cause: null,
          sum: lost.length ? `${sysN(s.id)}的${oldName}爆发为超新星，${c.polity()}失去了周边 ${lost.length} 个星系。` : `${sysN(s.id)}的${oldName}爆发为超新星，${c.polity()}的${doomed ? '母星' : '边境'}受到辐射冲击。`,
          trace: V([
            `${plName(site, pl)}朝着${sysN(s.id)}的那一面被剥去了表层。残存的掩体里，辐射计的读数停在量程的尽头。`,
            `${at(site, pl)}的设施朝同一个方向熔毁。${c.name}${c.sp.script}的最后几条记录在讨论一颗越来越亮的恒星，没有提到撤离。`,
          ]) });
        c.lastNeg = ne; c.disasterEv = ne;
        if (doomed && (c.cap[0] === s.id || c.territory.size <= 2 || er.chance(0.5))) collapse(c, y, ne, false, 'nova');
        else if (doomed) moveCapital(c, y, ne);
      }
      return any;
    };
    const HAB_SET = new Set(HAB);
    const impact = (c, y) => {
      const s = er.pick([...c.territory]), isCap = s === c.cap[0];
      const pl = isCap ? c.cap[1] : pickPlanet(s, 'solid');
      if (!solidAt(s, pl)) return false;
      const p = systems[s].planets[pl];
      const winter = HAB_SET.has(p.climate) && p.climate !== '荒漠';
      if (winter) { p.was = p.climate; p.climate = '冻原'; p.hab = false; p.T = er.range(205, 250); }
      const lostCol = !isCap && c.territory.size > 1;
      const ie = ev({ y, type: 'impact', civ: c.id, sys: s, pl, cause: null,
        sum: isCap ? `一颗小天体撞击了${c.polity()}的都城所在的${plName(s, pl)}。` : `一颗小天体撞击${plName(s, pl)}，${c.polity()}在那里的殖民地没有留下幸存者。`,
        trace: V([
          `${plName(s, pl)}上有一个直径 ${tx.int(40, 300)} 公里的撞击坑，边缘切过一片${c.name}的遗址。坑外的建筑朝同一个方向倒伏。`,
          `${plName(s, pl)}的地层里夹着一层薄薄的熔融玻璃，遍布全球。这一层之下是${c.name}的遗物，之上什么都没有。`,
        ]) + (winter ? '此后的沉积层里不再有植物的痕迹。' : '') });
      c.lastNeg = ie; c.disasterEv = ie;
      if (lostCol) { abandon(c, s); c.stab -= 0.08; }
      else { c.stab -= 0.28; c.tech = Math.max(1, c.tech - 0.4); if (er.chance(0.5)) moveCapital(c, y, ie); }
      return true;
    };
    const flare = (c, y) => {
      const ms = [...c.territory].filter((s) => systems[s].type === 'M' && s !== c.cap[0]);
      if (!ms.length) return false;
      const s = er.pick(ms), pl = pickPlanet(s, 'solid');
      const fe = ev({ y, type: 'flare', civ: c.id, sys: s, pl, cause: null,
        sum: `${sysN(s)}的红矮星爆发强烈耀斑，${c.polity()}放弃了那里的殖民地。`,
        trace: V([
          `${at(s, pl)}向阳一面的设施表面全部熔成了玻璃质，背阴一面完好。撤离是有序的，仓库都清空了。`,
          `${at(s, pl)}的电子设备在同一瞬间全部烧毁。手写的${c.sp.script}记录在那之后又延续了 ${tx.int(20, 300)} 天，最后一页是撤离名单。`,
        ]) });
      abandon(c, s); c.stab -= 0.06; c.lastNeg = fe; c.disasterEv = fe;
      return true;
    };
    const climateShift = (c, y) => {
      const p = systems[c.cap[0]].planets[c.cap[1]];
      if (!p || !p.hab || c.sp.kind !== 'flesh') return false;
      const to = er.chance(0.5) ? '冻原' : '荒漠';
      const man = c.depleteEv != null;
      p.was = p.climate; p.climate = to; p.hab = false; p.T = to === '冻原' ? er.range(205, 250) : er.range(336, 400);
      const ce = ev({ y, type: 'climate', civ: c.id, sys: c.cap[0], pl: c.cap[1], cause: man ? c.depleteEv : null,
        sum: man ? `长期的过度开采之后，${plName(c.cap[0], c.cap[1])}的气候失衡，${c.polity()}的都城不再宜居。` : `${plName(c.cap[0], c.cap[1])}的气候在几代人之内剧变，${c.polity()}的都城不再宜居。`,
        trace: to === '冻原'
          ? V([
            `${plName(c.cap[0], c.cap[1])}的冰层下压着一整套灌溉系统。渠道是为温暖的气候设计的，最后一次修缮时已经加装了保温层。`,
            `${plName(c.cap[0], c.cap[1])}的旧城里，晚期的房屋一幢比一幢矮，墙一幢比一幢厚。最晚的几幢已经完全建在地下。`,
          ])
          : V([
            `${plName(c.cap[0], c.cap[1])}的沙层下埋着成片的码头和堤坝，离今天最近的水源有数百公里。`,
            `${plName(c.cap[0], c.cap[1])}的旧城外有一圈又一圈的防沙墙，越往外的越新，也越矮。最外面的一圈只砌了一半。`,
          ]) });
      c.stab -= 0.22; c.lastNeg = ce; c.disasterEv = ce;
      if (er.chance(0.6)) moveCapital(c, y, ce);
      return true;
    };

    // ---- 殖民：每处殖民地都有它的用途和缘由 ----
    const colonize = (c, y) => {
      const opts = [];
      const reach = c.tech >= 5 ? near2 : adj;
      for (const s of c.territory) for (const m of reach[s]) if (owner[m] == null && !reserved.has(m) && systems[m].planets.length && !opts.includes(m)) opts.push(m);
      if (!opts.length) return;
      const sid = er.pick(opts), sysT = systems[sid], star = STARS[sysT.type];
      let rival = null;
      for (const x of near2[sid]) { const o = owner[x]; if (o != null && o !== c.id && c.contacted.has(o) && civs[o].alive && getRel(c, civs[o]) < 0.15) { rival = civs[o]; break; } }
      let kind = 'settle', cause = c.lastColony;
      if (rival && er.chance(0.7)) { kind = 'fort'; cause = contactEv[pk(c.id, rival.id)] ?? cause; }
      else if (recent(c.plagueEv, y, 100) && er.chance(0.5)) { kind = 'refuge'; cause = c.plagueEv; }
      else if (recent(c.coupEv, y, 100) && c.sp.kind === 'flesh' && er.chance(0.5)) { kind = 'exile'; cause = c.coupEv; }
      else if (c.depleteEv != null && er.chance(0.5)) { kind = 'mine'; cause = c.depleteEv; }
      else if ('NWHB'.includes(sysT.type) && (c.ethos === '求知' || er.chance(0.4))) kind = 'lab';
      else if (c.ethos === '信仰' && c.faithEv != null && c.sp.kind === 'flesh' && er.chance(0.45)) { kind = 'abbey'; cause = c.faithEv; }
      else if (c.tradeEv != null && adj[sid].length >= 3 && er.chance(0.5)) { kind = 'port'; cause = c.tradeEv; }
      else if (er.chance(0.2)) kind = 'mine';
      const pl = pickPlanet(sid, c.sp.prefer || (kind === 'settle' || kind === 'refuge' ? 'hab' : 'solid'));
      const solid = solidAt(sid, pl), P = c.polity(), sc = c.sp.script;
      if (!solid && c.sp.prefer !== 'gas' && (kind === 'settle' || kind === 'mine')) kind = 'harvest';
      if (!solid && (kind === 'abbey' || kind === 'exile' || kind === 'refuge')) kind = 'settle';
      owner[sid] = c.id; c.territory.add(sid); claim(sid, c);
      const S2 = sysN(sid), PL2 = plName(sid, pl), AT2 = at(sid, pl);
      let sum, trace;
      if (kind === 'fort') {
        sum = V([`${P}在${S2}星系修建要塞，防备${rival.polity()}。`, `${P}抢在${rival.polity()}之前占据了${S2}星系，并在那里驻军。`]);
        trace = V([
          `${PL2}的轨道上有一圈防御平台的残骸，炮位全部朝向${rival.name}疆域的方向。`,
          `布设在${S2}外围的一片雷区，至今仍有零星的引信在待机。布雷记录用的是${c.name}${sc}。`,
          `${S2}的每一条航道入口都有一座哨站，彼此之间用定向通讯相连。哨站的巡逻日志里，朝向${rival.name}一侧的条目是其余方向的十倍。`,
          `${AT2}的一座船坞，只造过一种船：${c.name}的护卫舰。船台上还留着一艘，龙骨已经铺好，没有来得及合拢。`,
          K(c, {
            flesh: `${AT2}的一处驻军基地，营房的规模远大于仓库。墙上的${sc}标语反复提到「${rival.name}」。`,
            any: `${AT2}的一处前哨，储备的全是军用物资。${c.name}${sc}的值守记录里，「${rival.name}」这个名字每天都出现。`,
          }),
        ]);
      } else if (kind === 'mine') {
        sum = c.depleteEv === cause && cause != null ? `${P}为弥补本土的枯竭，在${S2}星系开矿。` : `${P}在${S2}星系开设采矿前哨。`;
        trace = V([
          `${PL2}上有一片露天矿场，矿坑按统一的网格排列。运输轨道的尽头是一座已经拆空的发射架。`,
          `${PL2}的地壳被钻出了数百个竖井，井口的标牌用${sc}编号。最深的一口没有回填。`,
          `${PL2}上的一处矿区，附近的矿脉已被采空，矿渣堆成了新的山丘。账目显示，产出全部运回了${c.name}本土。`,
          `${PL2}的一条峡谷被整段挖空，两壁留着逐层下切的台阶。谷底的冶炼炉里还有没出完的炉渣。`,
          `一批标着${c.name}${sc}的矿石罐，整齐地码在${PL2}的发射场上，等着一艘没有来的货船。`,
        ]);
      } else if (kind === 'harvest') {
        sum = `${P}在${S2}星系的${sysT.planets[pl].climate}轨道上建起采集站。`;
        trace = V([
          `${PL2}的高层大气里漂着一座采集平台，导管还垂在云层中。储罐是空的，阀门上印着${c.who}的徽记。`,
          `环绕${PL2}的一圈储罐卫星，轨道已经开始衰减。对接口的规格与${c.name}的飞船一致。`,
        ]);
      } else if (kind === 'port') {
        sum = `${P}在${S2}星系设立转运港。`;
        trace = V([
          `${PL2}轨道上的一座环形港，泊位有 ${tx.int(24, 180)} 个，远多于当地所需。货物清单用${sc}和另一种记录方式对照书写。`,
          `${S2}是 ${adj[sid].length} 条航道的交汇处。${PL2}附近的中转仓库里，货架按目的地分区，标签至少有三种写法。`,
        ]);
      } else if (kind === 'lab') {
        sum = `${P}在${S2}星系建立观测站，研究这里的${star.name}。`;
        trace = V([
          `${AT2}有一座观测站，所有仪器都对准了${S2}的${star.name}。数据库里存着 ${tx.int(30, 900)} 年的连续读数。`,
          `一组环绕${star.name}的探测器，排成精确的等边阵列。回传的数据用${c.name}${sc}标注，最后一条之后再无记录。`,
        ]);
      } else if (kind === 'abbey') {
        sum = `${P}的信众在${S2}星系建立隐修地。`;
        trace = V([
          `${PL2}上的一处隐修地，没有任何商业设施，只有 ${tx.int(30, 400)} 间面积相同的静室。每扇门上都刻着同一句经文。`,
          `一座建在${PL2}山脊上的修院，窗口全部朝向${c.name}母星的方向。抄写室里的手稿只抄到一半。`,
        ]);
      } else if (kind === 'exile') {
        sum = `${P}把政变中的失败者流放到${S2}星系。`;
        trace = V([
          `${PL2}上的一处定居点，围墙的岗楼朝向内侧。住户名册用${sc}写成，每个名字后面都标着刑期，多数是「终身」。`,
          `一批没有窗户的预制舱，排列在${PL2}最贫瘠的平原上。舱壁内侧刻满了日期，最长的一列持续了 ${tx.int(11, 60)} 年。`,
        ]);
      } else if (kind === 'refuge') {
        sum = `${P}把瘟疫中的幸存者安置到${S2}星系。`;
        trace = K(c, {
          flesh: `${PL2}上的定居点建得很仓促，建筑之间留着异常宽的间隔。登记簿上，每户的原籍后面都注明了检疫天数。`,
          any: `${AT2}有一处匆忙建成的聚居地，规模不大。从遗物看，迁来的个体全部出自同一批幸存者。`,
        });
      } else {
        sum = V([`${P}在${S2}星系建立殖民地。`, `${P}的移民船抵达${S2}星系，建立定居点。`, `${P}把疆域扩展到了${S2}星系。`]);
        const own = [c.sp.settle, c.sp.settle2].filter(Boolean).map((t) => `${PL2}${t.startsWith('的') ? '' : '上'}${t}`);
        trace = own.length ? V([...own,
          `${AT2}有一处${c.who}的据点，规模不大，布局与${c.name}母星上的完全一致。`,
          `一座仍在广播的导航信标，编码是${c.name}${sc}。它标出的航线，一头在${S2}，一头在${c.name}的母星。`,
        ]) : V([
          `${PL2}上有一处规划整齐的定居点，建筑使用统一规格的预制模块。奠基碑上用${sc}刻着首批移民的名单，共 ${tx.int(40, 900)} 个名字。`,
          `${PL2}上发现一座穹顶聚落，气闸门上印着${c.who}的徽记。仓库里还留有几批没有开封的补给。`,
          `一条从${PL2}延伸到轨道的货运缆索，底座的铭牌用${sc}记录了殖民地的建立年份。`,
          `${PL2}上的一片农田遗迹，田垄的走向迁就着当地的地形。最早的一批农具是从别处带来的，后来的都是就地打造。`,
          `${PL2}上有一座小镇，街道以${c.name}母星的地名命名。镇中心的石碑记着建镇那一年的收成。`,
        ]);
      }
      const hadRuin = [...ruins[sid]].filter((x) => x !== c.id);
      c.lastColony = ev({ y, type: 'colony', kind, civ: c.id, other: kind === 'fort' ? rival.id : undefined, sys: sid, pl, cause, sum, trace });
      // 在别人的废墟上落脚
      const lostRelic = relics.find((r) => r.lost && r.sys === sid);
      if (lostRelic) {
        const from = civs[lostRelic.origin];
        lostRelic.lost = false; lostRelic.holder = c.id; lostRelic.sys = c.cap[0]; lostRelic.pl = c.cap[1];
        ev({ y, type: 'recover', civ: c.id, other: from.id, sys: sid, pl, cause: lostRelic.lostEv ?? c.lastColony,
          sum: `${c.who}在${S2}星系的废墟中找到了「${lostRelic.name}」。`,
          trace: `一处发掘现场，探方中央留着一个器物形状的空腔。${c.who}的记录说，从这里取出的东西，${from.who}称它为「${lostRelic.name}」。` });
        c.stab += 0.08;
      }
      if (hadRuin.length && !c.dug.has(hadRuin[0]) && er.chance(0.7)) {
        const old = civs[hadRuin[0]]; c.dug.add(old.id);
        const boost = old.tech > c.tech;
        ev({ y, type: 'dig', civ: c.id, other: old.id, sys: sid, pl, cause: old.endEv ?? null,
          sum: boost ? `${c.who}在${S2}星系发掘${old.who}的遗迹，从中学到了自己尚未掌握的技术。` : `${c.who}在${S2}星系发掘出更早的${old.who}遗迹。`,
          trace: V([
            `一处考古营地，工具上印着${c.who}的标记。他们挖掘的对象比营地本身古老得多，探方里露出的是${old.name}${old.sp.script}。`,
            `${c.who}在这里留下了一整套测绘图，画的是${old.who}的遗址。图上的注释起初全是问号，越往后问号越少。`,
          ]) });
        if (boost) c.tech = Math.min(10, c.tech + 0.35);
      }
    };

    // ---- 与尚未进入太空的文明相遇 ----
    const primitive = (c, o, y) => {
      const hs = o.home[0], hp = o.home[1];
      if (c.ethos === '求知' || c.ethos === '隐修') {
        c.watching[o.id] = ev({ y, type: 'watch', civ: c.id, other: o.id, sys: hs, pl: -1, cause: c.lastColony,
          sum: `${c.polity()}发现了尚未进入太空的${o.who}，决定只观察、不接触。`,
          trace: V([
            `${sysN(hs)}外围的一颗小天体内部被掏空，装满了监听设备，属于${c.who}。记录里没有任何一次对外发射。`,
            `一圈涂成黑色的小型探测器，停在${sysN(hs)}最外侧的轨道上，全部背对恒星。它们属于${c.who}，存储器里是${o.who}几百年间的无线电广播。`,
            `${sysN(hs)}的彗星带里藏着一座${c.name}的观察哨。守则的第一条用${c.sp.script}写着：不得被看见。`,
          ]) });
        return;
      }
      c.contacted.add(o.id); o.contacted.add(c.id);
      if (c.ethos === '扩张') {
        setRel(c, o, -0.3); o.overlord = c.id; o.tech = Math.min(10, o.tech + 0.8);
        o.vassalEv = contactEv[pk(c.id, o.id)] = ev({ y, type: 'subjugate', civ: c.id, other: o.id, sys: hs, pl: hp, cause: c.lastColony,
          sum: `${c.polity()}发现了尚未进入太空的${o.who}，将其收为附庸。`,
          trace: V([
            `${plName(hs, hp)}的轨道上有一座${c.name}的监管站，正下方是${o.who}最古老的聚居地。当地记录里第一次出现「${c.name}」这个名字，是在一份贡赋清单上。`,
            `${o.who}的早期记录里，有一段把天上新出现的光点称作「不动的星」。那是${c.name}的舰队。此后的记录改了口，称它们为「收税的」。`,
          ]) });
        o.lastNeg = o.vassalEv;
      } else {
        const faith = c.ethos === '信仰' && (!o.sp.ethos || o.sp.ethos.includes('信仰'));
        setRel(c, o, 0.5); o.tech = Math.min(10, o.tech + 1.2);
        if (faith && er.chance(0.5)) o.ethos = '信仰';
        o.upliftEv = contactEv[pk(c.id, o.id)] = ev({ y, type: 'uplift', civ: c.id, other: o.id, sys: hs, pl: hp, cause: c.lastColony,
          sum: faith ? `${c.polity()}的传教团降落在${plName(hs, hp)}，给${o.who}带去了信仰，也带去了技术。` : `${c.polity()}与尚未进入太空的${o.who}通商，带去了航天技术。`,
          trace: V([
            `${o.who}最早的一批航天图纸，用的是${c.name}${c.sp.script}，旁边有${o.who}自己加的译注。头几艘飞船的零件规格与${c.name}的完全一致。`,
            solidAt(hs, hp) ? `${plName(hs, hp)}上的一处着陆场，地面被反复起降烧成了玻璃质。周围${o.name}聚落的规模，在此后一代人的时间里扩大了十倍。`
              : `${plName(hs, hp)}附近的一座对接站，两侧的接口规格不同，中间用临时改装的转接段连着。${o.name}此后的造船记录，都从这座站算起。`,
          ]) });
      }
    };

    // ---- 宣战：盟友、宗主和旧怨都会被卷进来 ----
    const ORD = ['二', '三', '四', '五', '六', '七'];
    const declare = (c, o, y, cause, why) => {
      const b = frontier(c, o);
      if (!b.length) return false;
      if (c.trade.has(o.id)) { c.trade.delete(o.id); o.trade.delete(c.id); }
      const s = b[0][0], pl = pickPlanet(s);
      const k = (c.warsWith[o.id] = o.warsWith[c.id] = (c.warsWith[o.id] || 0) + 1);
      const name = k > 1 ? `第${ORD[Math.min(k - 2, 5)]}次${c.name}–${o.name}战争` : `${sysN(b[0][1])}战争`;
      const f = ruler(c, y);
      const we = deed(f, ev({ y, type: 'war', civ: c.id, other: o.id, sys: s, pl, cause,
        sum: `${f ? f.full + '治下的' : ''}${c.polity()}向${o.polity()}宣战${why || ''}。后世称之为${name}。`,
        trace: V([
          `一份宣战文书被铸在金属板上，立在${sysN(s)}的边境哨站。落款是${c.polity()}的最高议事机构，列举了 ${tx.int(3, 9)} 条理由。`,
          `${sysN(s)}的一座哨站里，值班记录在某一天突然改用加密格式。此前最后一条明文是一道来自${c.name}本土的命令，只有一个词。`,
          `${at(s, pl)}的一处集结地，泊位的数量是平时的十倍。补给清单用${c.name}${c.sp.script}写成，收货方是 ${tx.int(3, 12)} 支不同的舰队。`,
          `一枚没有拆封的外交信筒，漂在${sysN(s)}的航道上。里面是${c.name}的最后通牒，期限只给了 ${tx.int(3, 40)} 天。`,
          `${sysN(s)}的界碑被移动过。旧的基座还在原处，新的位置向${o.name}一侧推进了很远，碑文也重刻了。`,
          `一座${o.name}的使馆，撤离得很匆忙，却把所有文件都带走了。只有门口的铭牌被留下，背面用${c.name}${c.sp.script}刻了一个日期。`,
          `${at(s, pl)}的一批征召名册，用${c.name}${c.sp.script}写成，按批次装订。最早的一册很薄，后面的一册比一册厚。`,
        ]) }));
      const w = { a: c.id, b: o.id, sa: [c.id], sb: [o.id], ev: we, start: y, len: er.int(2, 5), over: false, name };
      wars.push(w);
      setRel(c, o, -0.6);
      // 被攻击一方的盟友与宗主
      const helpers = [...o.allies];
      if (o.overlord != null && !helpers.includes(o.overlord)) helpers.push(o.overlord);
      for (const aid of helpers) {
        const A = civs[aid];
        if (!A.alive || aid === c.id || inWar(w, aid) || !A.space) continue;
        const lord = o.overlord === aid, key = pk(o.id, aid);
        if (!lord && (getRel(A, c) > 0.3 || A.stab < 0.3) && er.chance(0.6)) {
          o.allies.delete(aid); A.allies.delete(o.id); setRel(o, A, -0.5);
          o.lastNeg = ev({ y, type: 'betray', civ: aid, other: o.id, sys: A.cap[0], pl: -1, cause: allyEv[key] ?? we,
            sum: `${o.polity()}遭到进攻时，${A.polity()}没有履行盟约。`,
            trace: `${o.name}发往${A.name}的求援信号被完整地接收并存档，共 ${tx.int(7, 60)} 条。存档里没有一条回复。` });
        } else if (lord || er.chance(0.75)) {
          w.sb.push(aid); setRel(A, c, Math.min(getRel(A, c), -0.4));
          const hs = A.cap[0];
          ev({ y, type: 'joinwar', civ: aid, other: o.id, sys: hs, pl: pickPlanet(hs), cause: lord ? (o.vassalEv ?? we) : (allyEv[key] ?? we),
            sum: lord ? `${A.polity()}出兵保护自己的附庸${o.polity()}。` : `${A.polity()}依照盟约，站在${o.polity()}一边参战。`,
            trace: V([
              `${sysN(hs)}的船坞记录显示，一支舰队在这一年整编出发，目的地不在${A.name}自己的疆域内。出发前的训令里引用了一份盟约的条文。`,
              `一批${A.name}制式的补给箱，却堆在${o.name}的仓库规格的货架上。箱子上的封条写着两个文明的名字。`,
            ]) });
        }
      }
      // 进攻一方的盟友
      for (const aid of c.allies) {
        const A = civs[aid];
        if (!A.alive || aid === o.id || inWar(w, aid) || !A.space || getRel(A, o) > 0.1 || !er.chance(0.45)) continue;
        w.sa.push(aid); setRel(A, o, Math.min(getRel(A, o), -0.4));
        const hs = A.cap[0];
        ev({ y, type: 'joinwar', civ: aid, other: c.id, sys: hs, pl: pickPlanet(hs), cause: allyEv[pk(c.id, aid)] ?? we,
          sum: `${A.polity()}加入${c.polity()}一方，对${o.polity()}作战。`,
          trace: `${sysN(hs)}的一份动员令，用${A.name}${A.sp.script}写成。列出的作战目标全部在${o.name}境内，理由一栏只写了「盟约」。` });
      }
      return true;
    };

    const discover = (c, y) => {
      const pool = DISC.filter((d, i) => !c.known.has(i) && (i !== 8 || c.contacted.size) && (i !== 10 || c.dug.size));
      if (!pool.length) return false;
      const d = er.pick(pool); c.known.add(DISC.indexOf(d));
      const f = figure(c, 'scholar', y);
      const s = c.cap[0], pl = c.cap[1];
      c.tech = Math.min(10, c.tech + 0.3);
      c.discEv = deed(f, ev({ y, type: 'discovery', civ: c.id, sys: s, pl, cause: c.tradeEv ?? c.spaceEv ?? c.foundEv,
        sum: `${c.polity()}${f ? '的' + f.full : ''}${d[0]}。`,
        trace: V([
          `一处学术机构的旧址，档案保存完好。其中被引用最多的一份文献，后人称之为《${d[1]}》。${f ? '署名是' + f.name + '。' : '没有署名。'}`,
          `${at(s, pl)}的一批教学用具，推演的都是同一个问题。${c.name}后来的记录把它的答案称作《${d[1]}》，并当作常识使用。`,
        ]) }));
      return true;
    };

    const buildWonder = (c, y) => {
      const s = er.pick([...c.territory]), pl = pickPlanet(s, c.sp.prefer || 'solid');
      const f = ruler(c, y);
      const w = { id: wonders.length, name: properName(c) + er.pick(WONDER[c.sp.kind]), civ: c.id, builder: c.id, sys: s, pl, alive: true };
      wonders.push(w); c.wonderN++;
      w.ev = deed(f, ev({ y, type: 'wonder', wonder: w.id, civ: c.id, sys: s, pl, cause: c.tradeEv ?? c.discEv ?? c.lastColony,
        sum: `${c.polity()}${f ? '在' + f.full + '治下' : ''}建成${w.name}。`,
        trace: K(c, {
          flesh: V([
            `${w.name}占据了${plName(s, pl)}上的一整片高地。结构复杂到需要数月才能完成测绘，表面刻满${c.name}${c.sp.script}，主题是「${c.culture[0]}」。`,
            `${w.name}的主体至今没有坍塌。奠基铭文记着工期：${tx.int(12, 140)} 年。又记着参与者的人数，末尾多写了一个零，又被人划掉了。`,
          ]),
          any: `${w.name}仍在${at(s, pl)}。它的尺度远超过实用所需，上面的${c.name}${c.sp.script}反复记述同一件事：「${c.culture[0]}」。`,
        }) }));
      c.stab += 0.06;
    };

    const enshrine = (c, y, cause) => {
      const s = c.cap[0], pl = c.cap[1];
      const r = { id: relics.length, name: properName(c) + er.pick(RELIC_SP[c.sp.id] || RELIC[c.sp.kind]), origin: c.id, holder: c.id, sys: s, pl, lost: false };
      relics.push(r); c.relic = r;
      r.ev = ev({ y, type: 'relic', relic: r.id, civ: c.id, sys: s, pl, cause,
        sum: `${c.polity()}将「${r.name}」供奉于${plName(s, pl)}。`,
        trace: K(c, {
          flesh: `一座专为一件器物修建的圣龛，内壁的${c.sp.script}称它为「${r.name}」。龛前的地面被跪拜磨出了两道浅槽。`,
          any: `一处层层设防的保管设施，只为存放一件东西。${c.name}${c.sp.script}的记录称它为「${r.name}」，并规定任何时候都必须有守卫在场。`,
        }) });
    };

    // ===== 主循环：每步 50 年 =====
    for (let y = 0; y < PRESENT; y += STEP) {
      for (const s of bStars) if (!s.nova && !reserved.has(s.id) && y >= 300 && er.chance(0.008)) nova(s, y);
      const alive = civs.filter((c) => c.alive && c.origin <= y);
      for (const c of er.shuffle(alive)) {
        if (!c.alive) continue;
        if (!c.founded) {
          c.founded = true; reserved.delete(c.home[0]);
          owner[c.home[0]] = c.id; claim(c.home[0], c);
          const p = systems[c.home[0]].planets[c.home[1]];
          const f = c.sp.kind === 'flesh' && tx.chance(0.6) ? figure(c, 'ruler', y) : null;
          c.ruler = f;
          c.foundEv = deed(f, ev({ y, type: 'found', civ: c.id, sys: c.home[0], pl: c.home[1], cause: null,
            sum: c.sp.foundAt === 'star' ? `${c.species}${c.who}在 ${sysN(c.home[0])} 的恒星日冕中觉醒，建立了${c.polity()}。` : `${c.species}${c.who}在${/[星体界]$/.test(p.climate) ? p.climate : p.climate + '行星'}${plName(c.home[0], c.home[1])}上${c.sp.foundVerb || '崛起'}，建立了${c.polity()}。`,
            trace: `这里发现${c.sp.city}。最古老的部分使用一种早期的${c.sp.script}，其中反复出现「${c.name}」这个名字，旁边是母星的星图。`
              + (f ? V([`铭文把建城归于一位名叫${f.name}的${f.title}。`, `最早的纪年从${f.full}即位那一年算起。`]) : '') }));
          continue;
        }
        // 基础演化
        const nWar = atWar(c);
        c.tech = Math.min(10, c.tech + er.range(c.space ? 0.05 : 0.08, c.space ? 0.19 : 0.24) + c.sp.tech + (c.ethos === '求知' ? 0.06 : 0) + c.trade.size * 0.03);
        c.stab += (c.sp.stab - c.stab) * 0.12 + er.range(-0.06, 0.06) - nWar * 0.05 - Math.max(0, c.territory.size - 6) * 0.012 + c.trade.size * 0.01 + c.allies.size * 0.01 - (c.overlord != null ? 0.02 : 0);
        c.stab = Math.max(0, Math.min(1, c.stab));
        for (const f of c.figs.slice()) if (y - f.y0 >= c.sp.life * STEP) retire(f, c, y);

        // 附庸：宗主倒台则自由，宗主虚弱则反抗
        if (c.overlord != null) {
          const O = civs[c.overlord];
          if (!O.alive) {
            c.overlord = null;
            ev({ y, type: 'free', civ: c.id, other: O.id, sys: c.cap[0], pl: c.cap[1], cause: O.endEv ?? c.vassalEv,
              sum: `${O.name}覆灭之后，${c.polity()}不再向任何人纳贡。`,
              trace: `贡品清单的最后一页是空白的。同一年的记录里，${c.name}第一次没有使用宗主的纪年。` });
            c.stab += 0.1;
          } else if (c.space && !fighting(c, O) && (O.stab < 0.42 || atWar(O) > 0) && c.stab > 0.35 && er.chance(0.3)) {

        if (!c.space && c.tech >= 3) {

                trace: V([

              : V([

            sum: f ? `${f.full}在${c.polity()}境内掀起新的宗教运动，在${sysN(s)}建立圣所。` : `${c.polity()}兴起新的宗教运动，在${sysN(s)}建立圣所。`,

          const ue = ev({ y, type: 'unrest', civ: c.id, sys: s, pl: c.cap[1], cause: c.lastNeg,
            sum: V([`${c.polity()}爆发大规模内乱。`, `${c.polity()}陷入内战。`]),
            trace: c.sp.unrest === SP_DEF.unrest ? V([c.sp.unrest, ...UNREST_ALT]) : V([
              c.sp.unrest, c.sp.unrest,
              `${c.name}${c.sp.script}的记录在这一年分成了两支，彼此不再引用对方。两支都自称正统。`,
              `${at(s, c.cap[1])}的设施被一道临时修筑的屏障一分为二。屏障两侧的遗物属于同一个文明，却朝着相反的方向设防。`,
            ]) });
          c.lastNeg = ue;
          const hd = c.territory.size >= 4 ? hops(s) : null;
          const far = hd ? [...c.territory].filter((x) => x !== s && systems[x].planets.length).sort((a, b) => hd[b] - hd[a]) : [];
          if (far.length >= 2 && er.chance(0.35)) {
            const take = far.slice(0, Math.max(1, Math.floor(far.length / 2)));
            const nhSys = take[0];
            let nhPl = systems[nhSys].planets.findIndex((p) => p.kind === 'rock' || p.kind === 'super');
            if (c.sp.prefer === 'gas' || nhPl < 0) nhPl = pickPlanet(nhSys, c.sp.prefer || 'solid');
            const oldName = c.polity();
            const nc = makeCiv([nhSys, nhPl], y, c, c.sp);
            nc.founded = true; nc.space = true; nc.stab = 0.6;
            nc.territory.clear();
            for (const x of take) { c.territory.delete(x); nc.territory.add(x); owner[x] = nc.id; }
            nc.contacted.add(c.id); c.contacted.add(nc.id); setRel(c, nc, -0.4);
            const f = figure(nc, 'ruler', y); nc.ruler = f;
            nc.foundEv = deed(f, ev({ y, type: 'schism', civ: nc.id, other: c.id, sys: nhSys, pl: nhPl, cause: ue,
              sum: `${oldName}的边远殖民地${f ? '在' + f.full + '带领下' : ''}宣布独立，成立${nc.polity()}。`,
              trace: V([
                `一份独立宣言的原件保存在真空柜中。签名者全部来自边缘星系，使用的是${c.name}${c.sp.script}的一种变体。`,
                `${at(nhSys, nhPl)}的一幅星图，只画到本地为止。星图之外的部分是被裁掉的，裁下来的那一半没有找到。`,
              ]) }));
            nc.lastColony = nc.foundEv;
            contactEv[pk(c.id, nc.id)] = nc.foundEv;
            c.stab += 0.18;
          } else if (er.chance(0.4)) {
            const old = c.polity();
            c.society = er.pick(c.sp.pol.filter((k) => k !== c.society));
            if (c.ruler) retire(c.ruler, c, y, true);
            const f = figure(c, 'ruler', y); c.ruler = f;
            c.coupEv = deed(f, ev({ y, type: 'coup', civ: c.id, sys: s, pl: c.cap[1], cause: ue,
              sum: f ? `${f.full}推翻了${old}，建立${c.polity()}。` : `${old}被推翻，${c.polity()}取而代之。`,
              trace: K(c, {
                flesh: V([
                  `前任统治者的雕像被推倒，基座被重新刻上了「${c.polity()}」的名字。`,
                  `官署的大门换过一次，旧门被砌进了新门旁边的墙里。新门的门楣上刻着「${c.polity()}」。`,
                ]),
                any: `官方记录的抬头在这一年换成了「${c.polity()}」。此前的记录没有销毁，只是被统一移到了最底层。`,
              }) }));
            c.stab += 0.25;
          }
          continue;
        }
        if (c.tech >= c.sp.vanish && er.chance(0.02)) {
          const s = c.cap[0], pl = c.cap[1];
          const ve = ev({ y, type: 'vanish', civ: c.id, sys: s, pl, cause: c.discEv ?? c.lastColony,
            sum: `${c.polity()}在数年之内停止了一切通讯，原因不明。`,
            trace: V([
              `所有设施完好无损，能源系统仍在运转，但没有任何居民。最后一条公开广播只有一行数学公式。`,
              `${at(s, pl)}的一切都停在原位，没有打斗或撤离的痕迹。${c.name}${c.sp.script}的最后一条记录是一个问句，没有人作答。`,
            ]) });
          c.alive = false; c.endYear = events[ve].y; c.fate = '消失'; c.endEv = ve;
          for (const x of c.territory) { owner[x] = null; ruins[x].add(c.id); }
          c.territory.clear();
          for (const w of wars) { if (w.over) continue; if (w.a === c.id || w.b === c.id) w.over = true; else { w.sa = w.sa.filter((x) => x !== c.id); w.sb = w.sb.filter((x) => x !== c.id); } }
          for (const a of c.allies) civs[a].allies.delete(c.id);
          c.allies.clear();
          dropRelics(c, ve, y);
          continue;
        }
        if (c.stab < 0.1) collapse(c, y, c.lastNeg, false);
      }

      // 战争推进
      for (const w of wars) {
        if (w.over) continue;
        const A = civs[w.a], B = civs[w.b];
        if (!A.alive || !B.alive) { w.over = true; continue; }
        const str = (c) => c.tech * (1 + c.territory.size * 0.3) * (0.5 + c.stab) * er.range(0.7, 1.3);
        const side = (ids, main) => ids.reduce((t, id) => t + (civs[id].alive ? str(civs[id]) * (id === main ? 1 : 0.5) : 0), 0);
        const b = frontier(A, B);
        if (b.length && er.chance(0.36)) {
          const [s] = er.pick(b), pl = pickPlanet(s);
          const [bw, bl] = er.chance(0.5) ? [A, B] : [B, A];
          const f = bw.figs.find((x) => x.role === 'commander') || (tx.chance(0.5) ? figure(bw, 'commander', y) : null);
          const be = deed(f, ev({ y, type: 'battle', civ: w.a, other: w.b, sys: s, pl, cause: w.ev,
            sum: V([
              `${A.who}与${B.who}的舰队在${sysN(s)}星系交战。`,
              `${bw.who}${f ? '的' + f.full : ''}在${sysN(s)}星系击退了${bl.who}的舰队。`,
              `${w.name}中，双方在${sysN(s)}星系打了一场没有结果的会战。`,
            ]),
            trace: V([
              `${plName(s, pl)}附近散布着大量舰船残骸，分属两种不同的工艺体系。部分残骸仍在缓慢旋转。`,
              `${plName(s, pl)}的轨道上有一条细长的碎片带，成分与自然形成的星环不符。最大的一块上还能辨认出${bl.name}的舷号。`,
              `一艘${bl.name}的战舰，舰体被整齐地切成两段。舰桥的日志停在交战开始后的第 ${tx.int(4, 55)} 分钟。`,
              `${sysN(s)}的一座野战修理站，泊位上还系着 ${tx.int(3, 20)} 艘没修完的${bw.name}战舰。备件库是空的。`,
              `一片漂浮的墓标，每一枚都刻着舰名和日期，日期全部相同。制式是${bl.name}的，立标的却是${bw.who}。`,
              `${plName(s, pl)}的拉格朗日点上有一座被击穿的指挥站。作战图还亮着，上面${bl.name}的舰队标记停在原地，没有来得及移动。`,
              solidAt(s, pl) ? `${plName(s, pl)}上有一片被轨道轰炸过的平原，弹坑排成规则的行列。坑底的残片出自${bw.name}的弹药。`
                : `${plName(s, pl)}的云层之上漂着一片救生舱，舱门都开着。舱体的制式属于${bl.name}，没有一个舱里留着记录。`,
            ]) }));
          A.lastNeg = be; B.lastNeg = be; bl.stab -= 0.03;
        }
        if ((y - w.start) / STEP < w.len) continue;
        w.over = true;
        const sa = side(w.sa, w.a), sb = side(w.sb, w.b);
        const endY = yearOf(y, w.ev), yrs = Math.max(1, endY - events[w.ev].y);
        if (w.indep) {
          // 附庸的独立战争：守方只要不输就算赢
          if (sa > sb * 0.75) {
            A.overlord = null; setRel(A, B, -0.3); A.stab += 0.15; B.stab -= 0.1;
            B.lastNeg = ev({ y, at: endY, type: 'indep', civ: A.id, other: B.id, sys: A.cap[0], pl: A.cap[1], cause: w.ev,
              sum: `${A.polity()}赢得独立，不再向${B.polity()}纳贡。`,
              trace: `贡品清单在这一年中断。最后一行之后，有人用${A.name}${A.sp.script}补了一句话，只有两个词。` });
          } else {
            A.stab -= 0.2;
            A.lastNeg = ev({ y, at: endY, type: 'crush', civ: B.id, other: A.id, sys: A.cap[0], pl: A.cap[1], cause: w.ev,
              sum: `${B.polity()}镇压了${A.polity()}的反抗。`,
              trace: `反抗持续了 ${yrs} 年。此后的贡品清单上，数目比从前多了一倍，字迹换成了${B.name}${B.sp.script}。` });
          }
          continue;
        }
        const [win, lose] = sa > sb ? [A, B] : [B, A];
        const take = [...new Set(frontier(win, lose).map((x) => x[1]))].slice(0, er.int(1, 3));
        if (take.length && Math.max(sa, sb) / Math.min(sa, sb) > 1.2) {
          for (const s of take) { lose.territory.delete(s); win.territory.add(s); owner[s] = win.id; ruins[s].add(lose.id); }
          const s = take[0], pl = pickPlanet(s, 'solid');
          const f = win.figs.find((x) => x.role === 'commander');
          const names = take.map((t) => sysN(t)).join('、');
          const ce = deed(f, ev({ y, at: endY, type: 'conquest', civ: win.id, other: lose.id, sys: s, pl, cause: w.ev,
            sum: V([
              `${win.polity()}击败${lose.polity()}，夺取了${names}。`,
              `${w.name}打了 ${yrs} 年，以${win.polity()}的胜利告终，${lose.polity()}割让${names}。`,
              f ? `${f.full}率${win.who}舰队攻占${names}，${lose.polity()}战败。` : `${win.who}的舰队攻占${names}，${lose.polity()}战败。`,
            ]),
            trace: V([
              `这里有两层截然不同的遗迹：底层属于${lose.who}，上层由${win.who}改建。许多${lose.name}${lose.sp.script}被刻意抹去。`,
              `${at(s, pl)}，${lose.name}的设施被改作他用。入口处原有的${lose.sp.script}被凿平，新刻的${win.sp.script}只有原来一半深。`,
              `一份投降文书的副本，用${lose.name}${lose.sp.script}写成，页边有${win.who}加注的译文。割让的星系列了 ${take.length} 个。`,
            ]) }));
          const capLost = take.includes(lose.cap[0]);
          lose.stab -= capLost ? 0.35 : 0.15; lose.lastNeg = ce; win.stab += 0.04;
          // 奇观：毁于战火，或者易主
          for (const wd of wonders) {
            if (!wd.alive || !take.includes(wd.sys) || wd.civ !== lose.id) continue;
            if (er.chance(0.45)) {
              wd.alive = false;
              lose.lastNeg = ev({ y, type: 'sack', wonder: wd.id, civ: win.id, other: lose.id, sys: wd.sys, pl: wd.pl, cause: ce,
                sum: `${win.who}攻占${sysN(wd.sys)}时，${wd.name}被毁。`,
                trace: `${wd.name}的残骸。承重结构是被定向炸断的，不是自然坍塌。碎块上的${civs[wd.builder].name}${civs[wd.builder].sp.script}还可以拼读。` });
              lose.grudge = win.id; lose.grudgeEv = lose.lastNeg;
            } else wd.civ = win.id;
          }
          // 圣物：被夺走，或者被夺回
          for (const r of relics) {
            if (r.lost || r.holder !== lose.id || !(take.includes(r.sys) || r.origin === win.id)) continue; // 失主打赢了，归还圣物就是和约的一部分
            const from = [r.sys, r.pl], back = r.origin === win.id;
            r.holder = win.id; r.sys = win.cap[0]; r.pl = win.cap[1];
            if (back) {
              ev({ y, type: 'reclaim', relic: r.id, civ: win.id, other: lose.id, sys: r.sys, pl: r.pl, cause: ce,
                sum: `${win.polity()}夺回了「${r.name}」。`,
                trace: `「${r.name}」回到了原处。基座上原有的轮廓与它严丝合缝，只是旁边多了一道修补过的裂痕。` });
              if (win.grudge === lose.id) { win.grudge = null; win.relicLost = null; }
              win.stab += 0.1;
            } else {
              const le = ev({ y, type: 'loot', relic: r.id, civ: win.id, other: lose.id, sys: from[0], pl: from[1], cause: ce,
                sum: `${win.polity()}夺走了${lose.who}的「${r.name}」。`,
                trace: `保管「${r.name}」的地方是空的。基座上留着一个轮廓，周围的防护是从外面被破开的。` });
              ev({ y, type: 'trophy', relic: r.id, civ: win.id, other: lose.id, sys: r.sys, pl: r.pl, cause: le,
                sum: `「${r.name}」被陈列在${plName(r.sys, r.pl)}，作为战胜${lose.polity()}的纪念。`,
                trace: `一件明显不属于这里的器物，表面是${civs[r.origin].name}${civs[r.origin].sp.script}。陈列它的底座上另有一行${win.name}${win.sp.script}，记着夺得它的年份。` });
              if (r.origin === lose.id) { lose.grudge = win.id; lose.grudgeEv = le; lose.relicLost = r; lose.lastNeg = le; }
            }
          }
          if (lose.territory.size === 0 || (capLost && lose.territory.size <= 1)) {
            for (const s2 of lose.territory) { owner[s2] = win.id; win.territory.add(s2); }
            lose.territory.clear();
            collapse(lose, y, ce, true);
          } else {
            if (capLost) moveCapital(lose, y, ce);
            if (!lose.territory.has(lose.cap[0])) { const s2 = [...lose.territory][0]; lose.cap = [s2, pickPlanet(s2, lose.sp.prefer || 'solid')]; }
            if (lose.stab < 0.32 && lose.overlord == null && win.overlord == null && er.chance(0.55)) {
              lose.overlord = win.id; lose.allies.forEach((a) => civs[a].allies.delete(lose.id)); lose.allies.clear();
              lose.vassalEv = lose.lastNeg = ev({ y, type: 'vassal', civ: lose.id, other: win.id, sys: lose.cap[0], pl: lose.cap[1], cause: ce,
                sum: `战败的${lose.polity()}向${win.polity()}称臣纳贡。`,
                trace: V([
                  `一份逐年续写的贡品清单，用${win.name}${win.sp.script}和${lose.name}${lose.sp.script}对照记录。头一年的数目被划掉，改成了更大的数字。`,
                  `${at(lose.cap[0], lose.cap[1])}有一座${win.name}样式的建筑，位置比${lose.name}自己的中枢还要高。里面只有一间屋子，用来清点贡品。`,
                ]) });
            }
          }
        } else {
          const s = frontier(A, B)[0]?.[0] ?? A.cap[0], pl = pickPlanet(s, 'solid');
          const pe = ev({ y, at: endY, type: 'peace', civ: w.a, other: w.b, sys: s, pl, cause: w.ev,
            sum: V([
              `${A.polity()}与${B.polity()}签订停战协定，边界维持原状。`,
              `${w.name}打了 ${yrs} 年，${A.polity()}与${B.polity()}最终停战，谁也没有得到新的领土。`,
            ]),
            trace: V([
              `一块界碑立在${sysN(s)}，两侧分别用${A.name}${A.sp.script}和${B.name}${B.sp.script}标出各自的疆域。`,
              `${sysN(s)}的一座中立空间站，会议厅的两端各有一套规格不同的设施。停战文本的两种版本并排镶在墙上，条款数目相同。`,
              `${at(s, pl)}的一片战俘营旧址，两种制式的营房隔着一条空地相对。交换名单上的人数，两边恰好相等。`,
            ]) });
          setRel(A, B, -0.05);
          A.lastNeg = pe; B.lastNeg = pe;
          const r = A.relicLost;
          if (A.grudge === B.id && r && r.holder === B.id && !r.lost && er.chance(0.6)) {
            r.holder = A.id; r.sys = A.cap[0]; r.pl = A.cap[1]; A.grudge = null; A.relicLost = null; A.stab += 0.1;
            ev({ y, type: 'reclaim', relic: r.id, civ: A.id, other: B.id, sys: r.sys, pl: r.pl, cause: pe,
              sum: `作为停战的条件，${B.polity()}把「${r.name}」还给了${A.polity()}。`,
              trace: `「${r.name}」回到了原处。随它一同送回的还有一只${B.name}样式的匣子，里面是空的。` });
          }
        }
        (A.peaceAt = A.peaceAt || {})[B.id] = y; (B.peaceAt = B.peaceAt || {})[A.id] = y;
      }
    }

    // 起点：离所有母星都远、且邻近有遗迹的星系
    const traceSys = new Set(events.map((e) => e.sys));
    const hd = civs.map((c) => hops(c.home[0]));
    let start = 0, best = -1;
    for (const s of systems) {
      if (s.type === 'S') continue;
      const m = Math.min(...hd.map((h) => h[s.id]));
      const near = adj[s.id].some((x) => traceSys.has(x)) ? 2 : 0;
      const sc = Math.min(m, 4) + near / 2 + (traceSys.has(s.id) ? 3 : 0);
      if (sc > best) { best = sc; start = s.id; }
    }

    // ===== 探索期：存续的文明继续演化，以 10 天为一步，预先推演 10 年 =====
    // 十年相对于三千年只是一瞬：每个文明大约每年做一次决定，战争以月计
    const histCount = events.length;
    const LIVE_DAYS = 3650, DSTEP = 10;
    const baseOwner = owner.slice();
    for (const s of systems) { s.name0 = s.name; s.catalog0 = s.catalog; s.renames = []; }
    for (const c of civs) { c.alive0 = c.alive; c.society0 = c.society; }
    const lr = R(seed, 'live');
    let LD = 0;
    const lev = (o) => { o.live = true; o.day = LD; o.y = PRESENT + Math.floor(LD / 365); return ev(o); };
    const liveClaim = (sid, c) => {
      const s = systems[sid];
      if (!s.catalog) return null;
      const old = s.name; claim(sid, c); s.renames.push({ day: LD, name: s.name, by: c.id });
      return old;
    };
    const lwars = [];
    const lfighting = (a, b) => lwars.some((w) => !w.over && pk(w.a, w.b) === pk(a.id, b.id));
    const endCiv = (c, fate, own) => {
      c.alive = false; c.endDay = LD; c.endYear = PRESENT + Math.floor(LD / 365); c.fate = fate;
      for (const s of c.territory) { owner[s] = null; ruins[s].add(c.id); own.push([s, null]); }
      c.territory.clear();
      for (const a of c.allies) civs[a].allies.delete(c.id);
      c.allies.clear();
      for (const w of lwars) if (!w.over && (w.a === c.id || w.b === c.id)) w.over = true;
    };
    const PROJECTS = ['第一座跃迁信标', '环绕母星的轨道环', '一座深空观测阵列', '一张恒星能量收集网', '一座行星级档案库', '一条连接两颗行星的货运缆索', '一座恒星际中继站'];
    for (const c of civs) c.nextDay = lr.int(20, 600);
    for (LD = DSTEP; LD <= LIVE_DAYS; LD += DSTEP) {
      const alive = civs.filter((c) => c.alive);
      for (const c of lr.shuffle(alive)) {
        if (!c.alive) continue;
        const nWar = lwars.filter((w) => !w.over && (w.a === c.id || w.b === c.id || w.help.includes(c.id))).length;
        c.tech = Math.min(10, c.tech + 0.003 + c.sp.tech * 0.02);
        c.stab = Math.max(0, Math.min(1, c.stab + (c.sp.stab - c.stab) * 0.015 + lr.range(-0.018, 0.018) - nWar * 0.002));
        for (const oid of c.contacted) { const o = civs[oid]; if (o.alive) setRel(c, o, getRel(c, o) * 0.998 + lr.range(-0.012, 0.012)); }
        // 新的接触
        if (c.space) {
          const meet = new Map();
          for (const x of c.territory) for (const m of near2[x]) { const oid = owner[m]; if (oid != null && oid !== c.id && !c.contacted.has(oid) && civs[oid].alive && civs[oid].space && !meet.has(oid)) meet.set(oid, x); }
          for (const [oid, s] of meet) {
            const o = civs[oid];
            c.contacted.add(o.id); o.contacted.add(c.id); setRel(c, o, relInit(c, o));
            contactEv[pk(c.id, o.id)] = lev({ type: 'contact', civ: c.id, other: o.id, sys: s, pl: pickPlanet(s), cause: c.lastColony,
              sum: `${c.polity()}与${o.polity()}在${sysN(s)}星系首次接触。`,
              trace: V([
